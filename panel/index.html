<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel · LORENZO Agency</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg0:#0B0C0E; --bg1:#121316; --card:rgba(255,255,255,.028);
  --fg:#EFF0F3; --muted:#93969D; --faint:#6A6D74;
  --hair:rgba(236,238,243,.14); --hair2:rgba(236,238,243,.08);
  --accent:#DD7D47;
  --ok:#4CC38A; --warn:#E5B454; --bad:#E5604C; --info:#6AA5E8;
  --disp:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 85% -10%,rgba(232,235,242,.06),transparent 45%),var(--bg0);
  color:var(--fg);font-family:var(--disp);font-size:14px;min-height:100vh;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:22px 0 18px;border-bottom:1px solid var(--hair2)}
.wordmark b{font-weight:600;font-size:13px;letter-spacing:.2em}
.wordmark span{color:var(--muted);font-size:10px;letter-spacing:.3em;margin-left:10px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}
nav button{background:none;border:1px solid var(--hair2);color:var(--muted);font-family:var(--mono);
  font-size:11px;letter-spacing:.14em;padding:9px 16px;border-radius:999px;cursor:pointer}
nav button.on{color:var(--fg);border-color:var(--accent);background:rgba(221,125,71,.08)}
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;
  margin-left:8px;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--disp);font-size:11px;
  font-weight:700;line-height:1;vertical-align:middle}
.lsel{background:var(--bg1);border:1px solid var(--hair);border-radius:7px;color:var(--fg);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.08em;padding:6px 8px;text-transform:uppercase;width:auto;cursor:pointer}
.linkbtn{background:none;border:none;color:var(--accent);font-family:var(--disp);font-size:12.5px;text-align:left;
  cursor:pointer;padding:0;text-decoration:none}
.linkbtn:hover{text-decoration:underline}
.telink{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;white-space:nowrap}
.telink:hover{text-decoration:underline}
.btn-trad{color:var(--info);border-color:rgba(106,165,232,.5)!important}
.btn-trad:hover{background:rgba(106,165,232,.12)}
.tradhint{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--info);background:rgba(106,165,232,.1);border:1px solid rgba(106,165,232,.3);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.langchip{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;border-radius:999px;padding:3px 9px;cursor:pointer;background:transparent;transition:.15s}
.langchip.es{color:#67c998;border:1px solid rgba(103,201,152,.45)}
.langchip.es:hover{background:rgba(103,201,152,.12)}
.langchip.en{color:var(--info);border:1px solid rgba(106,165,232,.45)}
.langchip.en:hover{background:rgba(106,165,232,.12)}
/* embudo */
.fchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.fchip{background:none;border:1px solid var(--hair2);color:var(--muted);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;padding:7px 12px;border-radius:999px;cursor:pointer;text-transform:uppercase}
.fchip.on{color:var(--fg);border-color:var(--accent);background:rgba(221,125,71,.08)}
.fchip b{font-family:var(--disp);font-weight:700;margin-left:4px}
.fchip.hot{border-color:rgba(221,125,71,.5)}
.fchip.hot.on{background:rgba(221,125,71,.14)}
/* franjas (secciones por estado) */
.franja{margin-bottom:12px}
.franja-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair);
  color:var(--fg);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 4px;cursor:pointer;text-align:left}
.franja-h b{margin-left:auto;font-family:var(--disp);font-weight:700;color:var(--muted);font-size:13px}
.franja.hot .franja-h{color:var(--accent)}
.franja.hot .franja-h b{color:var(--accent)}
.chev{display:inline-block;transition:transform .18s;color:var(--accent);font-size:12px}
.chev.o{transform:rotate(90deg)}
/* barra de interés */
.ibar{width:66px;height:7px;background:var(--hair2);border-radius:99px;overflow:hidden}
.ifill{height:100%;border-radius:99px;transition:width .25s}
.ifill.amber{background:var(--warn)}
.ifill.orange{background:var(--accent)}
.imini{display:inline-flex;align-items:center;gap:7px}
.imini .n{font-family:var(--mono);font-size:10px;color:var(--faint)}
/* barra de cierre (avance hacia la venta) */
.cbar-wrap{margin:14px 0;padding:12px 14px;border:1px solid var(--hair2);border-radius:10px}
.cbar-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.cbar{height:9px;background:var(--hair2);border-radius:99px;overflow:hidden}
.cbar-f{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.cbar-f.ok{background:var(--ok)} .cbar-f.bad{background:var(--bad)}
.cbar-l{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--fg);margin-top:7px}
.cbar-falta{font-size:12px;color:var(--muted);margin-top:5px}
.cbar-sug{margin-top:11px;padding:10px 12px;border:1px dashed var(--hair2);border-radius:8px;font-size:12.5px;line-height:1.55;color:var(--fg)}
.cbar-sug-a{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.cbar-set{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cbar-set input{flex:1 1 100%;background:rgba(0,0,0,.25);border:1px solid var(--hair2);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:12px}
.lmodal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50}
.lcard{background:linear-gradient(180deg,rgba(32,33,38,.78),rgba(16,17,20,.82));
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:26px 30px;max-width:1120px;width:100%;
  max-height:90vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08)}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.lname{font-size:18px;font-weight:700}
.lmeta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.lcontact{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#C9CBD1;margin-bottom:14px;padding-bottom:14px;
  border-bottom:1px solid var(--hair2)}
.lcontact span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin-right:4px}
.lmsg{font-size:19px;line-height:1.5;color:var(--fg);font-weight:500;white-space:pre-wrap;word-break:break-word;margin:6px 0 6px}
.lreplied{margin:16px 0 0;border-left:2px solid var(--accent);padding:2px 0 2px 12px}
.lreplied-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:5px}
.lreplied-b{font-size:14px;line-height:1.55;color:#C9CBD1;white-space:pre-wrap;word-break:break-word}
/* respuesta sugerida */
.lreplywrap{margin:18px 0 22px;border-top:1px solid var(--hair2);padding-top:18px}
.lreplyhead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;
  margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lreplyhead .c{color:var(--accent)}
.lreply{min-height:220px;font-size:15px;line-height:1.6;resize:vertical;color:#F2F3F6;border-radius:14px;padding:16px 18px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 12px 40px rgba(0,0,0,.35)}
.lreply:focus{outline:none;border-color:rgba(221,125,71,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 3px rgba(221,125,71,.14), 0 12px 40px rgba(0,0,0,.35)}
.lreplyactions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.lsent{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin-left:auto}
.lactions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--hair2);padding-top:16px}
.btn-reply{background:none;color:#C9CBD1;border:1px solid var(--hair);border-radius:8px;padding:9px 14px;font-weight:600;
  font-size:12.5px;font-family:var(--disp);text-decoration:none;cursor:pointer;transition:border-color .18s,color .18s}
.btn-reply:hover{border-color:var(--accent);color:var(--accent)}
.lrubro{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
  border:1px solid var(--hair);border-radius:999px;padding:3px 9px;text-transform:uppercase;white-space:nowrap}
.btn-trash{background:rgba(229,96,76,.12);border:1px solid rgba(229,96,76,.4);color:var(--bad);
  border-radius:8px;padding:9px 13px;font-size:15px;line-height:1;cursor:pointer}
.btn-trash:hover{background:rgba(229,96,76,.22)}
.lactions .btn-trash{margin-left:auto}
.rowactions .btn-trash{padding:6px 9px;font-size:13px}
.btn-trash{display:inline-flex;align-items:center;justify-content:center}
.btn-del{display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.btn-del:hover{color:var(--bad);border-color:rgba(229,96,76,.4)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.stat{background:var(--card);border:1px solid var(--hair2);border-radius:10px;padding:18px}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.stat .v{font-size:26px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--faint);margin-top:4px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-size:17px;font-weight:700;letter-spacing:.02em}
.bar .tick{display:inline-block;width:18px;height:2px;background:var(--accent);margin-right:10px;vertical-align:middle}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;
  font-size:13px;cursor:pointer;font-family:var(--disp)}
.btn.ghost{background:none;border:1px solid var(--hair);color:var(--fg)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{background:rgba(229,96,76,.15);color:var(--bad);border:1px solid rgba(229,96,76,.4)}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{background:var(--bg1);border:1px solid var(--hair);border-radius:8px;color:var(--fg);
  padding:10px 12px;font-family:var(--disp);font-size:13px;width:100%}
textarea{min-height:70px;resize:vertical}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;
  text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--hair)}
td{padding:12px 10px;border-bottom:1px solid var(--hair2);font-size:13px;vertical-align:top}
td.money{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}
th.r{text-align:right}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:4px 10px;
  border-radius:999px;border:1px solid;cursor:pointer;user-select:none;white-space:nowrap}
.p-borrador,.p-nuevo{color:var(--muted);border-color:var(--hair)}
.p-enviada,.p-contactado,.p-respondido{color:var(--info);border-color:rgba(106,165,232,.45)}
.p-aprobada,.p-pagada,.p-cerrado{color:var(--ok);border-color:rgba(76,195,138,.45)}
.p-rechazada,.p-vencida{color:var(--bad);border-color:rgba(229,96,76,.45)}
.p-pendiente{color:var(--warn);border-color:rgba(229,180,84,.45)}
.panel{background:var(--card);border:1px solid var(--hair2);border-radius:12px;padding:20px;margin-bottom:20px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:block}
.form .fl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);
  text-transform:uppercase;margin-bottom:6px;display:block}
.empty{border:1px dashed var(--hair);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg)}
.rowactions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tablewrap{overflow-x:auto}
.clientcard{background:var(--card);border:1px solid var(--hair2);border-radius:12px;padding:18px}
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.clientcard h3{font-size:15px;font-weight:700}
.clientcard .co{color:var(--muted);font-size:12.5px;margin-top:2px}
.clientcard .kv{margin-top:10px;font-size:12.5px;line-height:1.7;color:#C9CBD1;word-break:break-word}
.clientcard .kv span{color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.1em;margin-right:6px}
.notes{margin-top:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--hair2);padding-top:8px;white-space:pre-wrap}
.offline{padding:40px 20px;text-align:center;color:var(--muted)}
.confirmrow{background:rgba(229,96,76,.06)}
.cpop-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.cpop{background:var(--bg1);border:1px solid var(--hair);border-radius:14px;padding:20px 22px;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cpop-t{font-size:15px;font-weight:700;margin-bottom:4px}
.cpop-s{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.cpop-a{display:flex;gap:10px;justify-content:flex-end}
.hchip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;border:1px solid var(--hair2);color:var(--muted);white-space:nowrap}
.hchip.hot{color:var(--accent);border-color:rgba(221,125,71,.5);background:rgba(221,125,71,.10)}
.tline{margin:18px 0 0;border-top:1px solid var(--hair2);padding-top:16px}
.tline-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.tl{display:flex;gap:11px;margin-bottom:11px}
.tl-dot{width:7px;height:7px;border-radius:99px;background:var(--accent);margin-top:6px;flex:0 0 auto}
.tl-b{font-size:12.5px;color:#C9CBD1;line-height:1.5}
.tl-b .w{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.1em;display:block;margin-bottom:2px}
.login{max-width:360px;margin:12vh auto 0;padding:0 20px}
.login .box{background:var(--card);border:1px solid var(--hair2);border-radius:14px;padding:26px}
.login h1{font-size:13px;letter-spacing:.2em;font-weight:600;margin-bottom:2px}
.login .sub{color:var(--muted);font-size:12px;letter-spacing:.2em;font-family:var(--mono);margin-bottom:22px}
.login label{display:block;margin-bottom:14px}
.login .fl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block}
.login .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}
@media(max-width:480px){.bar h2{font-size:15px}}
footer{margin-top:40px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--hair2);padding-top:12px}
</style>

<body>
<div id="root"><div class="offline">Cargando el panel…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";

/* ---------- Supabase ---------- */
const cfg = window.LORENZO_CONFIG || {};
let sb = null;
const configured = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf("PEGAR_") !== 0;
if(configured){ sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY); }

const YEAR = new Date().getFullYear();
let isAdmin = false, canWrite = false, goal = 0, sessionEmail = "";
let proposals = [], invoices = [], clients = [], leads = [];
let tab = "resumen";
let editing = null, confirmDel = null, formOpen = null, openLeadId = null;
let leadFilter = "todos";
let leadCollapsed = {};
let touches = [];
let callLeadId = null, closeLeadId = null;
let tradActivo = false, tradOriginal = "", tradShown = "";
let transcribiendo = false, transcripcion = "", recog = null;

/* ---------- Transcripción en vivo de llamadas (Web Speech API) ----------
   Convierte lo que capta el micrófono a TEXTO en tiempo real. No guarda audio.
   La llamada va en altavoz cerca de la compu, y hay que avisar al cliente (ley de FL). */
function startTranscripcion(lang){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ note("Este navegador no soporta transcripción en vivo — usá Chrome o Edge."); return false; }
  const ta = document.getElementById("callnote");
  transcripcion = (ta && ta.value) ? ta.value.trim()+" " : "";
  recog = new SR();
  recog.lang = lang === "en" ? "en-US" : "es-US";
  recog.continuous = true; recog.interimResults = true;
  recog.onresult = (e)=>{
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) transcripcion += r[0].transcript.trim()+"\n"; // cada frase en su línea (ayuda a separar turnos)
      else interim += r[0].transcript;
    }
    const t = document.getElementById("callnote");
    if(t){ t.value = transcripcion + interim; t.scrollTop = t.scrollHeight; }
  };
  recog.onerror = (e)=>{ if(e.error !== "no-speech" && e.error !== "aborted") note("Transcripción: "+e.error); };
  recog.onend = ()=>{ if(transcribiendo && recog){ try{ recog.start(); }catch(_e){} } }; // el navegador corta solo; relanzar
  try{ recog.start(); }catch(_e){}
  transcribiendo = true;
  return true;
}
function stopTranscripcion(){
  transcribiendo = false;
  if(recog){ try{ recog.stop(); }catch(_e){} recog = null; }
}
const CAD_DIAS = [0,1,3,5,7,10,14];
const CAD_TIPO = ["mail","llamada","mail","llamada","mail","llamada","mail"];
const CALL_RES = {atendio_interesado:"Atendió interesado",atendio_frio:"Atendió frío",no_atendio:"No atendió",mensaje:"Dejé mensaje",agendo:"Agendó reunión"};
const CIERRE_MOTIVOS = ["precio","timing","eligió a otro","no era el momento","desapareció","otro"];
// avanza la cadencia: completó el paso actual -> devuelve el patch para el próximo toque
function avanzarCadencia(paso){
  const next = (Number(paso)||0)+1;
  if(next>=CAD_DIAS.length) return { cadencia_paso:next, next_action_at:null, next_action_tipo:null, seguimiento_activo:false };
  const gap = CAD_DIAS[next]-CAD_DIAS[next-1];
  const d=new Date(); d.setDate(d.getDate()+gap);
  return { cadencia_paso:next, next_action_at:d.toISOString(), next_action_tipo:CAD_TIPO[next], seguimiento_activo:true };
}
const touchesOf = id => touches.filter(t=>t.leadId===id);

const P_STATES = ["borrador","enviada","aprobada","rechazada"];
const I_STATES = ["pendiente","pagada","vencida"];
/* Embudo de leads — 6 estados */
const L_STATES = ["nuevo","enviado","respondio","sin_respuesta","ganado","perdido"];

/* Detección de idioma (ES/EN) — heurística, gratis e instantánea. Facu puede corregir tocando el chip. */
function detectLang(txt){
  const t=" "+String(txt||"").toLowerCase()+" ";
  if(!t.trim()) return "es";
  let es=0, en=0;
  if(/[ñáéíóúü¿¡]/.test(t)) es+=3;
  const ES=[" que "," los "," las "," una "," para "," con "," por "," pero "," como "," tengo "," quiero "," hola "," gracias "," cuánto "," cuanto "," precio "," necesito "," hacer "," están "," estan "," muy "," más "," mas "," también "," tambien "," cómo "," buenas "," saludos "];
  const EN=[" the "," you "," your "," and "," for "," with "," have "," want "," hello "," hi "," thanks "," thank "," how "," much "," price "," need "," would "," could "," please "," we "," our "," about "," looking "," interested "];
  for(const w of ES) if(t.includes(w)) es++;
  for(const w of EN) if(t.includes(w)) en++;
  if(es===en) return "es"; // empate -> español (Facu es el default)
  return es>en ? "es" : "en";
}
// Idioma efectivo de un lead: lo guardado, o la detección sobre su mensaje.
const langOf = l => l.idioma || detectLang(l.message||"");
// Chip visual ES/EN (clickable para corregir). who: 'vos' (ES) / 'closer' (EN)
function langChip(l){
  const lg=langOf(l);
  const who = lg==="es" ? "llamás vos" : "closer EN";
  return `<button class="langchip ${lg}" data-togglelang="${l.id}" title="Idioma del lead — ${lg==='es'?'español':'inglés'}. Tocá para cambiar.">${lg.toUpperCase()} · ${who}</button>`;
}

function nextNumber(list, prefix){
  let max = 0;
  for(const d of list){
    const m = String(d.number||"").match(new RegExp("^"+prefix+"-(\\d{4})-(\\d+)$"));
    if(m && Number(m[1])===YEAR) max = Math.max(max, Number(m[2]));
  }
  return prefix+"-"+YEAR+"-"+String(max+1).padStart(3,"0");
}

/* ---------- carga de datos ---------- */
async function loadAll(){
  if(!sb) return;
  const pr = await sb.from("proposals").select("*").order("created_at",{ascending:false});
  proposals = (pr.data||[]).map(FROM.proposals);
  if(isAdmin){
    const [inv, cl, ld, st, tc] = await Promise.all([
      sb.from("invoices").select("*").order("created_at",{ascending:false}),
      sb.from("clients").select("*").order("created_at",{ascending:false}),
      sb.from("leads").select("*").order("created_at",{ascending:false}),
      sb.from("settings").select("*").eq("key","goal").maybeSingle(),
      sb.from("touches").select("*").order("created_at",{ascending:false}),
    ]);
    invoices = (inv.data||[]).map(FROM.invoices);
    clients  = (cl.data||[]).map(FROM.clients);
    leads    = (ld.data||[]).map(FROM.leads);
    goal = st.data ? Number(st.data.monthly_goal)||0 : 0;
    touches = (tc && !tc.error && tc.data) ? tc.data.map(FROM.touches) : [];
  }
  renderApp();
}

/* ---------- llamar a las Edge Functions (agente) ---------- */
async function callFn(name, body){
  const { data:{ session } } = await sb.auth.getSession();
  const token = session ? session.access_token : cfg.SUPABASE_ANON_KEY;
  const res = await fetch(cfg.SUPABASE_URL + "/functions/v1/" + name, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token, "apikey":cfg.SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let txt=""; try{ txt=await res.text(); }catch(e){}
    if(res.status===404) throw new Error("El agente todavía no está desplegado (faltan tus keys). El texto quedó en el borrador.");
    throw new Error("Error "+res.status+(txt?": "+txt.slice(0,160):""));
  }
  return res.json();
}

// Genera (o regenera) el borrador del lead. auto=true cuando se abre el lead sin borrador.
async function runDraft(id, isRehacer){
  const l = leads.find(x=>x.id===id); if(!l) return;
  const ta = document.getElementById("lreply"); if(!ta) return;
  const btn = document.querySelector('[data-rehacer="'+id+'"]');
  const prevLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled=true; btn.textContent="Pensando…"; }
  if(!isRehacer){ ta.placeholder = "El agente está redactando la respuesta…"; }
  const msg = (l.ultimaRespuesta && String(l.ultimaRespuesta).trim()) ? l.ultimaRespuesta : (l.message||"");
  try{
    const out = await callFn("sugerir", { lead_id:id, message:msg, name:l.name||"", email:l.email||"", service:l.service||"", previous: (isRehacer && ta.dataset.orig) ? ta.dataset.orig : "" });
    if(out && out.reply){
      ta.value = out.reply; ta.dataset.orig = out.reply; autoGrow(ta);
      try{ await sb.from("leads").update({ borrador: out.reply }).eq("id", id); }catch(e){}
      if(isRehacer) note("Nueva sugerencia lista.");
    } else if(isRehacer){ note("El agente no devolvió texto."); }
  }catch(err){ note(isRehacer ? err.message : ("No pude redactar: "+err.message)); }
  if(btn){ btn.disabled=false; btn.textContent=prevLabel||"↻ Rehacer"; }
}

/* ---------- ANÁLISIS (cerebro) ---------- */
function renderAnalisis(){
  const total = leads.length;
  if(!total){ $app().innerHTML = `<div class="empty"><b>Todavía no hay datos para analizar.</b><br>Cuando empieces a mover leads (enviar, responder, ganar, perder), acá vas a ver <b>dónde se te caen los deals y por qué</b>, con recomendaciones basadas en estudios de ventas.</div>`; return; }

  const inState = (...s)=>leads.filter(l=>s.includes(l.status));
  const gan = inState("ganado").length, perd = inState("perdido").length;
  const contactados = leads.filter(l=>Number(l.mailsEnviados)>0 || ["enviado","sin_respuesta","respondio","ganado","perdido"].includes(l.status)).length;
  const respondieron = leads.filter(l=>Number(l.respuestas)>0 || l.status==="respondio").length;
  const sinContactar = total - contactados;
  const cerrados = gan+perd;

  // ---- Embudo ----
  const paso = (label,n,base)=>{ const pct = base? Math.round(n/base*100):0; return {label,n,pct}; };
  const F = [
    paso("Leads totales", total, total),
    paso("Contactados", contactados, total),
    paso("Respondieron", respondieron, contactados||1),
    paso("Ganados", gan, respondieron||1),
  ];
  const funnelHtml = F.map((p,i)=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span>${p.label}</span><span style="font-family:var(--mono);color:var(--muted)">${p.n}${i>0?` · ${p.pct}%`:""}</span>
      </div>
      <div style="height:9px;background:var(--hair2);border-radius:99px;overflow:hidden">
        <div style="height:100%;width:${i===0?100:Math.max(3,p.pct)}%;background:var(--accent);opacity:${1-i*0.18}"></div>
      </div>
    </div>`).join("");

  // ---- Motivos de pérdida ----
  const perdidos = inState("perdido");
  const motivos = {};
  perdidos.forEach(l=>{ const m=(l.cierreMotivo&&l.cierreMotivo!=="ganado")?l.cierreMotivo:"(sin motivo)"; motivos[m]=(motivos[m]||0)+1; });
  const motivosArr = Object.entries(motivos).sort((a,b)=>b[1]-a[1]);
  const topMotivo = motivosArr[0];
  const motivosHtml = motivosArr.length
    ? motivosArr.map(([m,n])=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--hair2)"><span>${esc(m)}</span><span style="font-family:var(--mono);color:var(--accent)">${n}</span></div>`).join("")
    : `<div style="color:var(--muted);font-size:13px">Todavía no marcaste ningún lead como Perdido con motivo.</div>`;

  // ---- Win rate por servicio ----
  const porServ = {};
  leads.forEach(l=>{ if(l.status==="ganado"||l.status==="perdido"){ const k=l.service||"(sin rubro)"; porServ[k]=porServ[k]||{g:0,p:0}; if(l.status==="ganado")porServ[k].g++; else porServ[k].p++; } });
  const servArr = Object.entries(porServ).sort((a,b)=>(b[1].g+b[1].p)-(a[1].g+a[1].p));
  const servHtml = servArr.length
    ? servArr.map(([k,v])=>{ const tot=v.g+v.p; const wr=tot?Math.round(v.g/tot*100):0; return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--hair2)"><span>${esc(k)}</span><span style="font-family:var(--mono);color:var(--muted)">${v.g}/${tot} · <span style="color:${wr>=50?'var(--ok)':'var(--accent)'}">${wr}%</span></span></div>`; }).join("")
    : `<div style="color:var(--muted);font-size:13px">Cuando cierres deals (ganados/perdidos) por rubro, vas a ver acá qué nicho convierte mejor.</div>`;

  // ---- Velocidad de respuesta (de lead creado a primer mail) ----
  let horas=[];
  leads.forEach(l=>{ const t=touchesOf(l.id).filter(x=>x.tipo==="mail"); if(t.length){ const first=t.reduce((a,b)=>new Date(a.createdAt)<new Date(b.createdAt)?a:b); const h=(new Date(first.createdAt)-new Date(l.createdAt))/3600000; if(h>=0&&h<24*14) horas.push(h); } });
  const velProm = horas.length? (horas.reduce((a,b)=>a+b,0)/horas.length) : null;
  const velTxt = velProm===null? "sin datos aún" : (velProm<1? "menos de 1 h" : velProm<24? velProm.toFixed(1)+" h" : (velProm/24).toFixed(1)+" días");

  // ---- Diagnóstico (prioriza el agujero más grande) ----
  let diag;
  if(sinContactar >= Math.max(3, total*0.3)){
    diag = `Tenés <b>${sinContactar} leads sin contactar</b>. Según Harvard Business Review, contactar en la <b>primera hora</b> multiplica por 7 las chances de calificar al lead (vs. esperar 24 h). Prioridad #1: vaciar <b>PARA HOY</b> rápido.`;
  } else if(velProm!==null && velProm>1){
    diag = `Estás respondiendo en promedio en <b>${velTxt}</b>. Los estudios muestran que bajar a <b>menos de 5 minutos</b> puede multiplicar por 100 el contacto. Si podés, respondé los nuevos apenas entran.`;
  } else if(contactados && respondieron/contactados < 0.25){
    diag = `De los que contactaste, <b>responden pocos (${Math.round(respondieron/contactados*100)}%)</b>. El cuello está en el <b>primer mensaje</b>: probá otro asunto y un primer renglón más directo. Usá "Rehacer" para variar el enfoque.`;
  } else if(topMotivo){
    diag = `Donde más perdés es por <b>${esc(topMotivo[0])}</b> (${topMotivo[1]} caso/s). ${topMotivo[0]==="precio"?"Mostrá valor antes del número y proponé una llamada para cotizar en contexto.":topMotivo[0]==="timing"||topMotivo[0]==="no era el momento"?"No los pierdas: armá un seguimiento a 30-60 días para cuando sea el momento.":topMotivo[0]==="desapareció"?"Sumá un toque extra en la cadencia antes de darlos por perdidos.":"Revisá qué faltó en esos cierres (campo 'Qué faltó')."}`;
  } else if(cerrados){
    diag = `Vas <b>${gan} ganados / ${perd} perdidos</b>. Buen ritmo — seguí cargando el motivo de cada cierre para que el análisis sea más preciso.`;
  } else {

function interestBar(r){
  r = Number(r)||0;
  const pct = Math.min(4,r)*25;
  const cls = r>=3 ? "orange" : (r>=1 ? "amber" : "");
  return `<span class="imini"><span class="ibar"><span class="ifill ${cls}" style="width:${pct}%"></span></span><span class="n">${r}</span></span>`;
}

/* ---------- barra de cierre (el agente sugiere, el humano aprueba) ---------- */
const ETAPAS_CIERRE=[[10,"Contactado"],[30,"Interesado"],[55,"Evaluando"],[80,"Casi cerrado"]];
let cierreAjuste=false; // panel de ajuste manual abierto/cerrado
function cierreBarHtml(l){
  if(l.status==="ganado"||l.status==="perdido"){
    const g=l.status==="ganado";
    return `<div class="cbar-wrap"><div class="cbar-h">Cierre</div>
      <div class="cbar"><div class="cbar-f ${g?"ok":"bad"}" style="width:${g?100:4}%"></div></div>
      <div class="cbar-l">${g?"100% — Ganado ✓":"0% — Perdido"}${l.cierreMotivo&&!g?` · motivo: ${esc(l.cierreMotivo)}`:""}</div></div>`;
  }
  const pct=l.cierrePct, sug=l.cierreSug;
  const etiq=p=>{const e=ETAPAS_CIERRE.find(x=>x[0]===Number(p));return e?e[1]:"";};
  let h=`<div class="cbar-wrap"><div class="cbar-h">Cierre${l.cierreFreno?` · freno: ${esc(l.cierreFreno)}`:""}</div>
    <div class="cbar"><div class="cbar-f" style="width:${pct==null?0:pct}%"></div></div>
    <div class="cbar-l">${pct==null?"— sin avance registrado":pct+"% — "+esc(etiq(pct))}</div>
    ${l.cierreFalta?`<div class="cbar-falta">Falta: ${esc(l.cierreFalta)}</div>`:""}`;
  if(sug&&sug.pct!=null&&Number(sug.pct)!==pct){
    h+=`<div class="cbar-sug">🤖 El agente lo ve en <b>${Number(sug.pct)}% — ${esc(sug.etapa||etiq(sug.pct))}</b>
      ${sug.freno?`<br>Freno: ${esc(sug.freno)}`:""}${sug.falta?`<br>Falta: ${esc(sug.falta)}`:""}
      <div class="cbar-sug-a">
        <button class="btn sm" data-avaplicar="${l.id}">✓ Aplicar</button>
        <button class="btn ghost sm" data-avajuste="1">✎ Lo veo distinto</button>
      </div>
      ${cierreAjuste?`<div class="cbar-set">
        ${ETAPAS_CIERRE.map(([p,n])=>`<button class="btn ghost sm" data-avset="${l.id}:${p}">${p}% ${esc(n)}</button>`).join("")}
        <input id="avnota" placeholder="Nota: por qué lo ves distinto (queda en la línea de tiempo)">
      </div>`:""}
    </div>`;
  } else {
    h+=`<div class="cbar-sug-a" style="margin-top:9px"><button class="btn ghost sm" data-avajuste="1">✎ Ajustar a mano</button></div>
      ${cierreAjuste?`<div class="cbar-set">
        ${ETAPAS_CIERRE.map(([p,n])=>`<button class="btn ghost sm" data-avset="${l.id}:${p}">${p}% ${esc(n)}</button>`).join("")}
        <input id="avnota" placeholder="Nota (opcional, queda en la línea de tiempo)">
      </div>`:""}`;
  }
  return h+`</div>`;
}

/* ---------- PARA HOY (cola de acción del día) ---------- */
function accionHoy(l){
  if(l.status==='nuevo')    return { label:'Responder', tipo:'mail',    hot:false };
  if(l.status==='respondio')return { label:'Contestar',  tipo:'mail',    hot:true  };
  if((l.status==='enviado'||l.status==='sin_respuesta') && l.segActivo && l.nextAt){
    const fin=new Date(); fin.setHours(23,59,59,999);
    if(new Date(l.nextAt)<=fin) return { label:(l.nextTipo==='llamada'?'Llamar':'Seguimiento'), tipo:(l.nextTipo||'mail'), hot:false };
  }
  return null;
}
function leadsHoy(){
  return leads.map(l=>({l,a:accionHoy(l)})).filter(x=>x.a)
    .sort((x,y)=> (y.a.hot?1:0)-(x.a.hot?1:0) || (new Date(x.l.createdAt)-new Date(y.l.createdAt)));
}

/* ---------- eventos ---------- */
function note(msg){
  const n=document.createElement("div");
  n.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d1e23;border:1px solid var(--hair);padding:10px 16px;border-radius:8px;font-size:13px;z-index:9;max-width:90vw;text-align:center";
  n.textContent=msg; document.body.appendChild(n); setTimeout(()=>n.remove(),5000);
}

document.addEventListener("click", async e=>{
  const t = e.target;
  if(!sb) return;
  const fr = t.closest && t.closest("[data-franja]");
  if(fr){ const s=fr.dataset.franja; leadCollapsed[s]=!leadCollapsed[s]; renderApp(); return; }
  if(t.dataset.leadfilter){ leadFilter=t.dataset.leadfilter; renderApp(); return; }
  if(t.dataset.togglelang){
    const id=t.dataset.togglelang; const l=leads.find(x=>x.id===id); if(!l) return;
    const next = langOf(l)==="es" ? "en" : "es";
    l.idioma=next; // optimista
    try{ await sb.from("leads").update({idioma:next}).eq("id",id); }catch(e){}
    renderApp(); return;
  }
  if(t.dataset.rehacer){ await runDraft(t.dataset.rehacer, true); return; }
  if(t.dataset.traducir){
    const ta=document.getElementById("lreply"); if(!ta) return;
    const hint=document.getElementById("tradhint");
    if(tradActivo){ // Ver original: paso lo que haya (editado o no) al idioma original
      t.disabled=true; t.innerHTML="…";
      try{
        let orig;
        if((ta.value||"").trim()===tradShown.trim()){ orig=tradOriginal; } // no editó -> original exacto
        else { const o=await callFn("sugerir",{translate:true,to:"match",reference:tradOriginal,message:ta.value}); orig=(o&&o.reply)||tradOriginal; }
        ta.value=orig; tradOriginal=orig; ta.readOnly=false; autoGrow(ta);
      }catch(err){ note("No pude volver al original: "+err.message); }
      tradActivo=false; tradShown="";
      if(hint) hint.style.display="none";
      t.disabled=false; t.innerHTML="⇄ Traducir"; t.title="Traducir al español (podés editar)"; return;
    }
    if(!(ta.value||"").trim()){ note("No hay texto para traducir."); return; }
    t.disabled=true; t.innerHTML="Traduciendo…";
    try{
      const out=await callFn("sugerir", { translate:true, message:ta.value });
      if(out && out.reply){
        tradOriginal=ta.value; tradShown=out.reply; tradActivo=true;
        ta.value=out.reply; ta.readOnly=false; autoGrow(ta); // editable: podés corregir en español
        if(hint) hint.style.display="block";
        t.innerHTML="↩ Ver envío"; t.title="Te muestra el texto en el idioma del lead, con tu edición ya traducida (eso es lo que se manda)";
      } else { note("No pude traducir."); t.innerHTML="⇄ Traducir"; }
    }catch(err){ note("No pude traducir: "+err.message); t.innerHTML="⇄ Traducir"; }
    t.disabled=false; return;
  }
  if(t.dataset.enviarmail){
    const id=t.dataset.enviarmail; const l=leads.find(x=>x.id===id); if(!l) return;
    const ta=document.getElementById("lreply");
    if(!(ta?ta.value:"").trim()){ note("Escribí o generá una respuesta antes de enviar."); return; }
    if(!l.email){ note("Este lead no tiene email."); return; }
    t.disabled=true; const prev=t.textContent;
    // Resolver el texto que SE ENVÍA (siempre en el idioma del lead)
    let bodyTxt;
    if(tradActivo){
      if((ta.value||"").trim()===tradShown.trim()){ bodyTxt=tradOriginal.trim(); } // no editó -> original exacto
      else {
        t.textContent="Traduciendo…";
        try{ const o=await callFn("sugerir",{translate:true,to:"match",reference:tradOriginal,message:ta.value}); bodyTxt=((o&&o.reply)||"").trim(); }
        catch(err){ note("No pude traducir tu edición para enviar: "+err.message); t.disabled=false; t.textContent=prev; return; }
      }
    } else { bodyTxt=ta.value.trim(); }
    if(!bodyTxt){ note("No pude preparar el texto a enviar."); t.disabled=false; t.textContent=prev; return; }
    t.textContent="Enviando…";
    try{
      await callFn("enviar", {
        lead_id:id, to:l.email,
        subject: l.service?("Re: "+l.service+" — LORENZO"):"Gracias por tu consulta — LORENZO",
        body: bodyTxt,
        suggestion: ta && ta.dataset.orig ? ta.dataset.orig : ""
      });
      try{ await sb.from("touches").insert({lead_id:id,tipo:"mail",texto:bodyTxt}); }catch(e){}
      try{ await sb.from("leads").update(avanzarCadencia(l.cadenciaPaso)).eq("id",id); }catch(e){}
      note("✅ Enviado a "+l.email);
      openLeadId=null; await loadAll();
    }catch(err){ note(err.message); t.disabled=false; t.textContent=prev; }
    return;
  }
  if(t.dataset.calllead){ callLeadId=t.dataset.calllead; renderApp(); return; }
  if(t.dataset.closecall){ stopTranscripcion(); callLeadId=null; renderApp(); return; }
  if(t.dataset.trans){
    const l=leads.find(x=>x.id===callLeadId);
    const live=document.getElementById("translive");
    if(transcribiendo){
      stopTranscripcion();
      t.textContent="🎙 Transcribir en vivo";
      if(live) live.style.display="none";
    } else if(startTranscripcion(l ? langOf(l) : "es")){
      t.textContent="⏹ Detener";
      if(live) live.style.display="inline";
    }
    return;
  }
  if(t.dataset.callres){
    const id=callLeadId; const l=leads.find(x=>x.id===id); if(!l){ stopTranscripcion(); callLeadId=null; renderApp(); return; }
    stopTranscripcion();
    const res=t.dataset.callres; const noteEl=document.getElementById("callnote"); let txt=noteEl?noteEl.value.trim():"";
    callLeadId=null; renderApp();
    const esTranscripcion = txt.length>250; // texto largo = transcripción real, no una notita
    // 1) Separar hablantes: el agente reescribe la transcripción como diálogo LORENZO: / CLIENTE:
    if(esTranscripcion){
      note("🗣 Separando hablantes…");
      try{
        const d=await callFn("sugerir",{ dialogar:true, transcript:txt, name:l.name||"", service:l.service||"" });
        if(d && d.reply) txt=d.reply;
      }catch(e){ /* si falla, se guarda la transcripción cruda igual */ }
    }
    try{ await sb.from("touches").insert({lead_id:id,tipo:"llamada",resultado:res,texto:txt||null}); }catch(e){}
    try{ await sb.from("leads").update(avanzarCadencia(l.cadenciaPaso)).eq("id",id); }catch(e){}
    note("📞 Llamada registrada.");
    // 2) Análisis de la llamada sobre el diálogo ya separado
    if(esTranscripcion){
      note("🧠 Analizando la llamada…");
      try{
        const out=await callFn("sugerir",{ analizar:true, transcript:txt, name:l.name||"", service:l.service||"" });
        if(out && out.reply){
          try{ await sb.from("touches").insert({lead_id:id,tipo:"nota",texto:"🧠 Análisis de la llamada:\n"+out.reply}); }catch(e){}
          // El agente OPINA el avance: queda como sugerencia pendiente (la barra solo se mueve cuando un humano la aprueba)
          const mAv=out.reply.match(/AVANCE SUGERIDO:\s*(\d{1,3})\s*%\s*[—–-]*\s*([^\n(]*)/i);
          if(mAv){
            const mFr=out.reply.match(/FRENO:\s*([^\n]+)/i), mFa=out.reply.match(/FALTA:\s*([^\n]+)/i);
            const sug={ pct:Math.max(0,Math.min(100,Number(mAv[1]))), etapa:(mAv[2]||"").trim()||null,
                        freno:mFr?mFr[1].trim():null, falta:mFa?mFa[1].trim():null, fecha:new Date().toISOString() };
            try{ await sb.from("leads").update({cierre_sug:sug}).eq("id",id); }catch(e){}
          }
          note("🧠 Análisis guardado en la línea de tiempo del lead.");
        }
      }catch(err){ note("No pude analizar la llamada: "+err.message); }
    }
    await loadAll(); return;
  }
  if(t.dataset.avajuste){ cierreAjuste=!cierreAjuste; renderApp(); return; }
  if(t.dataset.avaplicar){
    const id=t.dataset.avaplicar; const l=leads.find(x=>x.id===id); if(!l||!l.cierreSug) return;
    const s=l.cierreSug;
    const {error}=await sb.from("leads").update({ cierre_pct:Number(s.pct), cierre_freno:s.freno||null, cierre_falta:s.falta||null, cierre_sug:null }).eq("id",id);
    if(error){ note("No se pudo guardar: "+error.message); return; }
    try{ await sb.from("touches").insert({lead_id:id,tipo:"nota",texto:`📊 Avance aprobado: ${Number(s.pct)}% — ${s.etapa||""} (sugerencia del agente)${s.freno?` · freno: ${s.freno}`:""}`}); }catch(e){}
    cierreAjuste=false; await loadAll(); return;
  }
  if(t.dataset.avset){
    const [id,pstr]=t.dataset.avset.split(":"); const l=leads.find(x=>x.id===id); if(!l) return;
    const p=Number(pstr); const et=(ETAPAS_CIERRE.find(x=>x[0]===p)||[])[1]||"";
    const notaEl=document.getElementById("avnota"); const nota=notaEl?notaEl.value.trim():"";
    const {error}=await sb.from("leads").update({ cierre_pct:p, cierre_sug:null }).eq("id",id);
    if(error){ note("No se pudo guardar: "+error.message); return; }
    const sugTxt=(l.cierreSug&&l.cierreSug.pct!=null)?` (el agente sugería ${Number(l.cierreSug.pct)}%)`:"";
    try{ await sb.from("touches").insert({lead_id:id,tipo:"nota",texto:`📊 Avance ajustado a mano: ${p}% — ${et}${sugTxt}${nota?`\nNota: ${nota}`:""}`}); }catch(e){}
    cierreAjuste=false; await loadAll(); return;
  }
  if(t.dataset.ganado){ closeLeadId={id:t.dataset.ganado,outcome:"ganado"}; renderApp(); return; }
  if(t.dataset.perdido){ closeLeadId={id:t.dataset.perdido,outcome:"perdido"}; renderApp(); return; }
  if(t.dataset.closecierre){ closeLeadId=null; renderApp(); return; }
  if(t.dataset.cierreok){
    if(!closeLeadId){ renderApp(); return; }
    const {id,outcome}=closeLeadId;
    const motivo=document.getElementById("ci_motivo"), falto=document.getElementById("ci_falto"), obs=document.getElementById("ci_obs");
    const patch={ status:outcome, seguimiento_activo:false, next_action_at:null, next_action_tipo:null,
      cierre_motivo: outcome==='ganado' ? 'ganado' : (motivo?motivo.value:null),
      cierre_falto: falto?falto.value.trim()||null:null,
      cierre_obs: obs?obs.value.trim()||null:null };
    const {error}=await sb.from("leads").update(patch).eq("id",id);
    if(error){ note("No se pudo guardar: "+error.message); return; }
    try{ await sb.from("touches").insert({lead_id:id,tipo:"nota",texto:(outcome==='ganado'?'Ganado. ':'Perdido. ')+(patch.cierre_obs||'')}); }catch(e){}
    closeLeadId=null; openLeadId=null; await loadAll(); return;
  }
  if(t.dataset.replymail){
    const em=t.dataset.replymail;
    try{ await navigator.clipboard.writeText(em); note("📋 "+em+" copiado — en Private Email tocá Redactar y pegalo en 'Para'"); }
    catch(e){ note("Copiá este email: "+em); }
    window.open("https://privateemail.com/","_blank","noopener");
    return;
  }
  if(t.dataset.openlead){
    openLeadId=t.dataset.openlead; confirmDel=null; tradActivo=false; tradOriginal=""; tradShown=""; cierreAjuste=false; renderApp();
    const ol = leads.find(x=>x.id===openLeadId);
    if(ol && !(ol.borrador && String(ol.borrador).trim())) runDraft(openLeadId, false);
    return;
  }
  if(t.dataset.closelead || t.dataset.closeleadbg){ openLeadId=null; tradActivo=false; tradOriginal=""; tradShown=""; cierreAjuste=false; renderApp(); return; }
  if(t.dataset.new){ formOpen=t.dataset.new; editing=null; renderApp(); return; }
  if(t.dataset.cancel){ formOpen=null; editing=null; renderApp(); return; }
  if(t.dataset.edit){ const[col,id]=t.dataset.edit.split(":"); editing={col,id}; formOpen=col; confirmDel=null; renderApp(); return; }
  if(t.dataset.del){ const[col,id]=t.dataset.del.split(":"); confirmDel={col,id}; renderApp(); return; }
  if(t.dataset.delno){ confirmDel=null; renderApp(); return; }
  if(t.dataset.delyes){
    const[col,id]=t.dataset.delyes.split(":"); confirmDel=null;
    const {error}=await sb.from(col).delete().eq("id",id);
    if(error) note("No se pudo borrar: "+error.message); else { if(col==="leads") openLeadId=null; await loadAll(); }
    return;
  }
  if(t.dataset.goalsave){
    const v=Number(document.getElementById("goalinput").value)||0;
    const {error}=await sb.from("settings").upsert({key:"goal",monthly_goal:v,updated_at:new Date().toISOString()});
    if(error) note("No se pudo guardar el objetivo: "+error.message); else await loadAll();
    return;
  }
  if(t.dataset.cycle){
    const[col,id]=t.dataset.cycle.split(":");
    const list = col==="proposals"?proposals:col==="invoices"?invoices:leads;
    const states = col==="proposals"?P_STATES:col==="invoices"?I_STATES:L_STATES;
    const d=list.find(x=>x.id===id); if(!d) return;
    const next=states[(states.indexOf(d.status)+1)%states.length];
    const {error}=await sb.from(col).update({status:next}).eq("id",id);
    if(error) note("No se pudo cambiar el estado: "+error.message); else await loadAll();
    return;
  }
});

document.addEventListener("submit", async e=>{
  const f=e.target; if(!f.id||!f.id.startsWith("f-")) return;
  e.preventDefault();
  const col=f.id.slice(2);
  const data=Object.fromEntries(new FormData(f).entries());
  const fileInput=f.querySelector('input[type="file"]');
  delete data.__file;
  try{
    if(fileInput && fileInput.files && fileInput.files[0]){
      const file=fileInput.files[0];
      const path=Date.now()+"-"+file.name.replace(/[^\w.\-]/g,"_");
      const up=await sb.storage.from("proposals").upload(path,file,{upsert:false});
      if(up.error){ note("No se pudo subir el PDF; el resto se guarda igual."); }
      else{ const {data:pub}=sb.storage.from("proposals").getPublicUrl(path); data.fileUrl=pub.publicUrl; data.fileName=file.name; }
    }
    if(editing && editing.col===col && !data.fileUrl){
      const prev=(col==="proposals"?proposals:col==="invoices"?invoices:clients).find(x=>x.id===editing.id);
      if(prev && prev.fileUrl){ data.fileUrl=prev.fileUrl; data.fileName=prev.fileName||""; }
    }
    const row=TO[col](data);
    let error;
    if(editing && editing.col===col){ ({error}=await sb.from(col).update(row).eq("id",editing.id)); }
    else { row.created_at=new Date().toISOString(); ({error}=await sb.from(col).insert(row)); }
    if(error){ note("No se pudo guardar: "+error.message); return; }
    formOpen=null; editing=null; await loadAll();
  }catch(err){ note("No se pudo guardar: "+err.message); }
});

function renderLogin(err){
  document.getElementById("root").innerHTML = `
  <div class="login"><div class="box">
    <h1>LORENZO</h1><div class="sub">AGENCY · PANEL</div>
    <form id="loginf">
      <label><span class="fl">Email</span><input name="email" type="email" required autocomplete="username"></label>
      <label><span class="fl">Contraseña</span><input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit" style="width:100%">Entrar</button>
      <div class="err">${err?esc(err):""}</div>
    </form>
  </div></div>`;
  document.getElementById("loginf").addEventListener("submit", async e=>{
    e.preventDefault();
    const {email,password}=Object.fromEntries(new FormData(e.target).entries());
    const btn=e.target.querySelector("button"); btn.textContent="Entrando…"; btn.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){ renderLogin("Email o contraseña incorrectos."); }
  });
}

/* ---------- boot ---------- */
async function boot(){
  if(!configured){
    document.getElementById("root").innerHTML='<div class="offline">Panel sin configurar.<br>Falta pegar las credenciales de Supabase en config.js.</div>';
    return;
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  sessionEmail = session.user.email||"";
  const {data:adm}=await sb.rpc("is_admin");
  isAdmin=!!adm; canWrite=isAdmin;
  if(!isAdmin) tab="propuestas";
  await loadAll();
  // realtime: sincroniza entre dispositivos
  sb.channel("panel-rt").on("postgres_changes",{event:"*",schema:"public"},()=>loadAll()).subscribe();
}
sb && sb.auth.onAuthStateChange((_e,session)=>{
  if(session && document.getElementById("loginf")){ boot(); }
  else if(!session){ renderLogin(); }
});
boot();
</script>
</body>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel · LORENZO Agency</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg0:#0B0C0E; --bg1:#121316; --card:rgba(255,255,255,.028);
  --fg:#EFF0F3; --muted:#93969D; --faint:#6A6D74;
  --hair:rgba(236,238,243,.14); --hair2:rgba(236,238,243,.08);
  --accent:#DD7D47;
  --ok:#4CC38A; --warn:#E5B454; --bad:#E5604C; --info:#6AA5E8;
  --disp:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 85% -10%,rgba(232,235,242,.06),transparent 45%),var(--bg0);
  color:var(--fg);font-family:var(--disp);font-size:14px;min-height:100vh;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:22px 0 18px;border-bottom:1px solid var(--hair2)}
.wordmark b{font-weight:600;font-size:13px;letter-spacing:.2em}
.wordmark span{color:var(--muted);font-size:10px;letter-spacing:.3em;margin-left:10px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 24px}
nav button{background:none;border:1px solid var(--hair2);color:var(--muted);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.1em;padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--accent);background:var(--accent);font-weight:600}
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;
  margin-left:8px;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--disp);font-size:11px;
  font-weight:700;line-height:1;vertical-align:middle}
.lsel{background:var(--bg1);border:1px solid var(--hair);border-radius:7px;color:var(--fg);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.08em;padding:6px 8px;text-transform:uppercase;width:auto;cursor:pointer}
.lsel option{background:#16181c;color:#EFF0F3;text-transform:none;font-size:13px}
.lsel option:checked{background:var(--accent);color:#fff}
.lsel.asignado{border-color:var(--accent);color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.stepper button{background:var(--bg1);border:none;color:var(--fg);width:32px;height:34px;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:var(--accent);color:#fff}
.stepper input{width:46px;text-align:center;border:none;border-left:1px solid var(--hair);border-right:1px solid var(--hair);background:transparent;color:#fff;font-family:var(--mono);font-size:15px;padding:7px 0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mdrop{position:relative;display:inline-block}
.mdrop-btn{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg1);border:1px solid var(--hair);border-radius:8px;color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:9px 13px;cursor:pointer;min-width:130px}
.mdrop-btn:hover{border-color:var(--accent)}
.mdrop-btn .car{color:var(--muted);transition:transform .15s}
.mdrop.open .mdrop-btn{border-color:var(--accent)}
.mdrop.open .mdrop-btn .car{transform:rotate(180deg);color:var(--accent)}
.mdrop-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:#16181c;border:1px solid var(--hair);border-radius:12px;padding:6px;z-index:60;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.mdrop-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--fg);font-family:var(--disp);font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.mdrop-item:hover{background:var(--accent);color:#fff}
.mdrop-item.sel{color:var(--accent)}
.mdrop-item.sel:hover{color:#fff}
/* --- gestión de vendedores (Equipo) --- */
.vadd{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.vadd .vf{flex:1;min-width:170px;display:flex;flex-direction:column;gap:5px}
.vadd label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.vadd input{background:rgba(0,0,0,.3);border:1px solid var(--hair2);border-radius:10px;padding:11px 13px;font-size:13.5px}
.vadd input:focus{border-color:var(--accent);outline:none}
.vadd .btn{align-self:flex-end;padding:11px 22px}
.vrow{display:flex;align-items:center;gap:14px;border:1px solid var(--hair2);border-radius:14px;padding:13px 16px;flex-wrap:wrap;transition:border-color .15s}
.vrow:hover{border-color:var(--hair)}
.vrow .vavatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,rgba(221,125,71,.85),rgba(221,125,71,.45));flex-shrink:0}
.vrow.off .vavatar{background:var(--hair2);color:var(--muted)}
.vrow .vinfo{flex:1;min-width:130px}
.vrow .vinfo b{font-family:var(--disp);font-size:15px;line-height:1.4;display:block}
.vrow .vinfo .vm{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:7px;line-height:1.5}
.vchip{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.vchip.on{color:var(--ok);border:1px solid rgba(76,195,138,.35)}
.vchip.off{color:var(--muted);border:1px solid var(--hair2)}
.vmeta{display:flex;align-items:center;gap:0;border:1px solid var(--hair2);border-radius:10px;overflow:hidden}
.vmeta span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);padding:0 9px;text-transform:uppercase;border-right:1px solid var(--hair2);align-self:stretch;display:flex;align-items:center;background:rgba(0,0,0,.25)}
.vmeta input{width:76px;border:none;border-radius:0;background:transparent;padding:9px 8px;font-family:var(--mono);font-size:13px;text-align:center;-moz-appearance:textfield}
.vmeta input::-webkit-outer-spin-button,.vmeta input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.vmeta input:focus{outline:none}
.vmeta button{background:var(--bg1);border:none;color:var(--fg);width:30px;align-self:stretch;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vmeta button:hover{background:var(--accent);color:#fff}
.vmeta button:first-of-type{border-left:1px solid var(--hair2);border-right:1px solid var(--hair2)}
.vmeta button:last-of-type{border-left:1px solid var(--hair2)}
.linkbtn{background:none;border:none;color:var(--accent);font-family:var(--disp);font-size:12.5px;text-align:left;
  cursor:pointer;padding:0;text-decoration:none}
.linkbtn:hover{text-decoration:underline}
.telink{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;white-space:nowrap}
.telink:hover{text-decoration:underline}
.btn-trad{color:var(--info);border-color:rgba(106,165,232,.5)!important}
.btn-trad:hover{background:rgba(106,165,232,.12)}
.tradhint{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--info);background:rgba(106,165,232,.1);border:1px solid rgba(106,165,232,.3);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.langchip{font-family:var(--mono);font-size:9px;letter-spacing:.06em;border-radius:999px;padding:2px 8px;cursor:pointer;background:transparent;transition:.15s;white-space:nowrap;display:inline-block}
.langchip.es{color:#67c998;border:1px solid rgba(103,201,152,.45)}
.langchip.es:hover{background:rgba(103,201,152,.12)}
.langchip.en{color:var(--info);border:1px solid rgba(106,165,232,.45)}
.langchip.en:hover{background:rgba(106,165,232,.12)}
/* embudo */
.fchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.fchip{background:none;border:1px solid var(--hair2);color:var(--muted);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;padding:7px 12px;border-radius:999px;cursor:pointer;text-transform:uppercase}
.fchip.on{color:var(--fg);border-color:var(--accent);background:rgba(221,125,71,.08)}
.fchip b{font-family:var(--disp);font-weight:700;margin-left:4px}
.fchip.hot{border-color:rgba(221,125,71,.5)}
.fchip.hot.on{background:rgba(221,125,71,.14)}
/* franjas (secciones por estado) */
.franja{background:var(--card);border:1px solid var(--hair2);border-radius:16px;padding:2px 18px 8px;margin-bottom:14px}
.franja .tablewrap{background:none;border:none;border-radius:0;padding:0}
.franja-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair);
  color:var(--fg);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 4px;cursor:pointer;text-align:left}
.franja-h b{margin-left:auto;font-family:var(--disp);font-weight:700;color:var(--muted);font-size:13px}
.franja.hot .franja-h{color:var(--accent)}
.franja.hot .franja-h b{color:var(--accent)}
.chev{display:inline-block;transition:transform .18s;color:var(--accent);font-size:12px}
.chev.o{transform:rotate(90deg)}
/* barra de interés */
.ibar{width:66px;height:7px;background:var(--hair2);border-radius:99px;overflow:hidden}
.ifill{height:100%;border-radius:99px;transition:width .25s}
.ifill.amber{background:var(--warn)}
.ifill.orange{background:var(--accent)}
.imini{display:inline-flex;align-items:center;gap:7px}
.imini .n{font-family:var(--mono);font-size:10px;color:var(--faint)}
/* barra de cierre (avance hacia la venta) */
.cbar-wrap{margin:16px 0;padding:14px 16px;border:1px solid var(--hair2);border-radius:14px;background:rgba(255,255,255,.02)}
.cbar-h{font-family:var(--disp);font-size:14.5px;font-weight:800;letter-spacing:.01em;color:#fff;margin-bottom:12px}
.cbar{height:6px;background:var(--hair2);border-radius:99px;overflow:hidden;margin-top:8px}
.cbar-row{display:flex;gap:14px;margin-top:9px;font-size:13.5px;line-height:1.6}
.cbar-row .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;min-width:52px;padding-top:4px}
.cbar-row .v{color:var(--fg);flex:1}
.cbar-f{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.cbar-f.ok{background:var(--ok)} .cbar-f.bad{background:var(--bad)}
.cbar-l{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--fg);margin-top:7px}
.cbar-falta{font-size:12px;color:var(--muted);margin-top:5px}
.cbar-sug{margin-top:11px;padding:10px 12px;border:1px dashed var(--hair2);border-radius:8px;font-size:12.5px;line-height:1.55;color:var(--fg)}
.cbar-sug-a{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.cbar-set{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cbar-set input{flex:1 1 100%;background:rgba(0,0,0,.25);border:1px solid var(--hair2);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:12px}
/* títulos de sección dentro de la ficha del lead */
.sect{margin:22px 0 10px;font-family:var(--disp);font-size:14.5px;font-weight:800;letter-spacing:.01em;color:#fff;display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:var(--hair2)}
/* pestañas internas de la ficha (zona de actividad, estilo CRM) */
.ftabs{display:flex;gap:4px;flex-wrap:wrap;margin:26px 0 0;border-bottom:1px solid var(--hair2)}
.ftab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;margin-bottom:-1px}
.ftab:hover{color:var(--fg)}
.ftab.on{color:var(--fg);border-bottom-color:var(--accent)}
.ftabc{padding-top:20px}
.fempty{color:var(--faint);font-size:13px;padding:18px 0 6px}
.lmodal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50}
.lcard{background:linear-gradient(180deg,rgba(32,33,38,.78),rgba(16,17,20,.82));
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:26px 30px;max-width:1120px;width:100%;
  max-height:90vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08)}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.lname{font-size:18px;font-weight:700}
.lmeta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.lcontact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lcontact span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin-right:4px}
.lmsg{font-size:15px;line-height:1.6;color:var(--fg);white-space:pre-wrap;word-break:break-word;margin:4px 0 6px;
  background:rgba(255,255,255,.03);border:1px solid var(--hair2);border-left:3px solid var(--accent);
  border-radius:12px;padding:13px 16px}
.lreplied{margin:16px 0 0;border-left:2px solid var(--accent);padding:2px 0 2px 12px}
.lreplied-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:5px}
.lreplied-b{font-size:14px;line-height:1.55;color:#C9CBD1;white-space:pre-wrap;word-break:break-word}
/* respuesta sugerida */
.lreplywrap{margin:18px 0 22px;border-top:1px solid var(--hair2);padding-top:18px}
.lreplyhead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;
  margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lreplyhead .c{color:var(--accent)}
.lreply{min-height:92px;font-size:15px;line-height:1.6;resize:vertical;color:#F2F3F6;border-radius:14px;padding:14px 18px;overflow-y:auto;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 12px 40px rgba(0,0,0,.35)}
.lreply.full{min-height:220px}
.lreply:focus{outline:none;border-color:rgba(221,125,71,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 3px rgba(221,125,71,.14), 0 12px 40px rgba(0,0,0,.35)}
.lreplyactions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.lsent{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin-left:auto}
.lactions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--hair2);padding-top:16px}
.btn-reply{background:none;color:#C9CBD1;border:1px solid var(--hair);border-radius:8px;padding:9px 14px;font-weight:600;
  font-size:12.5px;font-family:var(--disp);text-decoration:none;cursor:pointer;transition:border-color .18s,color .18s}
.btn-reply:hover{border-color:var(--accent);color:var(--accent)}
.lrubro{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
  border:1px solid var(--hair);border-radius:999px;padding:3px 9px;text-transform:uppercase;white-space:nowrap}
.btn-trash{background:transparent;border:1px solid rgba(229,96,76,.35);color:var(--bad);
  width:28px;height:28px;padding:0;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn-trash svg{width:15px;height:15px}
.btn-trash:hover{background:rgba(229,96,76,.12)}
.btn-trash:hover{background:rgba(229,96,76,.22)}
.lactions .btn-trash{margin-left:auto}
.rowactions .btn-trash{padding:6px 9px;font-size:13px}
.btn-trash{display:inline-flex;align-items:center;justify-content:center}
.btn-del{display:inline-flex;align-items:center;justify-content:center;color:var(--bad)!important;
  width:28px;height:28px;padding:0!important;margin-left:10px;flex:none;border-color:rgba(229,96,76,.35)!important}
.rowactions .btn-del,.rowactions .btn-trash{margin-left:8px}
.btn-del svg{width:15px;height:15px}
.btn-del:hover{background:rgba(229,96,76,.12)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.stat{background:var(--card);border:1px solid var(--hair2);border-radius:16px;padding:20px}
/* ===== RESUMEN bento ===== */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:8px 0 18px;flex-wrap:wrap}
.hello h1{font-size:32px;font-weight:700;letter-spacing:-.01em}
.hello .hd{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:6px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.kpi{border:1px solid var(--hair2);background:var(--card);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--muted)}
.kpi b{color:var(--fg);font-variant-numeric:tabular-nums;margin-right:2px}
.kpi.hl{border-color:rgba(221,125,71,.45);background:rgba(221,125,71,.1);color:var(--fg)}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.bcard{background:var(--card);border:1px solid var(--hair2);border-radius:16px;padding:20px;grid-column:span 4;min-width:0}
.bcard.sp3{grid-column:span 3}.bcard.sp4{grid-column:span 4}.bcard.sp5{grid-column:span 5}.bcard.sp6{grid-column:span 6}.bcard.sp12{grid-column:span 12}
.bcard.rsp2{grid-row:span 2}
@media(max-width:980px){.bcard.rsp2{grid-row:auto}}
@media(max-width:980px){.bcard,.bcard.sp3,.bcard.sp4,.bcard.sp5,.bcard.sp6{grid-column:span 12}}
.prchip{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:6px;
  font-size:10.5px;font-weight:800;font-family:var(--disp);margin-right:8px;flex:none;vertical-align:middle}
.prchip.A{background:rgba(221,125,71,.16);color:var(--accent);border:1px solid rgba(221,125,71,.35)}
.prchip.B{background:rgba(229,180,84,.10);color:var(--warn);border:1px solid rgba(229,180,84,.28)}
.prchip.C{background:rgba(255,255,255,.04);color:var(--faint);border:1px solid var(--hair2)}
.cpills{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;max-width:270px}
.cpill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border:1px solid var(--hair2);border-radius:999px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);text-decoration:none;max-width:240px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpill:hover{border-color:var(--muted)}
.cpill.dir{color:var(--accent);border-color:rgba(221,125,71,.35);background:rgba(221,125,71,.07)}
.captable td{padding:18px 12px}
.captable td:first-child{padding-left:4px}
.captable th{padding-bottom:12px}
tr.rowhl td{background:rgba(221,125,71,.07);transition:background .4s}
tr.rowhl td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.bcard.hl{background:linear-gradient(180deg,rgba(221,125,71,.13),rgba(221,125,71,.04));border-color:rgba(221,125,71,.3)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.iconbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--hair);background:transparent;color:var(--faint);
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--hair2)}
.goalmsg{margin-top:16px;padding:9px 11px;border-radius:10px;font-size:12.5px;color:var(--muted);

<div id="root"><div class="offline">Cargando el panel…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";

/* ---------- Supabase ---------- */
const cfg = window.LORENZO_CONFIG || {};
let sb = null;
const configured = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf("PEGAR_") !== 0;
if(configured){ sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY); }

const YEAR = new Date().getFullYear();
let isAdmin = false, canWrite = false, goal = 0, sessionEmail = "";
let esVendedor = false, miVendedorId = null; // rol vendedor (ve solo lo suyo)
let repVendId = null, repDropOpen = false; // dropdown custom del reparto
let vendSub = "equipo"; // sub-sección dentro de VENDEDORES: equipo | comisiones
let rankingPublico = []; // ranking del mes para la vista del vendedor (via RPC, sin comisiones ajenas)
let proposals = [], invoices = [], clients = [], leads = [];
let tab = "resumen";
let editing = null, confirmDel = null, formOpen = null, openLeadId = null;
let openProspId = null, hlProspId = null, fbAsk = null, visitaReg = null, horaPicker = null;
let agendaPick=null, agendaMonth=0, agendaDay=null, agendaHora=null;
let plantillas = [], plantSel = null, tandaEdit = false, tandaPrev = null, tandaEnviando = false;

/* Candidatos de la tanda del día (misma regla que la card) */
function tandaCandidatos(){
  const CUOTA=10; const h0=new Date(); h0.setHours(0,0,0,0);
  const mailsHoy=touches.filter(x=>x.tipo==="mail"&&new Date(x.createdAt)>=h0).length;
  const ordQ={A:0,B:1,C:2};
  return prospectos.filter(p=>!p.leadId&&(p.email||p.emailDirecto)&&!["enviado","respondio","descartado"].includes(p.status))
    .sort((a,b)=>(((a.prioridad in ordQ)?ordQ[a.prioridad]:3)-((b.prioridad in ordQ)?ordQ[b.prioridad]:3))||(new Date(b.createdAt)-new Date(a.createdAt)))
    .slice(0,Math.max(0,CUOTA-mailsHoy));
}

/* Etiqueta de color del PUNTO FLOJO — el ángulo del primer impacto */
function pfTag(pf){
  if(!pf) return "";
  const col={"sin web":"var(--accent)","web vieja":"var(--accent)","sin reservas online":"var(--accent)","reseñas flojas":"var(--warn)","poca presencia":"var(--warn)","recién abre":"var(--ok)","ventas flojas":"var(--bad)"}[pf]||"var(--faint)";
  return `<span title="Punto flojo — por acá entra el primer mail" style="display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:${col};border:1px solid ${col};border-radius:6px;padding:2px 7px;white-space:nowrap;opacity:.9;vertical-align:middle">${esc(pf)}</span>`;
}

/* Ficha del negocio ordenada: etiquetas en mono, datos aparte, "Entrar por" resaltado */
function fichaNegocioHtml(msg){
  const L=`font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px`;
  const fila=(k,v,extra)=>`<div style="margin:0 0 13px"><span style="${L}">${esc(k)}</span><span style="font-size:14.5px;${extra||""}">${esc(v)}</span></div>`;
  const lineas=String(msg||"").split("\n").map(x=>x.trim()).filter(Boolean);
  let fuente="", out=[], puntos=[], enPasando=false;
  const cerrarPuntos=()=>{ if(puntos.length){ out.push(`<div style="margin:0 0 13px"><span style="${L}">Qué está pasando</span>${puntos.map(pt=>`<div style="font-size:14.5px;line-height:1.65;padding-left:2px">• ${esc(pt)}</div>`).join("")}</div>`); puntos=[]; } };
  for(const ln of lineas){
    const m=ln.match(/^Captado en la búsqueda\s*\((.*)\)/i);
    if(m){ fuente=m[1]; continue; }
    if(/^QUÉ ESTÁ PASANDO/i.test(ln)){ enPasando=true; continue; }
    if(/^[•\-]/.test(ln)&&enPasando){ puntos.push(ln.replace(/^[•\-]\s*/,"")); continue; }
    enPasando=false; cerrarPuntos();
    const pf=ln.match(/^PUNTO FLOJO[^:]*:\s*(.+)$/i);
    if(pf){ out.push(fila("Punto flojo — primer impacto",pf[1],"color:var(--accent);font-weight:700;text-transform:uppercase;font-size:13px")); continue; }
    const kv=ln.match(/^(Contacto|Entrar por|Web|web|IG|Instagram|Notas?)\s*:\s*(.+)$/i);
    if(kv){
      const k=kv[1].toLowerCase();
      if(k==="entrar por") out.push(fila("Entrar por",kv[2],"color:var(--accent);font-weight:700"));
      else if(k==="web") out.push(k==="web"&&/vieja|decente|sin web/i.test(kv[2])?fila("Estado de la web",kv[2]):fila("Web",kv[2]));
      else out.push(fila(kv[1][0].toUpperCase()+kv[1].slice(1).toLowerCase(),kv[2]));
    } else out.push(fila("Dato",ln));
  }
  cerrarPuntos();
  return `<div class="lmsg" style="line-height:1.6">${fuente?`<div style="${L};margin-bottom:14px">Captado en la búsqueda · ${esc(fuente)}</div>`:""}${out.join("")}</div>`;
}
let leadFilter = "todos";
let leadCollapsed = {};
let touches = [];
let metaCont = 0;
let prospectos = [];
let vendedores = [];
let comisionMes = null; // 'YYYY-MM' seleccionado en la sección Comisiones (null = mes actual)
let busquedas = [];
let callLeadId = null, closeLeadId = null;
let callLang = null; // idioma del micrófono en la llamada (es/en); por defecto, el del lead
let verLlamadaId = null; // visor de transcripción abierto
let fichaTab = "email";  // pestaña activa dentro de la ficha del lead
let invFilter = "todas"; // filtro de la tabla de facturas
let tradActivo = false, tradOriginal = "", tradShown = "";
let transcribiendo = false, transcripcion = "", recog = null;

/* ---------- Transcripción en vivo de llamadas (Web Speech API) ----------
   Convierte lo que capta el micrófono a TEXTO en tiempo real. No guarda audio.
   La llamada va en altavoz cerca de la compu, y hay que avisar al cliente (ley de FL). */
function startTranscripcion(lang){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ note("Este navegador no soporta transcripción en vivo — usá Chrome o Edge."); return false; }
  const ta = document.getElementById("callnote");
  transcripcion = (ta && ta.value) ? ta.value.trim()+" " : "";
  recog = new SR();
  callLang = (lang === "en") ? "en" : "es";
  recog.lang = callLang === "en" ? "en-US" : "es-US";
  recog.continuous = true; recog.interimResults = true;
  // Auto-idioma: si las primeras frases vienen con confianza baja, el idioma elegido está mal -> cambia solo.
  let confSum = 0, confN = 0, autoCambio = false;
  recog.onresult = (e)=>{
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal){
        transcripcion += r[0].transcript.trim()+"\n"; // cada frase en su línea (ayuda a separar turnos)
        const c = r[0].confidence;
        if(typeof c === "number" && c > 0){ confSum += c; confN++; }
        if(!autoCambio && confN >= 2 && (confSum/confN) < 0.55){
          autoCambio = true;
          callLang = (callLang === "es") ? "en" : "es";
          confSum = 0; confN = 0;
          note("🎙 Detecté que la llamada es en "+(callLang==="en"?"inglés":"español")+" — cambié el micrófono solo.");
          try{ recog.stop(); }catch(_e){} // onend relanza con el idioma nuevo
        }
      }
      else interim += r[0].transcript;
    }
    const t = document.getElementById("callnote");
    if(t){ t.value = transcripcion + interim; t.scrollTop = t.scrollHeight; }
  };
  recog.onerror = (e)=>{ if(e.error !== "no-speech" && e.error !== "aborted") note("Transcripción: "+e.error); };
  recog.onend = ()=>{ if(transcribiendo && recog){ recog.lang = callLang === "en" ? "en-US" : "es-US"; try{ recog.start(); }catch(_e){} } }; // el navegador corta solo; relanzar (con el idioma vigente)
  try{ recog.start(); }catch(_e){}
  transcribiendo = true;
  return true;
}

/* ============================ COMISIONES ============================
   Escalera por volumen MENSUAL (se resetea cada mes). MARGINAL: cada
   tramo cobra su %, no se recalcula hacia atrás.
   Para cambiar los números, editá COMISION_TRAMOS y COMISION_CORONA acá.
   La comisión es INTERNA (va metida en el precio; el cliente no la ve). */
const COMISION_TRAMOS = [
  { desde: 0,     hasta: 6000,     pct: 0.07 },  // $0 – $6.000 → 7%
  { desde: 6000,  hasta: 12000,    pct: 0.10 },  // $6.000 – $12.000 → 10%
  { desde: 12000, hasta: Infinity, pct: 0.12 },  // +$12.000 → 12%
];
// Corona del mes: el #1 del ranking, si vendió más que el piso, cobra
// pctPlano sobre TODO su volumen del mes (reemplaza la escalera) + premio.
const COMISION_CORONA = { piso: 15000, pctPlano: 0.15 };

// % del tramo más alto que alcanzó ese volumen.
function escalonActual(volumen){
  let pct = 0;
  for(const tr of COMISION_TRAMOS){ if(volumen > tr.desde) pct = tr.pct; }
  return pct;
}
// Comisión PLANA: todo el volumen del mes cobra el % del escalón alcanzado.
// (Al pasar un umbral, TODO salta a ese %, no se divide por tramos.)
function comisionEscalera(volumen){
  return volumen * escalonActual(volumen);
}
// Clave 'YYYY-MM' de una fecha.
const mesClave = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"); };
// Mes seleccionado (o el actual).
const mesVigente = () => comisionMes || mesClave(new Date());
// Etiqueta linda del mes 'YYYY-MM'.
function mesLabel(clave){
  const [y,m]=clave.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});
}
// Ventas ganadas de un vendedor en un mes (usa fecha_cierre; si falta, created_at del lead).
function ventasDelMes(vendedorId, clave){
  return leads.filter(l=> l.status==="ganado"
    && l.vendedorId===vendedorId
    && Number(l.montoVenta)>0
    && mesClave(l.fechaCierre || l.createdAt)===clave );
}
// Ranking del mes: [{vendedor, volumen, ventas, comisionBase, esCorona, comisionFinal, pctEfectivo}]
function rankingMes(clave){
  const filas = vendedores.map(v=>{
    const vs = ventasDelMes(v.id, clave);
    const volumen = vs.reduce((a,l)=>a+Number(l.montoVenta||0),0);
    return { vendedor:v, volumen, ventas:vs.length, comisionBase:comisionEscalera(volumen) };
  }).sort((a,b)=> b.volumen - a.volumen);
  // Corona: el #1 con volumen > piso cobra pctPlano sobre todo.
  const lider = filas[0];
  const coronaActiva = lider && lider.volumen > COMISION_CORONA.piso;
  return filas.map((f,i)=>{
    const esCorona = coronaActiva && i===0;
    const comisionFinal = esCorona ? f.volumen * COMISION_CORONA.pctPlano : f.comisionBase;
    const pctEfectivo = f.volumen>0 ? comisionFinal/f.volumen : 0;
    return { ...f, esCorona, comisionFinal, pctEfectivo };
  });
}

/* Detección de idioma (ES/EN) — heurística, gratis e instantánea. Facu puede corregir tocando el chip. */
function detectLang(txt){
  const t=" "+String(txt||"").toLowerCase()+" ";
  if(!t.trim()) return "es";
  let es=0, en=0;
  if(/[ñáéíóúü¿¡]/.test(t)) es+=3;
  const ES=[" que "," los "," las "," una "," para "," con "," por "," pero "," como "," tengo "," quiero "," hola "," gracias "," cuánto "," cuanto "," precio "," necesito "," hacer "," están "," estan "," muy "," más "," mas "," también "," tambien "," cómo "," buenas "," saludos "];
  const EN=[" the "," you "," your "," and "," for "," with "," have "," want "," hello "," hi "," thanks "," thank "," how "," much "," price "," need "," would "," could "," please "," we "," our "," about "," looking "," interested "];
  for(const w of ES) if(t.includes(w)) es++;
  for(const w of EN) if(t.includes(w)) en++;
  if(es===en) return "es"; // empate -> español (Facu es el default)
  return es>en ? "es" : "en";
}

}

/* Mientras una búsqueda está pendiente o corriendo, el panel mira la base cada 20s en silencio.
   Solo redibuja si HAY negocios o avance nuevo, nunca mientras estás escribiendo o con algo
   abierto (ficha, subpantalla, formulario, mapa), y mantiene el scroll donde estaba. */
let pollTimer=null, pollFirma="";
const firmaDatos=()=>JSON.stringify([busquedas.map(b=>b.id+"|"+b.status+"|"+(b.progreso==null?"":b.progreso)),prospectos.map(x=>x.id+"|"+x.status)]);
function pollBusquedas(){
  if(pollTimer){ clearTimeout(pollTimer); pollTimer=null; }
  if(!busquedas.some(b=>b.status==="buscando"||b.status==="pendiente")) return;
  pollTimer=setTimeout(async()=>{
    try{
      const [bq,pz]=await Promise.all([
        sb.from("busquedas").select("*").order("created_at",{ascending:false}),
        sb.from("prospectos").select("*").order("created_at",{ascending:false}),
      ]);
      if(bq&&!bq.error&&bq.data) busquedas=bq.data.map(FROM.busquedas);
      if(pz&&!pz.error&&pz.data) prospectos=pz.data.map(FROM.prospectos);
      const firma=firmaDatos();
      if(firma!==pollFirma){
        const el=document.activeElement;
        const ocupado=(el&&["INPUT","TEXTAREA","SELECT"].includes(el.tagName))||formOpen||editing||openLeadId||openProspId||confirmDel||document.getElementById("mapamodal");
        if(!ocupado){ const y=window.scrollY; renderApp(); window.scrollTo(0,y); pollFirma=firma; }
      }
    }catch(e){}
    pollBusquedas();
  },20000);
}

/* ---------- llamar a las Edge Functions (agente) ---------- */
async function callFn(name, body){
  const { data:{ session } } = await sb.auth.getSession();
  const token = session ? session.access_token : cfg.SUPABASE_ANON_KEY;
  const res = await fetch(cfg.SUPABASE_URL + "/functions/v1/" + name, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token, "apikey":cfg.SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let txt=""; try{ txt=await res.text(); }catch(e){}
    if(res.status===404) throw new Error("El agente todavía no está desplegado (faltan tus keys). El texto quedó en el borrador.");
    throw new Error("Error "+res.status+(txt?": "+txt.slice(0,160):""));
  }
  return res.json();
}

// Genera (o regenera) el borrador del lead. auto=true cuando se abre el lead sin borrador.
async function runDraft(id, isRehacer){
  const l = leads.find(x=>x.id===id); if(!l) return;
  const ta = document.getElementById("lreply"); if(!ta) return;
  const btn = document.querySelector('[data-rehacer="'+id+'"]');
  const prevLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled=true; btn.textContent="Pensando…"; }
  if(!isRehacer){ ta.placeholder = "El agente está redactando la respuesta…"; }
  const msg = (l.ultimaRespuesta && String(l.ultimaRespuesta).trim()) ? l.ultimaRespuesta : (l.message||"");
  try{
    const out = await callFn("sugerir", { lead_id:id, message:msg, name:l.name||"", email:l.email||"", service:l.service||"", previous: (isRehacer && ta.dataset.orig) ? ta.dataset.orig : "" });
    if(out && out.reply){
      ta.value = out.reply; ta.dataset.orig = out.reply; autoGrow(ta);
      try{ await sb.from("leads").update({ borrador: out.reply }).eq("id", id); }catch(e){}
      if(isRehacer) note("Nueva sugerencia lista.");
    } else if(isRehacer){ note("El agente no devolvió texto."); }
  }catch(err){ note(isRehacer ? err.message : ("No pude redactar: "+err.message)); }
  if(btn){ btn.disabled=false; btn.textContent=prevLabel||"↻ Rehacer"; }
}

/* ============================ RENDER ============================ */
function tabsHtml(){
  const t = isAdmin ? [["hoy","PARA HOY"],["resumen","RESUMEN"],["analisis","ANÁLISIS"],["llamadas","LLAMADAS"],["vendedores","VENDEDORES"],["propuestas","PROPUESTAS"],["facturas","FACTURAS"],["clientes","CLIENTES"],["leads","LEADS"],["prospeccion","CAPTACIÓN CLIENTES"],["visitas","VISITAS"]]
            : esVendedor ? [["hoy","PARA HOY"],["miresumen","MI RESUMEN"],["misclientes","MIS CLIENTES"],["miranking","RANKING"]]
            : [["resumen","RESUMEN"],["propuestas","PROPUESTAS"]];
  const nuevos = leads.filter(x=>x.status==='nuevo').length;
  const hoyN = (isAdmin||esVendedor) ? leadsHoy().length : 0;
  const visN = prospectos.filter(x=>x.visitar && x.status!=="descartado" && x.feedback!=="no").length;
  return `<nav id="tabs">${t.map(([k,l])=>{
    let b=''; if((k==='leads'||k==='misclientes')&&nuevos) b=`<span class="nbadge">${nuevos}</span>`; if(k==='hoy'&&hoyN) b=`<span class="nbadge">${hoyN}</span>`; if(k==='visitas'&&visN) b=`<span class="nbadge">${visN}</span>`;
    return `<button data-t="${k}" class="${tab===k?'on':''}">${l}${b}</button>`;
  }).join("")}</nav>`;
}

/* ---------- LLAMADAS (registro global: fecha, hora, lead, vendedor, resultado, duración) ---------- */
function renderLlamadas(){
  const calls = touches.filter(x=>x.tipo==="llamada");
  const leadDe = id => leads.find(l=>l.id===id);
  const durDe = t => { const m=String(t||"").match(/⏱ Duración:\s*(\d+:\d{2})/); return m?m[1]:"—"; };
  const vendDe = t => { const m=String(t||"").match(/^\s*([A-ZÁÉÍÓÚÑÜ][A-Za-zÁÉÍÓÚÑÜáéíóúñü .'-]{1,28})\s*\(LORENZO\)\s*:/m); return m?m[1].trim():"—"; };
  const hoy0=new Date(); hoy0.setHours(0,0,0,0);
  const d7=new Date(hoy0); d7.setDate(d7.getDate()-6);
  const nHoy=calls.filter(c=>new Date(c.createdAt)>=hoy0).length;
  const n7=calls.filter(c=>new Date(c.createdAt)>=d7).length;
  const tile=(lbl,val)=>`<div style="flex:1;min-width:120px;border:1px solid var(--hair2);border-radius:16px;padding:14px 16px">
    <div style="font-family:var(--disp);font-size:14.5px;font-weight:800;color:#fff">${lbl}</div>
    <div style="font-size:26px;margin-top:4px">${val}</div></div>`;
  const body = calls.length ? `<div class="tablewrap"><table>
    <tr><th>Fecha</th><th>Lead</th><th>Vendedor</th><th>Resultado</th><th>Duración</th><th class="r"></th></tr>
    ${calls.map(c=>{ const l=leadDe(c.leadId); const d=new Date(c.createdAt);
      const f=d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" · "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
      return `<tr>
        <td style="font-family:var(--mono);font-size:11px;white-space:nowrap">${esc(f)}</td>
        <td>${l?`<button class="linkbtn" data-openlead="${l.id}">${esc(l.name||l.email||"—")}</button>`:"—"}</td>
        <td style="font-size:12px">${esc(vendDe(c.texto))}</td>
        <td style="font-size:12px">${esc(CALL_RES[c.resultado]||c.resultado||"—")}</td>
        <td style="font-family:var(--mono);font-size:11px">${esc(durDe(c.texto))}</td>
        <td>${l?`<button class="btn sm ghost" data-openlead="${l.id}">Abrir</button>`:""}</td>
      </tr>`; }).join("")}
    </table></div>`
    : `<div class="empty"><b>Sin llamadas registradas todavía.</b><br>Cada llamada que registres (con su transcripción y análisis) aparece acá.</div>`;
  $app().innerHTML = `<div class="bar"><h2><span class="tick"></span>Llamadas</h2></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">
      ${tile("Hoy",nHoy)}${tile("Últimos 7 días",n7)}${tile("Total",calls.length)}
    </div>
    ${body}`;
}

/* ---------- COMISIONES (ranking mensual + gestión de vendedores) ---------- */
function renderComisiones(target){
  const dest = target ? document.getElementById(target) : $app();
  if(!dest) return;
  const clave = mesVigente();
  const rank = rankingMes(clave);
  const totalVol = rank.reduce((a,r)=>a+r.volumen,0);
  const totalCom = rank.reduce((a,r)=>a+r.comisionFinal,0);
  const money = n => "$"+Math.round(n).toLocaleString("en-US");
  const money2 = n => "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});

  // lista de meses con actividad, para el selector
  const mesesSet = new Set([mesClave(new Date())]);
  leads.forEach(l=>{ if(l.status==="ganado" && Number(l.montoVenta)>0) mesesSet.add(mesClave(l.fechaCierre||l.createdAt)); });
  const meses = [...mesesSet].sort().reverse();

  const tile=(lbl,val,sub)=>`<div style="flex:1;min-width:150px;border:1px solid var(--hair2);border-radius:16px;padding:14px 16px">
    <div style="font-family:var(--disp);font-size:14.5px;font-weight:800;color:#fff">${lbl}</div>
    <div style="font-size:26px;margin-top:4px">${val}</div>
    ${sub?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${sub}</div>`:""}</div>`;

  const medalla = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}º`;
  const pct = p => (Math.round(p*1000)/10).toString().replace(".0","")+"%";

  // Ranking en cuadros apilados (uno abajo del otro).
  const metric = (val,lbl,col)=>`<div style="text-align:right;min-width:82px">
    <div style="font-family:var(--mono);font-size:15px;line-height:1.2;color:${col||'#fff'}">${val}</div>
    <div style="font-size:10px;color:var(--faint);margin-top:8px;letter-spacing:.06em;text-transform:uppercase">${lbl}</div></div>`;
  const filas = rank.filter(r=>r.volumen>0 || r.vendedor.activo).map((r,i)=>{
    const puesto = r.volumen>0 ? medalla(i) : '·';
    const ticket = r.ventas>0 ? money(r.volumen/r.ventas) : '—';
    const sub = r.esCorona ? `CORONA 👑 · cobra ${pct(COMISION_CORONA.pctPlano)}` : (r.volumen>0 ? `${i+1}º · escalón ${pct(escalonActual(r.volumen))}` : 'sin ventas');
    const borde = r.esCorona ? 'border:1.5px solid var(--accent);box-shadow:0 0 0 3px rgba(221,125,71,.1)' : '1px solid var(--hair2)';
    const bg = r.esCorona ? 'background:rgba(221,125,71,.06)' : '';
    return `<div style="display:flex;align-items:center;gap:14px;border:${borde};${bg};border-radius:16px;padding:16px 18px;flex-wrap:wrap;${r.volumen>0?'':'opacity:.6'}">
      <div style="font-family:var(--disp);font-weight:800;font-size:26px;min-width:40px;text-align:center">${puesto}</div>
      <div style="flex:1;min-width:120px">
        <div style="font-family:var(--disp);font-weight:800;font-size:17px;color:#fff">${esc(r.vendedor.nombre)}${!r.vendedor.activo?' <span style="font-size:10px;color:var(--faint);font-weight:400">(inactivo)</span>':''}</div>
        <div style="font-family:var(--mono);font-size:11px;color:${r.esCorona?'var(--accent)':'var(--muted)'};margin-top:3px;letter-spacing:.04em">${esc(sub)}</div>
      </div>
      ${metric(money(r.volumen),'vendido')}
      ${metric(r.ventas,'ventas')}
      ${metric(ticket,'ticket prom.')}
      <div style="width:1px;align-self:stretch;background:var(--hair2)"></div>
      ${metric(money2(r.comisionFinal),'comisión', r.esCorona?'var(--accent)':'var(--ok)')}
    </div>`;
  }).join("");

  const lider = rank[0];
  const hayCorona = lider && lider.esCorona;
  const coronaMsg = hayCorona
    ? `<b style="color:var(--accent)">👑 ${esc(lider.vendedor.nombre)}</b> lidera con ${money(lider.volumen)} → cobra <b>15% + premio + reconocimiento</b>.`
    : (lider && lider.volumen>0
        ? `Nadie superó el piso de ${money(COMISION_CORONA.piso)} este mes → <b>no hay corona</b>. El puntero va ${money(lider.volumen)}.`
        : `Sin ventas cargadas este mes todavía.`);

  // gestión de vendedores
  // Gráfico de barras con glow (incluye la corona como 4ª barra)
  const moneyK = n => "$"+(n/1000)+"k";  // formato corto para que el rango entre en una línea
  const barras = COMISION_TRAMOS.map(tr=>({
    rango: tr.hasta===Infinity ? `+${moneyK(tr.desde)}` : `${moneyK(tr.desde)}–${moneyK(tr.hasta)}`,
    pct: tr.pct, corona:false
  }));
  barras.push({ rango:`1º · +${moneyK(COMISION_CORONA.piso)}`, pct:COMISION_CORONA.pctPlano, corona:true });
  const maxPct = Math.max(...barras.map(b=>b.pct));
  const H = 210;
  const escaleraGrafico = `<div style="display:flex;align-items:flex-end;gap:30px;height:${H+58}px;padding:30px 6px 0;justify-content:center">
    ${barras.map((b,i)=>{
      const h = Math.round(Math.pow(b.pct/maxPct, 1.8) * H); // exagera el salto: el 15% se despega del 12%
      const glow = b.corona
        ? "background:linear-gradient(180deg,rgba(242,160,110,.35) 0%,rgba(221,125,71,.85) 55%,#DD7D47 100%);box-shadow:0 0 55px -4px rgba(221,125,71,.75),inset 0 0 26px rgba(255,200,160,.4)"
        : `background:linear-gradient(180deg,rgba(221,125,71,.10) 0%,rgba(221,125,71,${(0.30+i*0.14).toFixed(2)}) 55%,rgba(221,125,71,${(0.55+i*0.14).toFixed(2)}) 100%);box-shadow:0 0 38px -8px rgba(221,125,71,${(0.35+i*0.12).toFixed(2)}),inset 0 0 20px rgba(255,190,150,.18)`;
      return `<div style="width:62px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div style="font-family:var(--disp);font-weight:800;font-size:${b.corona?'24':'21'}px;color:#fff;margin-bottom:10px;text-shadow:0 0 18px rgba(221,125,71,.5);white-space:nowrap">${pct(b.pct)}${b.corona?' <span style="font-size:18px">👑</span>':''}</div>
        <div style="width:100%;height:${h}px;border-radius:14px 14px 6px 6px;${glow}"></div>
        <div style="font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:12px;text-align:center;letter-spacing:.03em;white-space:nowrap">${b.rango}</div>
      </div>`;
    }).join("")}
  </div>`;

  dest.innerHTML = `
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <select id="comes" class="lsel">
      ${meses.map(m=>`<option value="${m}" ${m===clave?"selected":""}>${esc(mesLabel(m))}</option>`).join("")}
    </select>
  </div>

  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
    ${tile("Vendido el mes", money(totalVol), `${rank.filter(r=>r.volumen>0).length} vendedor(es) con ventas`)}
    ${tile("Comisiones a pagar", money2(totalCom), "interno — ya va en el precio")}
    ${tile("Ventas cerradas", rank.reduce((a,r)=>a+r.ventas,0), "deals ganados este mes")}
  </div>

  <div style="border:1px solid var(--hair2);border-radius:16px;padding:14px 16px;margin-bottom:18px;background:rgba(221,125,71,.04)">
    ${coronaMsg}
  </div>

  ${rank.some(r=>r.volumen>0 || r.vendedor.activo) ? `<div style="display:flex;flex-direction:column;gap:10px">
    ${filas}
  </div>`
  : `<div class="empty"><b>Sin ventas cargadas en ${esc(mesLabel(clave))}.</b><br>Cuando marques un lead como <b>Ganado</b> con su monto y vendedor, aparece acá el ranking y la comisión.</div>`}

  <div style="margin-top:22px;border:1px solid var(--hair2);border-radius:16px;padding:18px 20px">
    <div style="font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:2px">Escalera de comisiones</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Mensual · se resetea cada mes · más vendés, más alto el %</div>
    ${escaleraGrafico}
    <div style="font-size:11.5px;color:var(--faint);margin-top:14px;border-top:1px solid var(--hair);padding-top:12px">Al pasar un escalón, <b style="color:var(--muted)">todo el volumen del mes</b> cobra ese %. &nbsp;·&nbsp; 👑 Corona: el 1º del mes, si pasa ${money(COMISION_CORONA.piso)}, cobra 15% + premio.</div>
  </div>`;
}

/* ================= VENDEDORES (contiene Equipo + Comisiones) ================= */
function renderVendedores(){
  const stab = (k,l)=>`<button data-vendsub="${k}" style="background:${vendSub===k?'var(--accent)':'none'};border:1px solid ${vendSub===k?'var(--accent)':'var(--hair2)'};color:${vendSub===k?'#fff':'var(--muted)'};font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:${vendSub===k?'600':'400'}">${l}</button>`;
  $app().innerHTML = `<div class="bar"><h2><span class="tick"></span>Vendedores</h2></div>
    <div style="display:flex;gap:8px;margin:-6px 0 18px">${stab("equipo","EQUIPO")}${stab("comisiones","COMISIONES")}</div>
    <div id="vbody"></div>`;
  if(vendSub==="comisiones") renderComisiones("vbody"); else renderEquipo("vbody");
}

/* ================= EQUIPO (admin supervisa a los vendedores) ================= */
function renderEquipo(target){
  const clave = mesVigente();
  const money = n => "$"+Math.round(n).toLocaleString("en-US");
  const money2 = n => "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
  const pct = p => (Math.round(p*1000)/10).toString().replace(".0","")+"%";
  const hoy0=new Date(); hoy0.setHours(0,0,0,0);
  const esHoy = d => new Date(d)>=hoy0;
  const rank = rankingMes(clave);
  const puestoDe = id => { const i=rank.findIndex(r=>r.vendedor.id===id); return i<0?null:i+1; };
  const activos = vendedores.filter(v=>v.activo);

  const dest = target ? document.getElementById(target) : $app();
  if(!dest) return;
  // OJO: aunque no haya activos, el bloque de gestión SIEMPRE se muestra
  // (si no, desactivás al último y no podés reactivarlo).
  const avisoVacio = !activos.length
    ? `<div class="empty" style="margin-bottom:16px"><b>${vendedores.length?'No hay vendedores activos.':'No hay vendedores cargados.'}</b><br>${vendedores.length?'Reactivá uno abajo o agregá otro.':'Agregá el primero acá abajo (nombre + email + meta).'}</div>`
    : '';

  const metric = (val,lbl,col)=>`<div style="text-align:center;min-width:76px"><div style="font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.2;color:${col||'#fff'}">${val}</div><div style="font-size:10px;color:var(--faint);margin-top:9px;letter-spacing:.05em;text-transform:uppercase">${lbl}</div></div>`;

  const cards = activos.map(v=>{
    const misLeads = leads.filter(l=>l.vendedorId===v.id);
    const ids = new Set(misLeads.map(l=>l.id));
    const misTouch = touches.filter(t=>ids.has(t.leadId));
    const llamHoy = misTouch.filter(t=>t.tipo==='llamada' && esHoy(t.createdAt)).length;
    const mailHoy = misTouch.filter(t=>t.tipo==='mail' && esHoy(t.createdAt)).length;
    const llamMes = misTouch.filter(t=>t.tipo==='llamada').length;
    const pendHoy = misLeads.filter(l=>accionHoy(l)).length;    // su cola "Para hoy"
    const hechoHoy = llamHoy + mailHoy;
    const vol = ventasDelMes(v.id,clave).reduce((a,l)=>a+Number(l.montoVenta||0),0);
    const corona = rank[0] && rank[0].vendedor.id===v.id && rank[0].volumen>COMISION_CORONA.piso;
    const comision = corona ? vol*COMISION_CORONA.pctPlano : comisionEscalera(vol);
    const puesto = puestoDe(v.id);
    const meta = Number(v.meta)||0;
    const pctMeta = meta>0 ? Math.min(100,Math.round(vol/meta*100)) : null;
    // cumplió lo del día: sin acciones pendientes de hoy
    const cumplio = pendHoy===0;
    const estadoHoy = pendHoy===0
      ? `<span style="color:var(--ok);font-weight:700">✓ Al día</span>`
      : `<span style="color:var(--warn);font-weight:700">${pendHoy} pendiente${pendHoy===1?'':'s'} hoy</span>`;
    return `<div style="display:flex;flex-direction:column;gap:18px;border:1px solid ${corona?'var(--accent)':'var(--hair2)'};border-radius:16px;padding:20px;overflow:hidden;${corona?'background:rgba(221,125,71,.05)':''}">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;line-height:1.4">
        <span style="font-family:var(--disp);font-weight:800;font-size:18px">${esc(v.nombre)}${corona?' 👑':''}</span>
        ${puesto?`<span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${puesto}º del mes</span>`:''}
        ${!v.email?'<span style="font-size:10px;color:var(--warn)">sin email</span>':''}
        <span style="margin-left:auto;font-size:12px">${estadoHoy}</span>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between">
        ${metric(llamHoy,'llam. hoy', llamHoy>0?'var(--ok)':'#fff')}
        ${metric(mailHoy,'mails hoy')}
        ${metric(llamMes,'llam. mes')}
        ${metric(misLeads.length,'clientes')}
        ${metric(money(vol),'vendido')}
        ${metric(money2(comision),'comisión','var(--ok)')}
      </div>
      ${meta>0?`<div style="border:1px solid ${pctMeta>=100?'var(--ok)':'rgba(221,125,71,.35)'};border-radius:14px;padding:16px 18px;background:linear-gradient(135deg,rgba(221,125,71,.07),rgba(221,125,71,.015))">
        <div style="font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:${pctMeta>=100?'var(--ok)':'var(--accent)'};text-transform:uppercase;margin-bottom:10px">◆ Meta del mes</div>
        <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px">
          <span style="font-family:var(--disp);font-weight:800;font-size:28px;line-height:1;color:#fff;text-shadow:0 0 16px rgba(221,125,71,.35)">${money(vol)}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--muted);padding-bottom:3px">de ${money(meta)}</span>
          <span style="margin-left:auto;font-family:var(--disp);font-weight:800;font-size:22px;line-height:1;color:${pctMeta>=100?'var(--ok)':'var(--accent)'}">${pctMeta}%</span>
        </div>
        <div style="height:13px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--hair2)"><div style="height:100%;width:${Math.max(pctMeta,2)}%;border-radius:999px;background:linear-gradient(90deg,rgba(221,125,71,.55),var(--accent) 70%,#F2A06E);box-shadow:0 0 16px rgba(221,125,71,.7)"></div></div>
      </div>`:''}
    </div>`;
  }).join("");

  // totales del equipo hoy
  const totLlamHoy = activos.reduce((a,v)=>{const ids=new Set(leads.filter(l=>l.vendedorId===v.id).map(l=>l.id)); return a+touches.filter(t=>ids.has(t.leadId)&&t.tipo==='llamada'&&esHoy(t.createdAt)).length;},0);
  const totPendHoy = activos.reduce((a,v)=>a+leads.filter(l=>l.vendedorId===v.id&&accionHoy(l)).length,0);
  const tile=(lbl,val,sub)=>`<div style="flex:1;min-width:140px;border:1px solid var(--hair2);border-radius:16px;padding:14px 16px"><div style="font-family:var(--disp);font-size:14px;font-weight:800">${lbl}</div><div style="font-size:26px;margin-top:4px">${val}</div>${sub?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${sub}</div>`:''}</div>`;

  // gestión de vendedores (agregar / meta / activar)
  const inicial = n => (String(n||"?").trim()[0]||"?").toUpperCase();
  const vendList = vendedores.length
    ? `<div style="display:flex;flex-direction:column;gap:9px">`+vendedores.map(v=>`<div class="vrow ${v.activo?'':'off'}">
        <div class="vavatar">${esc(inicial(v.nombre))}</div>
        <div class="vinfo">
          <b>${esc(v.nombre)}</b>
          <div class="vm">${v.email?esc(v.email):'<span style="color:var(--warn)">sin email — no puede entrar al panel</span>'}</div>
        </div>
        <span class="vchip ${v.activo?'on':'off'}">${v.activo?'activo':'inactivo'}</span>
        <div class="vmeta"><span>meta</span><button data-metastep="-:${esc(v.id)}" title="−$500">−</button><input type="number" min="0" value="${v.meta||''}" placeholder="0" data-vendmeta="${esc(v.id)}"><button data-metastep="+:${esc(v.id)}" title="+$500">+</button></div>
        <button class="btn ghost sm" data-vendtoggle="${esc(v.id)}">${v.activo?'Desactivar':'Reactivar'}</button>
      </div>`).join("")+`</div>`
    : `<div style="color:var(--muted);font-size:13px">Todavía no cargaste vendedores. Agregá el primero arriba.</div>`;

  dest.innerHTML = `
    ${avisoVacio}
    ${activos.length?`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      ${tile("Vendedores activos", activos.length)}
      ${tile("Llamadas hoy (equipo)", totLlamHoy)}
      ${tile("Pendientes hoy", totPendHoy, totPendHoy===0?'todos al día ✓':'acciones sin hacer')}
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">${cards}</div>`:''}

    <div style="margin-top:22px;border:1px solid var(--hair2);border-radius:16px;padding:20px">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:16px">

/* ================= VISTA DEL VENDEDOR (ve solo lo suyo) ================= */
const vMoney  = n => "$"+Math.round(n).toLocaleString("en-US");
const vMoney2 = n => "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const vPct    = p => (Math.round(p*1000)/10).toString().replace(".0","")+"%";
// Mi posición en el ranking del mes (desde rankingPublico, ordenado por volumen).
function miPuesto(){ const i=rankingPublico.findIndex(r=>r.id===miVendedorId); return i<0?null:i+1; }
function soyCorona(){ return rankingPublico.length && rankingPublico[0].id===miVendedorId && rankingPublico[0].volumen>COMISION_CORONA.piso; }

function renderMiResumen(){
  const clave = mesVigente();
  const miV = vendedores.find(v=>v.id===miVendedorId) || {};
  const yo = miV.nombre || sessionEmail;
  const mias = ventasDelMes(miVendedorId, clave);
  const vol = mias.reduce((a,l)=>a+Number(l.montoVenta||0),0);
  const corona = soyCorona();
  const comision = corona ? vol*COMISION_CORONA.pctPlano : comisionEscalera(vol);
  const puesto = miPuesto();
  const ticket = mias.length ? vMoney(vol/mias.length) : "—";
  const miEsc = escalonActual(vol);
  const next = COMISION_TRAMOS.find(t=>t.desde>vol);
  const faltaMsg = corona ? `Vas 1º 👑 — cobrás 15% + premio este mes.`
    : next ? `Te faltan <b style="color:var(--accent)">${vMoney(next.desde-vol)}</b> para saltar a <b>${vPct(next.pct)}</b>.`
    : `Estás en el escalón más alto (${vPct(miEsc)}). Si salís 1º y pasás ${vMoney(COMISION_CORONA.piso)}, cobrás 15% + premio.`;

  // --- B) Meta + progreso (HÉROE: arriba de todo, grande, motiva) ---
  const meta = Number(miV.meta)||0;
  const pctMeta = meta>0 ? Math.min(100, Math.round(vol/meta*100)) : 0;
  const cumplida = pctMeta>=100;
  const metaBox = meta>0 ? `
    <div style="border:1.5px solid ${cumplida?'var(--ok)':'var(--accent)'};border-radius:20px;padding:26px 24px;margin-bottom:18px;background:linear-gradient(135deg,rgba(221,125,71,.09),rgba(221,125,71,.02));box-shadow:0 0 44px -14px rgba(221,125,71,.45)">
      <div style="font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:${cumplida?'var(--ok)':'var(--accent)'};text-transform:uppercase;margin-bottom:14px">◆ Tu meta de ${esc(mesLabel(clave))}</div>
      <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px">
        <div style="font-family:var(--disp);font-weight:800;font-size:46px;line-height:1;color:#fff;text-shadow:0 0 24px rgba(221,125,71,.4)">${vMoney(vol)}</div>
        <div style="font-family:var(--mono);font-size:15px;color:var(--muted);padding-bottom:6px">de ${vMoney(meta)}</div>
        <div style="margin-left:auto;font-family:var(--disp);font-weight:800;font-size:32px;line-height:1;color:${cumplida?'var(--ok)':'var(--accent)'}">${pctMeta}%</div>
      </div>
      <div style="height:18px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--hair2)">
        <div style="height:100%;width:${Math.max(pctMeta,2)}%;border-radius:999px;background:linear-gradient(90deg,rgba(221,125,71,.55),var(--accent) 70%,#F2A06E);box-shadow:0 0 22px rgba(221,125,71,.8)"></div>
      </div>
      <div style="font-size:13.5px;color:${cumplida?'var(--ok)':'var(--fg)'};margin-top:14px">${cumplida?'<b>¡Meta cumplida! 🎉</b> Todo lo que cierres ahora es récord.':`Te faltan <b style="color:var(--accent)">${vMoney(Math.max(0,meta-vol))}</b> para tu meta — cada llamada te acerca.`}</div>
    </div>` : '';

  // --- C) Actividad (de mis leads/touches, ya filtrados a lo mío) ---
  const misTouches = touches; // RLS ya los limita a mis leads
  const mails = misTouches.filter(t=>t.tipo==='mail').length || leads.reduce((a,l)=>a+(Number(l.mailsEnviados)||0),0);
  const llamadas = misTouches.filter(t=>t.tipo==='llamada').length;
  const contactados = leads.filter(l=>Number(l.mailsEnviados)>0 || ['enviado','sin_respuesta','respondio','ganado','perdido'].includes(l.status)).length;
  const respondieron = leads.filter(l=>Number(l.respuestas)>0 || l.status==='respondio' || ['ganado','perdido'].includes(l.status)).length;
  const cerrados = leads.filter(l=>['ganado','perdido'].includes(l.status)).length;
  const ganadosTot = leads.filter(l=>l.status==='ganado').length;
  const tasaResp = contactados ? Math.round(respondieron/contactados*100) : 0;
  const tasaCierre = cerrados ? Math.round(ganadosTot/cerrados*100) : 0;
  const act = (val,lbl)=>`<div style="flex:1;min-width:110px;text-align:center;border:1px solid var(--hair2);border-radius:14px;padding:16px 10px">
    <div style="font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.2">${val}</div>
    <div style="font-size:10.5px;color:var(--muted);margin-top:9px;letter-spacing:.04em">${lbl}</div></div>`;
  const actBox = `<div style="margin-bottom:16px">
    <div style="font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:10px">Tu actividad del mes</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${act(mails,'mails')}${act(llamadas,'llamadas')}${act(tasaResp+'%','respuesta')}${act(tasaCierre+'%','cierre')}
    </div></div>`;

  // --- D) Hitos / reconocimiento ---
  const hitos = [];
  if(corona) hitos.push({i:'👑',t:'Corona del mes',s:'Vas 1º del equipo'});
  if(ganadosTot>=1) hitos.push({i:'🏆',t:'Primera venta cerrada',s:'Ya estás en el tablero'});
  if(vol>=COMISION_TRAMOS[1].desde) hitos.push({i:'📈',t:`Subiste al ${vPct(miEsc)}`,s:`Pasaste ${vMoney(COMISION_TRAMOS.find(x=>x.pct===miEsc).desde)}`});
  if(mias.length>=3) hitos.push({i:'🔥',t:`${mias.length} ventas este mes`,s:'Buen ritmo'});
  if(puesto===1 && !corona) hitos.push({i:'🥇',t:'Puntero del mes',s:'A un paso de la corona'});
  const hitosBox = hitos.length ? `<div style="margin-bottom:4px">
    <div style="font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:10px">Tus logros</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${hitos.map(h=>`<div style="display:flex;align-items:center;gap:12px;border:1px solid var(--hair2);border-radius:12px;padding:11px 14px">
        <span style="font-size:22px">${h.i}</span>
        <div><div style="font-weight:700;font-size:14px">${h.t}</div><div style="font-size:11.5px;color:var(--muted)">${h.s}</div></div>
      </div>`).join("")}
    </div></div>` : '';

  const tile=(lbl,val,sub,col)=>`<div style="flex:1;min-width:150px;border:1px solid var(--hair2);border-radius:16px;padding:16px 18px">
    <div style="font-family:var(--disp);font-size:14px;font-weight:800;color:#fff">${lbl}</div>
    <div style="font-size:28px;margin-top:4px;color:${col||'#fff'}">${val}</div>
    ${sub?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${sub}</div>`:""}</div>`;

  $app().innerHTML = `
  <div class="bar"><h2><span class="tick"></span>Hola, ${esc(yo)}</h2>
    <span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(mesLabel(clave))}</span>
  </div>
  ${metaBox}
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
    ${tile("Vendiste este mes", vMoney(vol), `${mias.length} venta${mias.length===1?'':'s'}`)}
    ${tile("Tu comisión", vMoney2(comision), corona?'corona 👑 · 15%':`escalón ${vPct(miEsc)}`, corona?'var(--accent)':'var(--ok)')}
    ${tile("Tu puesto", puesto?`${puesto}º`:'—', puesto===1?'1º del equipo 🔥':'en el ranking')}
    ${tile("Ticket promedio", ticket, "por venta")}
  </div>
  <div style="border:1px solid var(--hair2);border-radius:16px;padding:16px 18px;background:rgba(221,125,71,.05);margin-bottom:16px">
    ${faltaMsg}
  </div>
  ${actBox}
  ${hitosBox}
  <div style="margin-top:10px;display:flex;gap:16px"><button class="linkbtn" data-gotab="hoy" style="font-size:13px">Ver qué hacer hoy →</button><button class="linkbtn" data-gotab="misclientes" style="font-size:13px">Mis clientes →</button></div>`;
}

function renderMiRanking(){
  const clave = mesVigente();
  const medalla = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}º`;
  const coronaAct = rankingPublico.length && rankingPublico[0].volumen>COMISION_CORONA.piso;
  // mi comisión (solo la mía se muestra)
  const miVol = (rankingPublico.find(r=>r.id===miVendedorId)||{}).volumen||0;
  const miCom = soyCorona()? miVol*COMISION_CORONA.pctPlano : comisionEscalera(miVol);
  const filas = rankingPublico.map((r,i)=>{
    const yo = r.id===miVendedorId;
    const esCorona = coronaAct && i===0;
    const ticket = r.ventas>0 ? vMoney(r.volumen/r.ventas) : "—";
    const borde = esCorona ? 'border:1.5px solid var(--accent);box-shadow:0 0 0 3px rgba(221,125,71,.1)'
                 : yo ? 'border:1.5px solid rgba(106,165,232,.6)' : '1px solid var(--hair2)';
    const bg = esCorona ? 'background:rgba(221,125,71,.06)' : yo ? 'background:rgba(106,165,232,.06)' : '';
    const sub = esCorona ? 'CORONA 👑' : (r.volumen>0?`${i+1}º puesto`:'sin ventas');
    const m = (val,lbl,col)=>`<div style="text-align:right;min-width:78px"><div style="font-family:var(--mono);font-size:15px;line-height:1.2;color:${col||'#fff'}">${val}</div><div style="font-size:10px;color:var(--faint);margin-top:8px;letter-spacing:.06em;text-transform:uppercase">${lbl}</div></div>`;
    return `<div style="display:flex;align-items:center;gap:14px;border:${borde};${bg};border-radius:16px;padding:16px 18px;flex-wrap:wrap;${r.volumen>0?'':'opacity:.6'}">
      <div style="font-family:var(--disp);font-weight:800;font-size:26px;min-width:40px;text-align:center">${r.volumen>0?medalla(i):'·'}</div>
      <div style="flex:1;min-width:110px">
        <div style="font-family:var(--disp);font-weight:800;font-size:17px;color:#fff">${esc(r.nombre)}${yo?' <span style="font-size:11px;color:var(--info);font-weight:600">· VOS</span>':''}</div>
        <div style="font-family:var(--mono);font-size:11px;color:${esCorona?'var(--accent)':'var(--muted)'};margin-top:3px">${sub}</div>
      </div>
      ${m(vMoney(r.volumen),'vendido')}
      ${m(r.ventas,'ventas')}
      ${m(ticket,'ticket')}
      ${yo?`<div style="width:1px;align-self:stretch;background:var(--hair2)"></div>${m(vMoney2(miCom),'tu comisión',esCorona?'var(--accent)':'var(--ok)')}`:''}
    </div>`;
  }).join("");
  const lider = rankingPublico[0];
  const msg = coronaAct ? `<b style="color:var(--accent)">👑 ${esc(lider.nombre)}</b> va 1º con ${vMoney(lider.volumen)}.`
    : (lider&&lider.volumen>0 ? `Nadie pasó ${vMoney(COMISION_CORONA.piso)} todavía — la corona está vacante.` : `Sin ventas este mes todavía.`);
  $app().innerHTML = `<div class="bar"><h2><span class="tick"></span>Ranking del equipo</h2>
    <span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(mesLabel(clave))}</span></div>
    <div style="border:1px solid var(--hair2);border-radius:16px;padding:14px 16px;margin-bottom:16px;background:rgba(221,125,71,.04)">${msg}</div>
    ${rankingPublico.some(r=>r.volumen>0)?`<div style="display:flex;flex-direction:column;gap:10px">${filas}</div>`:`<div class="empty"><b>Sin ventas cargadas este mes.</b><br>Cerrá tu primer cliente para entrar al ranking.</div>`}`;
}

const $app = () => document.getElementById("app");

function renderResumen(){
  const sum = a=>a.reduce((s,x)=>s+(Number(x.amount)||0),0);
  const sent = proposals.filter(p=>p.status==="enviada");
  const appr = proposals.filter(p=>p.status==="aprobada");
  const paid = invoices.filter(i=>i.status==="pagada");
  const mkey = new Date().toISOString().slice(0,7);
  const cobradoMes = sum(paid.filter(i=>String(i.issued||"").slice(0,7)===mkey));

  if(!isAdmin){
    $app().innerHTML = `<div class="grid">
      <div class="stat"><span class="l">Pipeline (enviadas)</span><div class="v">${money(sum(sent))}</div><div class="s">${sent.length} propuesta(s) esperando respuesta</div></div>
      <div class="stat"><span class="l">Aprobado</span><div class="v">${money(sum(appr))}</div><div class="s">${appr.length} propuesta(s) ganada(s)</div></div>
    </div>
    <div class="bar"><h2><span class="tick"></span>Últimas propuestas</h2></div>
    ${proposals.length? proposalTable(proposals.slice(0,5), false) : '<div class="empty"><b>Sin propuestas todavía.</b></div>'}`;
    return;
  }

  const cnt=s=>leads.filter(x=>x.status===s).length;
  const nuevos=cnt("nuevo"), enviados=cnt("enviado"), resp=cnt("respondio"), sinr=cnt("sin_respuesta"), gan=cnt("ganado"), perd=cnt("perdido");
  const contactados=enviados+resp+sinr+gan+perd;
  const tasaResp = contactados ? Math.round(resp/contactados*100) : 0;
  const tasaCierre = (gan+perd) ? Math.round(gan/(gan+perd)*100) : 0;
  const es=leads.filter(l=>langOf(l)==="es").length, en=leads.filter(l=>langOf(l)==="en").length;
  const items=leadsHoy();

  const h=new Date().getHours();
  const saludo = h<12?"Buen día":h<19?"Buenas tardes":"Buenas noches";
  const fecha = new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});

  const calls=touches.filter(x=>x.tipo==="llamada");
  const hoy0=new Date(); hoy0.setHours(0,0,0,0);
  const d7=new Date(hoy0); d7.setDate(d7.getDate()-6);
  const cHoy=calls.filter(c=>new Date(c.createdAt)>=hoy0).length;
  const c7=calls.filter(c=>new Date(c.createdAt)>=d7).length;

  const pct = goal>0 ? Math.min(100, cobradoMes/goal*100) : 0;
  const avg = proposals.length ? sum(proposals)/proposals.length : 0;
  let msg;
  if(!goal) msg="Definí el objetivo del mes para ver el avance.";
  else if(cobradoMes>=goal) msg="🏆 Objetivo superado por "+money(cobradoMes-goal)+".";
  else { const gap=goal-cobradoMes; msg="Faltan "+money(gap)+(avg>0?" · ≈ "+Math.ceil(gap/avg)+" propuesta(s) más":"")+"."; }

  // Hecho hoy (para el contador y los tildes tachados)
  const hechas=touches.filter(x=>new Date(x.createdAt)>=hoy0 && (x.tipo==="mail"||x.tipo==="llamada"||/^✓/.test(String(x.texto||""))));

  // El tilde es SOLO una marca del día: tildar = completada, destildar = pendiente.
  // La tarea nunca se borra ni se mueve — la lista queda fija, en orden de llegada.
  const manuales=new Set(hechas.filter(x=>/^✓/.test(String(x.texto||""))).map(x=>x.leadId));
  const realHoy=new Set(hechas.filter(x=>x.tipo==="mail"||x.tipo==="llamada").map(x=>x.leadId));
  const hechoIds=new Set([...manuales,...realHoy]);
  const doneExtra=leads.filter(l=>hechoIds.has(l.id) && !["ganado","perdido"].includes(l.status) && !items.some(it=>it.l.id===l.id));
  const dia=[...items.map(({l,a})=>({l,a,done:hechoIds.has(l.id)})), ...doneExtra.map(l=>({l,a:null,done:true}))]
    .sort((x,y)=> new Date(x.l.createdAt)-new Date(y.l.createdAt));
  const nH=dia.filter(e=>e.done).length;
  // Captación: las llamadas para deals nuevos entran a la MISMA lista del día
  const ordP2={A:0,B:1,C:2};
  const hoyISO=new Date().toISOString().slice(0,10);
  const capItems=prospectos.filter(p=>!p.leadId && !["enviado","respondio","descartado"].includes(p.status) && (p.email||p.emailDirecto||p.phone||p.phoneDirecto))
    .sort((a,b)=>(((a.prioridad in ordP2)?ordP2[a.prioridad]:3)-((b.prioridad in ordP2)?ordP2[b.prioridad]:3)) || (new Date(b.createdAt)-new Date(a.createdAt)))
    .slice(0,5).map(p=>({p,done:p.hoyHecho===hoyISO}));
  const capDone=capItems.filter(e=>e.done).length;
  const totHoy=dia.length+capItems.length, hechoHoy=nH+capDone;
  const eff = totHoy ? Math.round(hechoHoy/totHoy*100) : 0;
  const pasos = dia.slice(0,6).map((e,ix)=>`
    <div class="step" data-openlead="${e.l.id}" role="button" tabindex="0">
      ${e.done?(manuales.has(e.l.id)?`<span class="chk on undo" data-stepundo="${e.l.id}" title="Sacar el tilde">✓</span>`:`<span class="chk on" title="Se completó con un mail o llamada real">✓</span>`):`<span class="chk" data-stepdone="${e.l.id}" title="Marcar como completada">✓</span>`}
      <span class="n">${ix+1}</span>

    <span class="kpi" ${pfill(tasaCierre)}><b>${tasaCierre}%</b> cierre</span>

  </div>
  <div class="bento">
    <div class="bcard hl sp6 rsp2">
      <div class="bhead"><span class="bt">Para hoy</span><span class="bn" style="font-size:15px;font-weight:700">${hechoHoy}/${totHoy}</span></div>
      ${totHoy?`<div style="margin-top:6px">${pasos}${capPasos}</div>`:""}
      ${totHoy?`<div style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="bt">Efectividad del día</span>
          <span class="bn" style="font-size:14px;font-weight:700">${eff}%</span>
        </div>
        <div class="pbar" style="margin-top:8px"><span style="width:${eff}%;background:${eff>=70?'var(--ok)':'var(--accent)'}"></span></div>
        <div class="bs" style="margin-top:6px">${hechoHoy} completada(s) · ${totHoy-hechoHoy} pendiente(s)</div>
      </div>`:""}
      ${items.length?`<button class="linkbtn" style="margin-top:14px" data-gotab="hoy">${items.length>6?`Ver los ${items.length} →`:"Abrir la lista completa →"}</button>`:""}
    </div>
    <div class="bcard sp3">

      <div style="display:flex;gap:18px;align-items:center">
        ${anillo}
        <div style="min-width:0">
          <div class="big" style="margin:0;font-size:clamp(20px,1.8vw,28px)">${money(cobradoMes)}</div>
          <div class="bs" style="margin-top:4px">cobrado este mes${goal?" · de "+money(goal):""}</div>

/* ---------- ANÁLISIS (cerebro) ---------- */
function renderAnalisis(){
  const total = leads.length;
  if(!total){ $app().innerHTML = `<div class="empty"><b>Todavía no hay datos para analizar.</b><br>Cuando empieces a mover leads (enviar, responder, ganar, perder), acá vas a ver <b>dónde se te caen los deals y por qué</b>, con recomendaciones basadas en estudios de ventas.</div>`; return; }

  const inState = (...s)=>leads.filter(l=>s.includes(l.status));
  const gan = inState("ganado").length, perd = inState("perdido").length;
  const contactados = leads.filter(l=>Number(l.mailsEnviados)>0 || ["enviado","sin_respuesta","respondio","ganado","perdido"].includes(l.status)).length;
  const respondieron = leads.filter(l=>Number(l.respuestas)>0 || l.status==="respondio").length;
  const sinContactar = total - contactados;
  const cerrados = gan+perd;

  // ---- Embudo ----
  const paso = (label,n,base)=>{ const pct = base? Math.round(n/base*100):0; return {label,n,pct}; };
  const F = [
    paso("Leads totales", total, total),
    paso("Contactados", contactados, total),
    paso("Respondieron", respondieron, contactados||1),
    paso("Ganados", gan, respondieron||1),
  ];
  const funnelHtml = F.map((p,i)=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span>${p.label}</span><span style="font-family:var(--mono);color:var(--muted)">${p.n}${i>0?` · ${p.pct}%`:""}</span>
      </div>
      <div style="height:9px;background:var(--hair2);border-radius:99px;overflow:hidden">
        <div style="height:100%;width:${i===0?100:Math.max(3,p.pct)}%;background:var(--accent);opacity:${1-i*0.18}"></div>
      </div>
    </div>`).join("");

  // ---- Motivos de pérdida ----
  const perdidos = inState("perdido");
  const motivos = {};
  perdidos.forEach(l=>{ const m=(l.cierreMotivo&&l.cierreMotivo!=="ganado")?l.cierreMotivo:"(sin motivo)"; motivos[m]=(motivos[m]||0)+1; });
  const motivosArr = Object.entries(motivos).sort((a,b)=>b[1]-a[1]);
  const topMotivo = motivosArr[0];
  const motivosHtml = motivosArr.length
    ? motivosArr.map(([m,n])=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--hair2)"><span>${esc(m)}</span><span style="font-family:var(--mono);color:var(--accent)">${n}</span></div>`).join("")
    : `<div style="color:var(--muted);font-size:13px">Todavía no marcaste ningún lead como Perdido con motivo.</div>`;

  // ---- Win rate por servicio ----
  const porServ = {};
  leads.forEach(l=>{ if(l.status==="ganado"||l.status==="perdido"){ const k=l.service||"(sin rubro)"; porServ[k]=porServ[k]||{g:0,p:0}; if(l.status==="ganado")porServ[k].g++; else porServ[k].p++; } });
  const servArr = Object.entries(porServ).sort((a,b)=>(b[1].g+b[1].p)-(a[1].g+a[1].p));
  const servHtml = servArr.length
    ? servArr.map(([k,v])=>{ const tot=v.g+v.p; const wr=tot?Math.round(v.g/tot*100):0; return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--hair2)"><span>${esc(k)}</span><span style="font-family:var(--mono);color:var(--muted)">${v.g}/${tot} · <span style="color:${wr>=50?'var(--ok)':'var(--accent)'}">${wr}%</span></span></div>`; }).join("")
    : `<div style="color:var(--muted);font-size:13px">Cuando cierres deals (ganados/perdidos) por rubro, vas a ver acá qué nicho convierte mejor.</div>`;

  // ---- Velocidad de respuesta (de lead creado a primer mail) ----
  let horas=[];
  leads.forEach(l=>{ const t=touchesOf(l.id).filter(x=>x.tipo==="mail"); if(t.length){ const first=t.reduce((a,b)=>new Date(a.createdAt)<new Date(b.createdAt)?a:b); const h=(new Date(first.createdAt)-new Date(l.createdAt))/3600000; if(h>=0&&h<24*14) horas.push(h); } });
  const velProm = horas.length? (horas.reduce((a,b)=>a+b,0)/horas.length) : null;
  const velTxt = velProm===null? "sin datos aún" : (velProm<1? "menos de 1 h" : velProm<24? velProm.toFixed(1)+" h" : (velProm/24).toFixed(1)+" días");

  // ---- Diagnóstico (prioriza el agujero más grande) ----
  let diag;
  if(sinContactar >= Math.max(3, total*0.3)){
    diag = `Tenés <b>${sinContactar} leads sin contactar</b>. Según Harvard Business Review, contactar en la <b>primera hora</b> multiplica por 7 las chances de calificar al lead (vs. esperar 24 h). Prioridad #1: vaciar <b>PARA HOY</b> rápido.`;
  } else if(velProm!==null && velProm>1){
    diag = `Estás respondiendo en promedio en <b>${velTxt}</b>. Los estudios muestran que bajar a <b>menos de 5 minutos</b> puede multiplicar por 100 el contacto. Si podés, respondé los nuevos apenas entran.`;
  } else if(contactados && respondieron/contactados < 0.25){
    diag = `De los que contactaste, <b>responden pocos (${Math.round(respondieron/contactados*100)}%)</b>. El cuello está en el <b>primer mensaje</b>: probá otro asunto y un primer renglón más directo. Usá "Rehacer" para variar el enfoque.`;
  } else if(topMotivo){
    diag = `Donde más perdés es por <b>${esc(topMotivo[0])}</b> (${topMotivo[1]} caso/s). ${topMotivo[0]==="precio"?"Mostrá valor antes del número y proponé una llamada para cotizar en contexto.":topMotivo[0]==="timing"||topMotivo[0]==="no era el momento"?"No los pierdas: armá un seguimiento a 30-60 días para cuando sea el momento.":topMotivo[0]==="desapareció"?"Sumá un toque extra en la cadencia antes de darlos por perdidos.":"Revisá qué faltó en esos cierres (campo 'Qué faltó')."}`;
  } else if(cerrados){
    diag = `Vas <b>${gan} ganados / ${perd} perdidos</b>. Buen ritmo — seguí cargando el motivo de cada cierre para que el análisis sea más preciso.`;
  } else {
    diag = `Todavía no cerraste deals. Cuando marques Ganado/Perdido con su motivo, acá te voy a decir <b>dónde ajustar</b>.`;
  }

  $app().innerHTML = `
    <div class="panel" style="border-left:3px solid var(--accent)">
      <div class="bar"><h2><span class="tick"></span>Diagnóstico</h2></div>
      <div style="font-size:14px;line-height:1.6;color:#E6E7EB">${diag}</div>
    </div>
    <div class="grid" style="margin-top:4px">
      <div class="stat"><span class="l">Velocidad de respuesta</span><div class="v">${velTxt}</div><div class="s">de lead nuevo a primer mail</div></div>
      <div class="stat"><span class="l">Tasa de cierre</span><div class="v">${cerrados?Math.round(gan/cerrados*100):0}%</div><div class="s">${gan} ganados de ${cerrados} cerrados</div></div>
      <div class="stat"><span class="l">Sin contactar</span><div class="v">${sinContactar}</div><div class="s">esperando primer toque</div></div>
    </div>
    <div class="panel">
      <div class="bar"><h2><span class="tick"></span>Embudo</h2></div>
      ${funnelHtml}
    </div>
    <div class="grid2">
      <div class="panel"><div class="bar"><h2><span class="tick"></span>Por qué se pierden</h2></div>${motivosHtml}</div>
      <div class="panel"><div class="bar"><h2><span class="tick"></span>Cierre por rubro</h2></div>${servHtml}</div>
    </div>`;
}

    <label><span class="fl">Título</span><input name="title" value="${esc(d?d.title:"")}" required placeholder="Localización creole — 7 cursos"></label>

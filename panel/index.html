function idiomaTag(idi){
  if(!idi) return "";
  const u=String(idi).toUpperCase();
  const es=u.includes("ES"), en=u.includes("EN"), mix=u.includes("MIX");
  const txt=mix?"EN/ES":(es&&!en?"ES":(en&&!es?"EN":u));
  return `<span title="Idioma de las reseñas (pista — el dueño puede ser de habla inglesa)" style="font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);border:1px solid var(--hair2);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle">${txt}</span>`;
}
const _R=x=>x*Math.PI/180;
function _hav(a,b){ if(!(a.lat&&a.lng&&b.lat&&b.lng)) return null; const dl=_R(b.lat-a.lat),dg=_R(b.lng-a.lng); const q=Math.sin(dl/2)**2+Math.cos(_R(a.lat))*Math.cos(_R(b.lat))*Math.sin(dg/2)**2; return 2*3959*Math.asin(Math.sqrt(q)); }
function ordenarCercania(lista){
  const PARTIDA={lat:25.93,lng:-80.17};
  const geo=lista.filter(p=>p.lat&&p.lng), noGeo=lista.filter(p=>!(p.lat&&p.lng));
  let ord=[];
  if(geo.length){ const rest=[...geo]; let cur=PARTIDA; while(rest.length){ let bi=0,bd=Infinity; rest.forEach((p,i)=>{const d=_hav(cur,p); if(d<bd){bd=d;bi=i;}}); const n=rest.splice(bi,1)[0]; n._desde=_hav(cur,n); ord.push(n); cur=n; } }
  return ord.concat(noGeo.sort((a,b)=>String(a.ciudad||"").localeCompare(String(b.ciudad||""))));
}
function rutaMapsUrl(lista){
  const pt=p=>(p.lat&&p.lng)?(p.lat+","+p.lng):encodeURIComponent([p.empresa,p.ciudad].filter(Boolean).join(", "));
  const pts=lista.slice(0,10).map(pt); if(!pts.length) return "";
  const dest=pts[pts.length-1], way=pts.slice(0,-1).join("|");
  return "https://www.google.com/maps/dir/?api=1&destination="+dest+(way?"&waypoints="+way:"")+"&travelmode=driving";
}

function isoLocal(x){ return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function fmtDia(di){ if(!di) return ""; const q=di.split("-").map(Number); return new Date(q[0],q[1]-1,q[2]).toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"}); }
function mesGrid(base){ const y=base.getFullYear(),m=base.getMonth(); const dow0=new Date(y,m,1).getDay(); const dim=new Date(y,m+1,0).getDate(); const a=[]; for(let i=0;i<dow0;i++)a.push(null); for(let d=1;d<=dim;d++)a.push(new Date(y,m,d)); return a; }

function gcalUrl(p){

let _leafletP=null;
function cargarLeaflet(){
  if(window.L) return Promise.resolve();
  if(_leafletP) return _leafletP;
  _leafletP=new Promise((res,rej)=>{
    const css=document.createElement("link"); css.rel="stylesheet";
    css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const sc=document.createElement("script");
    sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    sc.onload=()=>res(); sc.onerror=()=>{_leafletP=null;rej(new Error("No se pudo cargar el mapa — probá de nuevo."));};
    document.head.appendChild(sc);
  });
  return _leafletP;
}

  let _geoT=0;
  const buscarLugar=async (lat,lng)=>{
    if(Date.now()-_geoT<1200) return; _geoT=Date.now();
    try{
      const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&lat="+lat+"&lon="+lng,{headers:{"Accept":"application/json"}});
      const j=await r.json(); const a=j.address||{};
      const barrio=a.neighbourhood||a.suburb||a.quarter||a.city_district||"";
      const ciudad=a.city||a.town||a.village||a.county||"";
      lugarActual=[barrio,ciudad].filter(Boolean).join(", ")||(j.name||"");
      const el=document.getElementById("maplugar"); if(el) el.textContent=lugarActual?("· "+lugarActual):"";
    }catch(e){}
  };
  const start=(lat,lng)=>{
    const map=L.map("mapa").setView([lat,lng],11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    const pinIcon=L.divIcon({className:"",iconSize:[34,34],iconAnchor:[17,32],
      html:'<svg viewBox="0 0 24 24" width="34" height="34" fill="#DD7D47" stroke="#0B0C0E" stroke-width="1"><path d="M12 22s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="10" r="2.8" fill="#0B0C0E"/></svg>'});
    const mk=L.marker([lat,lng],{draggable:true,icon:pinIcon}).addTo(map);
    const circ=L.circle([lat,lng],{radius:10*1609.34,color:"#DD7D47",fillColor:"#DD7D47",fillOpacity:.16,weight:2.5}).addTo(map);
    const upd=()=>{ const mi=Number(document.getElementById("mapradio").value);
      const mm=document.getElementById("mapmillas"); if(mm) mm.textContent=mi+" millas alrededor";
      circ.setLatLng(mk.getLatLng()); circ.setRadius(mi*1609.34); };
    mk.on("drag",upd); mk.on("dragend",()=>{ map.panTo(mk.getLatLng()); upd(); const c=mk.getLatLng(); buscarLugar(c.lat,c.lng); });
    buscarLugar(lat,lng);
    document.getElementById("mapradio").addEventListener("input",upd);
    document.getElementById("mapusar").addEventListener("click",()=>{
      const mi=Number(document.getElementById("mapradio").value), c=mk.getLatLng();
      const f=document.getElementById("f-busquedas");
      if(f){ f.zona.value=mi+" millas alrededor de "+(lugarActual||("("+c.lat.toFixed(4)+", "+c.lng.toFixed(4)+")"));
        f.lat.value=c.lat.toFixed(6); f.lng.value=c.lng.toFixed(6); f.radio.value=mi; }
      wrap.remove();
    });
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>start(pos.coords.latitude,pos.coords.longitude),
      ()=>start(25.890,-80.186), {timeout:6000});
  } else start(25.890,-80.186);
}

/* ---------- PARA HOY (cola de acción del día) ---------- */
function accionHoy(l){
  if(l.status==='nuevo')    return { label:'Responder', tipo:'mail',    hot:false };
  if(l.status==='respondio')return { label:'Responder', tipo:'mail',    hot:true  }; // caliente: te respondió — mismo verbo, distinto color
  if((l.status==='enviado'||l.status==='sin_respuesta') && l.segActivo && l.nextAt){
    const fin=new Date(); fin.setHours(23,59,59,999);
    if(new Date(l.nextAt)<=fin) return { label:(l.nextTipo==='llamada'?'Llamar':'Seguimiento'), tipo:(l.nextTipo||'mail'), hot:false };
  }
  return null;
}

/* ---------- eventos ---------- */
function note(msg){
  const n=document.createElement("div");
  n.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d1e23;border:1px solid var(--hair);padding:10px 16px;border-radius:8px;font-size:13px;z-index:999;max-width:90vw;text-align:center";
  n.textContent=msg; document.body.appendChild(n); setTimeout(()=>n.remove(),5000);
}

document.addEventListener("click", async e=>{
  const t = e.target;
  if(!sb) return;
  if(agendaPick && t.closest && !t.closest(".agenda-pop") && !(t.dataset&&(t.dataset.agopen||t.dataset.agclose))){ agendaPick=null; agendaDay=null; agendaHora=null; renderApp(); return; }
  const fr = t.closest && t.closest("[data-franja]");
  if(fr){ const s=fr.dataset.franja; leadCollapsed[s]=!leadCollapsed[s]; renderApp(); return; }
  if(t.dataset.leadfilter){ leadFilter=t.dataset.leadfilter; renderApp(); return; }
  if(t.dataset.vendadd){
    const inp=document.getElementById("vendnuevo"); const nombre=(inp&&inp.value.trim())||"";
    const em=document.getElementById("vendemail"); const email=(em&&em.value.trim().toLowerCase())||"";
    if(!nombre){ note("Escribí el nombre del vendedor."); return; }
    const { error } = await sb.from("vendedores").insert({ nombre, email: email||null });
    if(error) note("No se pudo agregar: "+error.message); else await loadAll();
    return;
  }
  if(t.dataset.vendtoggle){
    const v=vendedores.find(x=>x.id===t.dataset.vendtoggle); if(!v) return;
    const { error } = await sb.from("vendedores").update({ activo: !v.activo }).eq("id", v.id);
    if(error) note("No se pudo cambiar: "+error.message); else await loadAll();
    return;
  }
  if(t.dataset.repn){
    const [dir,which]=t.dataset.repn.split(":");
    const el=document.getElementById("rep_"+which); if(!el) return;
    let v=Number(el.value)||0; v += (dir==='+'?1:-1); if(v<0)v=0;
    el.value=v; return;
  }
  if(t.dataset.vendsub){ vendSub=t.dataset.vendsub; renderApp(); return; }
  if(t.dataset.metastep){
    const [dir,vid]=t.dataset.metastep.split(":");
    const inp=document.querySelector(`input[data-vendmeta="${vid}"]`); if(!inp) return;
    let val=Number(inp.value)||0; val += (dir==='+'?500:-500); if(val<0)val=0;
    inp.value=val;
    const { error } = await sb.from("vendedores").update({ meta_mensual: val }).eq("id", vid);
    if(error) note("No se pudo guardar la meta: "+error.message);
    return;
  }
  if(t.dataset.repdroptoggle){ repDropOpen=!repDropOpen; renderApp(); return; }
  if(t.dataset.reppick){ repVendId=t.dataset.reppick; repDropOpen=false; renderApp(); return; }
  if(repDropOpen && !(t.closest && t.closest(".mdrop"))){ repDropOpen=false; renderApp(); return; }
  if(t.dataset.repartir){
    const aEl=document.getElementById("rep_a"), bEl=document.getElementById("rep_b");
    const na=Math.max(0,Number(aEl&&aEl.value)||0), nb=Math.max(0,Number(bEl&&bEl.value)||0);
    const activos=vendedores.filter(v=>v.activo && v.email);
    const vid = repVendId || (activos[0]&&activos[0].id);
    if(!vid){ note("Elegí un vendedor."); return; }

// Propuesta aprobada -> la factura se crea sola (número siguiente, cliente y monto de la propuesta, pendiente)
async function autoFactura(p){
  if(!p) return;
  const marca = "Propuesta "+(p.number||"");
  if(p.number && invoices.some(i=>String(i.notes||"").includes(marca))) return; // ya tiene factura
  const hoy=new Date(); const vence=new Date(); vence.setDate(vence.getDate()+15);
  const iso=d=>d.toISOString().slice(0,10);
  const row={
    number: nextNumber(invoices,"INV"),
    client_id: p.clientId||null,
    amount: Number(p.amount)||0,
    status: "pendiente",
    issued: iso(hoy),
    due: iso(vence),
    notes: `${p.title||"Servicios profesionales"} — ${Number(p.amount)||0}\n${marca}`.trim(),
    created_at: new Date().toISOString(),
  };
  const {error}=await sb.from("invoices").insert(row);
  if(error){ note("La propuesta quedó aprobada, pero no pude crear la factura: "+error.message); return; }
  note("🧾 Factura "+row.number+" creada sola desde la propuesta aprobada — está en FACTURAS, lista para el PDF.");
}

document.addEventListener("submit", async e=>{
  const f=e.target; if(!f.id||!f.id.startsWith("f-")) return;
  e.preventDefault();
  const col=f.id.slice(2);
  const data=Object.fromEntries(new FormData(f).entries());
  const fileInput=f.querySelector('input[type="file"]');
  delete data.__file;

    if(fileInput && fileInput.files && fileInput.files[0]){
      const file=fileInput.files[0];
      const path=Date.now()+"-"+file.name.replace(/[^\w.\-]/g,"_");
      const up=await sb.storage.from("proposals").upload(path,file,{upsert:false});
      if(up.error){ note("No se pudo subir el PDF; el resto se guarda igual."); }
      else{ const {data:pub}=sb.storage.from("proposals").getPublicUrl(path); data.fileUrl=pub.publicUrl; data.fileName=file.name; }
    }
    if(editing && editing.col===col && !data.fileUrl){
      const prev=(col==="proposals"?proposals:col==="invoices"?invoices:clients).find(x=>x.id===editing.id);
      if(prev && prev.fileUrl){ data.fileUrl=prev.fileUrl; data.fileName=prev.fileName||""; }
    }
    if(col==="busquedas"){
      const VENTANA=120*24*3600*1000; // 4 meses
      const toR=x=>x*Math.PI/180;
      const dup=busquedas.find(b=>{
        if(String(b.rubro||"").trim().toLowerCase()!==String(data.rubro||"").trim().toLowerCase()) return false;
        if((Date.now()-new Date(b.createdAt).getTime())>VENTANA) return false;
        if(String(b.zona||"").trim().toLowerCase()===String(data.zona||"").trim().toLowerCase()) return true;
        if(b.lat&&b.lng&&data.lat&&data.lng){
          const la1=toR(Number(b.lat)), la2=toR(Number(data.lat));
          const d=2*3959*Math.asin(Math.sqrt(Math.pow(Math.sin((la2-la1)/2),2)+Math.cos(la1)*Math.cos(la2)*Math.pow(Math.sin((toR(Number(data.lng))-toR(Number(b.lng)))/2),2)));
          return d < Math.max(10, Number(b.radioMillas||0)/2);
        }
        return false;
      });
      if(dup){
        const desde=new Date(new Date(dup.createdAt).getTime()+VENTANA).toISOString().slice(0,10);
        note("Ese nicho en esa zona ya se buscó el "+String(dup.createdAt||"").slice(0,10)+". Se repite desde el "+desde+" — así entran solo las empresas nuevas.");
        return;
      }
    }
    const row=TO[col](data);
    let error;
    if(editing && editing.col===col){ ({error}=await sb.from(col).update(row).eq("id",editing.id)); }
    else { row.created_at=new Date().toISOString(); ({error}=await sb.from(col).insert(row)); }
    if(error){ note("No se pudo guardar: "+error.message); return; }
    if(col==="busquedas" && !(editing&&editing.col==="busquedas")){
      formOpen=null; editing=null; await loadAll();
      note("✓ Búsqueda pedida — quedó PENDIENTE. El buscador la agarra en ~1 min (dejá abierta la ventana del motor).");
      const nueva=[...busquedas].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
      setTimeout(()=>{ const el=document.querySelector('[data-busqrow]'); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.style.transition="background .5s"; el.style.background="rgba(221,125,71,.18)"; setTimeout(()=>{el.style.background="";},2200); } },150);
      return;
    }
    if(col==="proposals" && data.status==="aprobada"){
      const prev = editing ? proposals.find(x=>x.id===editing.id) : null;
      if(!prev || prev.status!=="aprobada") await autoFactura({ number:data.number, clientId:data.clientId||null, title:data.title, amount:data.amount });
    }
    formOpen=null; editing=null; await loadAll();
  }catch(err){ note("No se pudo guardar: "+err.message); }
});

// el cuadro de respuesta crece solo con el texto
document.addEventListener("input", e=>{ if(e.target && e.target.id==="lreply") autoGrow(e.target); });

// cambio de estado del lead (dropdown)
document.addEventListener("change", async e=>{
  const t = e.target;
  if(t.id==="comes"){ comisionMes = t.value; renderApp(); return; }
  if(t.dataset && t.dataset.visitafecha && t.value){
    await sb.from("prospectos").update({ visita_dia:t.value, visitar:true, updated_at:new Date().toISOString() }).eq("id", t.dataset.visitafecha);
    note("📅 Asignado a "+t.value); await loadAll(); return;
  }
  if(t.dataset && t.dataset.visitahora){
    await sb.from("prospectos").update({ visita_hora:t.value||null, updated_at:new Date().toISOString() }).eq("id", t.dataset.visitahora);
    note(t.value?("🕒 Hora: "+t.value):"Hora borrada"); await loadAll(); return;
  }
  if(t.dataset && t.dataset.prstatus){
    const { error } = await sb.from("prospectos").update({ status: t.value, updated_at:new Date().toISOString() }).eq("id", t.dataset.prstatus);
    if(error) note("No se pudo cambiar el estado: "+error.message); else await loadAll();
    return;
  }
  if(t.dataset && t.dataset.lstatus){
    const { error } = await sb.from("leads").update({ status: t.value }).eq("id", t.dataset.lstatus);
    if(error) note("No se pudo cambiar el estado: "+error.message); else await loadAll();
  }
  if(t.dataset && t.dataset.assignvend){
    const { error } = await sb.from("leads").update({ vendedor_id: t.value||null }).eq("id", t.dataset.assignvend);
    if(error) note("No se pudo asignar: "+error.message); else { note(t.value?"Asignado ✓":"Sin asignar"); await loadAll(); }
  }
  if(t.dataset && t.dataset.vendmeta){
    const { error } = await sb.from("vendedores").update({ meta_mensual: Number(t.value)||0 }).eq("id", t.dataset.vendmeta);
    if(error) note("No se pudo guardar la meta: "+error.message); else { note("Meta guardada ✓"); await loadAll(); }
  }
});

/* ---------- login ---------- */
function renderLogin(err){
  document.getElementById("root").innerHTML = `
  <div class="login"><div class="box">
    <h1>LORENZO</h1><div class="sub">AGENCY · PANEL</div>
    <form id="loginf">
      <label><span class="fl">Email</span><input name="email" type="email" required autocomplete="username"></label>
      <label><span class="fl">Contraseña</span><input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit" style="width:100%">Entrar</button>
      <div class="err">${err?esc(err):""}</div>
    </form>
  </div></div>`;
  document.getElementById("loginf").addEventListener("submit", async e=>{
    e.preventDefault();
    const {email,password}=Object.fromEntries(new FormData(e.target).entries());
    const btn=e.target.querySelector("button"); btn.textContent="Entrando…"; btn.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){ renderLogin("Email o contraseña incorrectos."); }
  });
}

/* ---------- boot ---------- */
async function boot(){
  if(!configured){
    document.getElementById("root").innerHTML='<div class="offline">Panel sin configurar.<br>Falta pegar las credenciales de Supabase en config.js.</div>';
    return;
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  sessionEmail = session.user.email||"";
  const {data:adm}=await sb.rpc("is_admin");
  isAdmin=!!adm; canWrite=isAdmin;
  if(!isAdmin){
    // ¿es vendedor? (ve solo lo suyo)
    try{ const {data:vid}=await sb.rpc("mi_vendedor_id"); miVendedorId=vid||null; }catch(e){ miVendedorId=null; }
    esVendedor=!!miVendedorId;
    tab = esVendedor ? "hoy" : "propuestas";
  }
  await loadAll();
  // realtime: sincroniza entre dispositivos
  sb.channel("panel-rt").on("postgres_changes",{event:"*",schema:"public"},()=>loadAll()).subscribe();
}
sb && sb.auth.onAuthStateChange((_e,session)=>{
  if(session && document.getElementById("loginf")){ boot(); }
  else if(!session){ renderLogin(); }
});
boot();
</script>

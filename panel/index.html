<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel · LORENZO Agency</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg0:#0B0C0E; --bg1:#121316; --card:rgba(255,255,255,.028);
  --fg:#EFF0F3; --muted:#93969D; --faint:#6A6D74;
  --hair:rgba(236,238,243,.14); --hair2:rgba(236,238,243,.08);
  --accent:#DD7D47;
  --ok:#4CC38A; --warn:#E5B454; --bad:#E5604C; --info:#6AA5E8;
  --disp:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 85% -10%,rgba(232,235,242,.06),transparent 45%),var(--bg0);
  color:var(--fg);font-family:var(--disp);font-size:14px;min-height:100vh;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:22px 0 18px;border-bottom:1px solid var(--hair2)}
.wordmark b{font-weight:600;font-size:13px;letter-spacing:.2em}
.wordmark span{color:var(--muted);font-size:10px;letter-spacing:.3em;margin-left:10px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}
nav button{background:none;border:1px solid var(--hair2);color:var(--muted);font-family:var(--mono);
  font-size:11px;letter-spacing:.14em;padding:9px 16px;border-radius:999px;cursor:pointer}
nav button.on{color:#fff;border-color:var(--accent);background:var(--accent);font-weight:600}
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;
  margin-left:8px;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--disp);font-size:11px;
  font-weight:700;line-height:1;vertical-align:middle}
.lsel{background:var(--bg1);border:1px solid var(--hair);border-radius:7px;color:var(--fg);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.08em;padding:6px 8px;text-transform:uppercase;width:auto;cursor:pointer}
.linkbtn{background:none;border:none;color:var(--accent);font-family:var(--disp);font-size:12.5px;text-align:left;
  cursor:pointer;padding:0;text-decoration:none}
.linkbtn:hover{text-decoration:underline}
.telink{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;white-space:nowrap}
.telink:hover{text-decoration:underline}
.btn-trad{color:var(--info);border-color:rgba(106,165,232,.5)!important}
.btn-trad:hover{background:rgba(106,165,232,.12)}
.tradhint{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--info);background:rgba(106,165,232,.1);border:1px solid rgba(106,165,232,.3);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.langchip{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;border-radius:999px;padding:3px 9px;cursor:pointer;background:transparent;transition:.15s}
.langchip.es{color:#67c998;border:1px solid rgba(103,201,152,.45)}
.langchip.es:hover{background:rgba(103,201,152,.12)}
.langchip.en{color:var(--info);border:1px solid rgba(106,165,232,.45)}
.langchip.en:hover{background:rgba(106,165,232,.12)}
/* embudo */
.fchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.fchip{background:none;border:1px solid var(--hair2);color:var(--muted);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;padding:7px 12px;border-radius:999px;cursor:pointer;text-transform:uppercase}
.fchip.on{color:var(--fg);border-color:var(--accent);background:rgba(221,125,71,.08)}
.fchip b{font-family:var(--disp);font-weight:700;margin-left:4px}
.fchip.hot{border-color:rgba(221,125,71,.5)}
.fchip.hot.on{background:rgba(221,125,71,.14)}
/* franjas (secciones por estado) */
.franja{background:var(--card);border:1px solid var(--hair2);border-radius:16px;padding:2px 18px 8px;margin-bottom:14px}
.franja .tablewrap{background:none;border:none;border-radius:0;padding:0}
.franja-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair);
  color:var(--fg);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 4px;cursor:pointer;text-align:left}
.franja-h b{margin-left:auto;font-family:var(--disp);font-weight:700;color:var(--muted);font-size:13px}
.franja.hot .franja-h{color:var(--accent)}
.franja.hot .franja-h b{color:var(--accent)}
.chev{display:inline-block;transition:transform .18s;color:var(--accent);font-size:12px}
.chev.o{transform:rotate(90deg)}
/* barra de interés */
.ibar{width:66px;height:7px;background:var(--hair2);border-radius:99px;overflow:hidden}
.ifill{height:100%;border-radius:99px;transition:width .25s}
.ifill.amber{background:var(--warn)}
.ifill.orange{background:var(--accent)}
.imini{display:inline-flex;align-items:center;gap:7px}
.imini .n{font-family:var(--mono);font-size:10px;color:var(--faint)}
/* barra de cierre (avance hacia la venta) */
.cbar-wrap{margin:14px 0;padding:12px 14px;border:1px solid var(--hair2);border-radius:10px}
.cbar-h{font-family:var(--disp);font-size:14.5px;font-weight:800;letter-spacing:.01em;color:#fff;margin-bottom:12px}
.cbar{height:6px;background:var(--hair2);border-radius:99px;overflow:hidden;margin-top:8px}
.cbar-row{display:flex;gap:14px;margin-top:9px;font-size:13.5px;line-height:1.6}
.cbar-row .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;min-width:52px;padding-top:4px}
.cbar-row .v{color:var(--fg);flex:1}
.cbar-f{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.cbar-f.ok{background:var(--ok)} .cbar-f.bad{background:var(--bad)}
.cbar-l{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--fg);margin-top:7px}
.cbar-falta{font-size:12px;color:var(--muted);margin-top:5px}
.cbar-sug{margin-top:11px;padding:10px 12px;border:1px dashed var(--hair2);border-radius:8px;font-size:12.5px;line-height:1.55;color:var(--fg)}
.cbar-sug-a{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.cbar-set{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cbar-set input{flex:1 1 100%;background:rgba(0,0,0,.25);border:1px solid var(--hair2);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:12px}
/* títulos de sección dentro de la ficha del lead */
.sect{margin:22px 0 10px;font-family:var(--disp);font-size:14.5px;font-weight:800;letter-spacing:.01em;color:#fff;display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:var(--hair2)}
/* pestañas internas de la ficha (zona de actividad, estilo CRM) */
.ftabs{display:flex;gap:4px;flex-wrap:wrap;margin:26px 0 0;border-bottom:1px solid var(--hair2)}
.ftab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;margin-bottom:-1px}
.ftab:hover{color:var(--fg)}
.ftab.on{color:var(--fg);border-bottom-color:var(--accent)}
.ftabc{padding-top:20px}
.fempty{color:var(--faint);font-size:13px;padding:18px 0 6px}
.lmodal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50}
.lcard{background:linear-gradient(180deg,rgba(32,33,38,.78),rgba(16,17,20,.82));
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:26px 30px;max-width:1120px;width:100%;
  max-height:90vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08)}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.lname{font-size:18px;font-weight:700}
.lmeta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.lcontact{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#C9CBD1;margin-bottom:14px;padding-bottom:14px;
  border-bottom:1px solid var(--hair2)}
.lcontact span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin-right:4px}
.lmsg{font-size:19px;line-height:1.5;color:var(--fg);font-weight:500;white-space:pre-wrap;word-break:break-word;margin:6px 0 6px}
.lreplied{margin:16px 0 0;border-left:2px solid var(--accent);padding:2px 0 2px 12px}
.lreplied-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:5px}
.lreplied-b{font-size:14px;line-height:1.55;color:#C9CBD1;white-space:pre-wrap;word-break:break-word}
/* respuesta sugerida */
.lreplywrap{margin:18px 0 22px;border-top:1px solid var(--hair2);padding-top:18px}
.lreplyhead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;
  margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lreplyhead .c{color:var(--accent)}
.lreply{min-height:92px;font-size:15px;line-height:1.6;resize:vertical;color:#F2F3F6;border-radius:14px;padding:14px 18px;overflow-y:auto;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 12px 40px rgba(0,0,0,.35)}
.lreply.full{min-height:220px}
.lreply:focus{outline:none;border-color:rgba(221,125,71,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 3px rgba(221,125,71,.14), 0 12px 40px rgba(0,0,0,.35)}
.lreplyactions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.lsent{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin-left:auto}
.lactions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--hair2);padding-top:16px}
.btn-reply{background:none;color:#C9CBD1;border:1px solid var(--hair);border-radius:8px;padding:9px 14px;font-weight:600;
  font-size:12.5px;font-family:var(--disp);text-decoration:none;cursor:pointer;transition:border-color .18s,color .18s}
.btn-reply:hover{border-color:var(--accent);color:var(--accent)}
.lrubro{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
  border:1px solid var(--hair);border-radius:999px;padding:3px 9px;text-transform:uppercase;white-space:nowrap}
.btn-trash{background:rgba(229,96,76,.12);border:1px solid rgba(229,96,76,.4);color:var(--bad);
  border-radius:8px;padding:9px 13px;font-size:15px;line-height:1;cursor:pointer}
.btn-trash:hover{background:rgba(229,96,76,.22)}
.lactions .btn-trash{margin-left:auto}
.rowactions .btn-trash{padding:6px 9px;font-size:13px}
.btn-trash{display:inline-flex;align-items:center;justify-content:center}
.btn-del{display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.btn-del:hover{color:var(--bad);border-color:rgba(229,96,76,.4)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.stat{background:var(--card);border:1px solid var(--hair2);border-radius:16px;padding:20px}
/* ===== RESUMEN bento ===== */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:8px 0 18px;flex-wrap:wrap}
.hello h1{font-size:32px;font-weight:700;letter-spacing:-.01em}
.hello .hd{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:6px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.kpi{border:1px solid var(--hair2);background:var(--card);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--muted)}
.kpi b{color:var(--fg);font-variant-numeric:tabular-nums;margin-right:2px}
.kpi.hl{border-color:rgba(221,125,71,.45);background:rgba(221,125,71,.1);color:var(--fg)}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.bcard{background:var(--card);border:1px solid var(--hair2);border-radius:16px;padding:20px;grid-column:span 4;min-width:0}
.bcard.sp3{grid-column:span 3}.bcard.sp4{grid-column:span 4}.bcard.sp5{grid-column:span 5}.bcard.sp6{grid-column:span 6}.bcard.sp12{grid-column:span 12}
@media(max-width:980px){.bcard,.bcard.sp3,.bcard.sp4,.bcard.sp5,.bcard.sp6{grid-column:span 12}}
.prchip{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:6px;
  font-size:10.5px;font-weight:800;font-family:var(--disp);margin-right:8px;flex:none;vertical-align:middle}
.prchip.A{background:rgba(221,125,71,.16);color:var(--accent);border:1px solid rgba(221,125,71,.35)}
.prchip.B{background:rgba(229,180,84,.10);color:var(--warn);border:1px solid rgba(229,180,84,.28)}
.prchip.C{background:rgba(255,255,255,.04);color:var(--faint);border:1px solid var(--hair2)}
.bcard.hl{background:linear-gradient(180deg,rgba(221,125,71,.13),rgba(221,125,71,.04));border-color:rgba(221,125,71,.3)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.iconbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--hair);background:transparent;color:var(--faint);
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--hair2)}
.goalmsg{margin-top:16px;padding:9px 11px;border-radius:10px;font-size:12.5px;color:var(--muted);
  background:rgba(221,125,71,.07);border:1px solid rgba(221,125,71,.14)}
.goalmsg.ok{background:rgba(76,195,138,.08);border-color:rgba(76,195,138,.18)}
.bt{font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:.01em;color:#fff}
.bn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.bs{font-size:12.5px;color:var(--faint)}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.pbar{height:7px;background:var(--hair2);border-radius:99px;overflow:hidden;margin-top:12px}
.pbar span{display:block;height:100%}
.brow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px}
.brow b{color:var(--fg);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair2);padding:11px 2px;cursor:pointer;color:var(--fg);text-align:left;font-family:var(--disp);font-size:13.5px}
.step:last-of-type{border-bottom:none}
.step *{pointer-events:none}
.step:hover{background:rgba(255,255,255,.03)}
.step .n{flex:0 0 auto;width:14px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.step .st-a{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:0 0 auto;min-width:86px}
.step .st-a.hot{color:var(--accent)}
.step .st-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.mrow .mk{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;min-width:92px}
.mrow .mbar{flex:1;height:7px;background:var(--hair2);border-radius:99px;overflow:hidden}
.mrow .mbar span{display:block;height:100%;background:var(--accent)}
.mrow .mv{font-family:var(--mono);font-size:11px;min-width:20px;text-align:right}
/* deals calientes */
.hd{padding:10px 2px;border-bottom:1px solid var(--hair2);cursor:pointer}
.hd:last-of-type{border-bottom:none}
.hd *{pointer-events:none}
.hd:hover{background:rgba(255,255,255,.03)}
.hd-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hd-n{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-p{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;flex:0 0 auto}
.hd-bar{height:5px;background:var(--hair2);border-radius:99px;overflow:hidden;margin-top:6px}
.hd-bar span{display:block;height:100%;background:var(--accent)}
.hd-s{font-size:11.5px;color:var(--faint);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hnums{display:flex;gap:30px;align-items:flex-end}
.hnums b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.hnums span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:block;margin-top:6px}
.dbars{display:flex;gap:9px;align-items:flex-end;margin-top:14px}
.dbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.dbar span{display:block;width:9px;border-radius:99px;background:var(--accent)}
.dbar span.z{background:var(--hair2)}
.dbar i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--faint);text-transform:uppercase}
.done{display:flex;gap:12px;align-items:center;font-size:13.5px;padding:8px 2px;border-bottom:1px solid var(--hair2)}
.done:last-of-type{border-bottom:none}
.done .dk{flex:0 0 auto;width:22px;height:22px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.done .da{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:0 0 auto;min-width:86px}
.done .dn{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .chk{pointer-events:auto;flex:0 0 auto;width:22px;height:22px;border-radius:99px;border:1.5px solid var(--hair);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:11px;transition:.15s}
.step .chk:hover{border-color:var(--accent);color:#fff;background:var(--accent)}
.step .chk.on{background:var(--accent);border-color:var(--accent);color:#fff;pointer-events:none}
.step .chk.on.undo{pointer-events:auto;cursor:pointer}
.step .chk.on.undo:hover{background:transparent;color:var(--accent);border-color:var(--accent)}
.step .st-lang{flex:0 0 auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;border-radius:999px;padding:2px 8px}
.step .st-lang.es{color:#67c998;border:1px solid rgba(103,201,152,.45)}
.step .st-lang.en{color:var(--info);border:1px solid rgba(106,165,232,.45)}
.stat .l{font-family:var(--disp);font-size:14.5px;font-weight:800;letter-spacing:.01em;color:#fff}
.stat .v{font-size:26px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--faint);margin-top:4px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-size:17px;font-weight:700;letter-spacing:.02em}
.bar .tick{display:inline-block;width:18px;height:2px;background:var(--accent);margin-right:10px;vertical-align:middle}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;
  font-size:13px;cursor:pointer;font-family:var(--disp)}
.btn.ghost{background:none;border:1px solid var(--hair);color:var(--fg)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{background:rgba(229,96,76,.15);color:var(--bad);border:1px solid rgba(229,96,76,.4)}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{background:var(--bg1);border:1px solid var(--hair);border-radius:8px;color:var(--fg);

/* ---------- Transcripción en vivo de llamadas (Web Speech API) ----------
   Convierte lo que capta el micrófono a TEXTO en tiempo real. No guarda audio.
   La llamada va en altavoz cerca de la compu, y hay que avisar al cliente (ley de FL). */
function startTranscripcion(lang){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ note("Este navegador no soporta transcripción en vivo — usá Chrome o Edge."); return false; }
  const ta = document.getElementById("callnote");
  transcripcion = (ta && ta.value) ? ta.value.trim()+" " : "";
  recog = new SR();
  callLang = (lang === "en") ? "en" : "es";
  recog.lang = callLang === "en" ? "en-US" : "es-US";
  recog.continuous = true; recog.interimResults = true;
  // Auto-idioma: si las primeras frases vienen con confianza baja, el idioma elegido está mal -> cambia solo.
  let confSum = 0, confN = 0, autoCambio = false;
  recog.onresult = (e)=>{
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal){
        transcripcion += r[0].transcript.trim()+"\n"; // cada frase en su línea (ayuda a separar turnos)
        const c = r[0].confidence;
        if(typeof c === "number" && c > 0){ confSum += c; confN++; }
        if(!autoCambio && confN >= 2 && (confSum/confN) < 0.55){
          autoCambio = true;
          callLang = (callLang === "es") ? "en" : "es";
          confSum = 0; confN = 0;
          note("🎙 Detecté que la llamada es en "+(callLang==="en"?"inglés":"español")+" — cambié el micrófono solo.");
          try{ recog.stop(); }catch(_e){} // onend relanza con el idioma nuevo
        }
      }
      else interim += r[0].transcript;
    }
    const t = document.getElementById("callnote");
    if(t){ t.value = transcripcion + interim; t.scrollTop = t.scrollHeight; }
  };
  recog.onerror = (e)=>{ if(e.error !== "no-speech" && e.error !== "aborted") note("Transcripción: "+e.error); };
  recog.onend = ()=>{ if(transcribiendo && recog){ recog.lang = callLang === "en" ? "en-US" : "es-US"; try{ recog.start(); }catch(_e){} } }; // el navegador corta solo; relanzar (con el idioma vigente)
  try{ recog.start(); }catch(_e){}
  transcribiendo = true;
  return true;
}
function stopTranscripcion(){
  transcribiendo = false;
  if(recog){ try{ recog.stop(); }catch(_e){} recog = null; }
  clearInterval(transTimer); transTimer = null;
  if(transStart){ transDur = Math.round((Date.now()-transStart)/1000); transStart = 0; } // guarda la duración para el registro
}
let transTimer = null, transStart = 0, transDur = 0;
const fmtDur = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function startRelojTrans(){
  transStart = Date.now(); transDur = 0;
  clearInterval(transTimer);
  transTimer = setInterval(()=>{
    const el = document.getElementById("translive");
    if(!el) return;
    const s = Math.floor((Date.now()-transStart)/1000);
    const ta = document.getElementById("callnote");
    const chars = ta ? ta.value.trim().length : 0;
    el.textContent = "● CAPTURANDO "+fmtDur(s)+(chars>250?" · listo para analizar":"");
  }, 1000);
}
const CAD_DIAS = [0,1,3,5,7,10,14];
const CAD_TIPO = ["mail","llamada","mail","llamada","mail","llamada","mail"];
const CALL_RES = {atendio_interesado:"Atendió interesado",atendio_frio:"Atendió frío",no_atendio:"No atendió",mensaje:"Dejé mensaje",agendo:"Agendó reunión"};
const CIERRE_MOTIVOS = ["precio","timing","eligió a otro","no era el momento","desapareció","otro"];
// avanza la cadencia: completó el paso actual -> devuelve el patch para el próximo toque
function avanzarCadencia(paso){
  const next = (Number(paso)||0)+1;
  if(next>=CAD_DIAS.length) return { cadencia_paso:next, next_action_at:null, next_action_tipo:null, seguimiento_activo:false };
  const gap = CAD_DIAS[next]-CAD_DIAS[next-1];
  const d=new Date(); d.setDate(d.getDate()+gap);
  return { cadencia_paso:next, next_action_at:d.toISOString(), next_action_tipo:CAD_TIPO[next], seguimiento_activo:true };
}
const touchesOf = id => touches.filter(t=>t.leadId===id);

const P_STATES = ["borrador","enviada","aprobada","rechazada"];
const I_STATES = ["pendiente","pagada","vencida"];
/* Embudo de leads — 6 estados */
const L_STATES = ["nuevo","enviado","respondio","sin_respuesta","ganado","perdido"];
const PR_STATES = ["encontrado","contactable","enviado","respondio","descartado"];

const L_LABELS = {nuevo:"Nuevos",enviado:"Enviados",respondio:"Respondieron",sin_respuesta:"Sin respuesta",ganado:"Ganado",perdido:"Perdido"};

const today = () => new Date().toISOString().slice(0,10);
const ICON_TRASH = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;pointer-events:none"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/></svg>';
const ICON_PHONE = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1.5px;pointer-events:none"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
function autoGrow(ta){ if(!ta) return; ta.style.height='auto'; const max = ta.classList.contains('full') ? Math.round((window.innerHeight||800)*0.62) : 170; ta.style.height=Math.min(ta.scrollHeight+2,max)+'px'; }

/* Detección de idioma (ES/EN) — heurística, gratis e instantánea. Facu puede corregir tocando el chip. */
function detectLang(txt){
  const t=" "+String(txt||"").toLowerCase()+" ";
  if(!t.trim()) return "es";
  let es=0, en=0;
  if(/[ñáéíóúü¿¡]/.test(t)) es+=3;
  const ES=[" que "," los "," las "," una "," para "," con "," por "," pero "," como "," tengo "," quiero "," hola "," gracias "," cuánto "," cuanto "," precio "," necesito "," hacer "," están "," estan "," muy "," más "," mas "," también "," tambien "," cómo "," buenas "," saludos "];
  const EN=[" the "," you "," your "," and "," for "," with "," have "," want "," hello "," hi "," thanks "," thank "," how "," much "," price "," need "," would "," could "," please "," we "," our "," about "," looking "," interested "];
  for(const w of ES) if(t.includes(w)) es++;
  for(const w of EN) if(t.includes(w)) en++;
  if(es===en) return "es"; // empate -> español (Facu es el default)
  return es>en ? "es" : "en";
}
// Idioma efectivo de un lead: lo guardado, o la detección sobre su mensaje.
const langOf = l => l.idioma || detectLang(l.message||"");
// Chip visual ES/EN (clickable para corregir). who: 'vos' (ES) / 'closer' (EN)
function langChip(l){
  const lg=langOf(l);
  const who = lg==="es" ? "llamás vos" : "closer EN";
  return `<button class="langchip ${lg}" data-togglelang="${l.id}" title="Idioma del lead — ${lg==='es'?'español':'inglés'}. Tocá para cambiar.">${lg.toUpperCase()} · ${who}</button>`;
}

function nextNumber(list, prefix){
  let max = 0;
  for(const d of list){
    const m = String(d.number||"").match(new RegExp("^"+prefix+"-(\\d{4})-(\\d+)$"));
    if(m && Number(m[1])===YEAR) max = Math.max(max, Number(m[2]));
  }
  return prefix+"-"+YEAR+"-"+String(max+1).padStart(3,"0");
}
const clientName = id => (clients.find(c=>c.id===id)||{}).name || "";

/* ---------- mapeos DB (snake_case) <-> UI (camelCase) ---------- */
const FROM = {
  proposals: r=>({id:r.id,number:r.number,clientId:r.client_id,clientFree:r.client_free,title:r.title,amount:r.amount,status:r.status,date:r.date,notes:r.notes,fileUrl:r.file_url,fileName:r.file_name,createdAt:r.created_at}),
  invoices:  r=>({id:r.id,number:r.number,clientId:r.client_id,amount:r.amount,status:r.status,issued:r.issued,due:r.due,notes:r.notes,stripeLink:r.stripe_link||null,createdAt:r.created_at}),
  clients:   r=>({id:r.id,name:r.name,company:r.company,contact:r.contact,email:r.email,phone:r.phone,notes:r.notes,createdAt:r.created_at}),
  leads:     r=>({id:r.id,name:r.name,email:r.email,phone:r.phone,service:r.service,message:r.message,status:r.status,createdAt:r.created_at,
                  borrador:r.borrador, mailsEnviados:Number(r.mails_enviados)||0, respuestas:Number(r.respuestas_lead)||0,
                  ultimoEnvio:r.fecha_ultimo_envio, primerEnvio:r.fecha_primer_envio, ultimaRespuesta:r.ultima_respuesta_texto,
                  cadenciaPaso:Number(r.cadencia_paso)||0, nextAt:r.next_action_at, nextTipo:r.next_action_tipo,
                  segActivo:r.seguimiento_activo!==false, cierreMotivo:r.cierre_motivo, cierreFalto:r.cierre_falto, cierreObs:r.cierre_obs,
                  idioma:r.idioma||null,
                  cierrePct:(r.cierre_pct==null?null:Number(r.cierre_pct)), cierreFreno:r.cierre_freno||null,
                  cierreFalta:r.cierre_falta||null, cierreSug:r.cierre_sug||null}),
  touches:   r=>({id:r.id,leadId:r.lead_id,tipo:r.tipo,resultado:r.resultado,texto:r.texto,createdAt:r.created_at}),
  prospectos:r=>({id:r.id,empresa:r.empresa,contacto:r.contacto,email:r.email,emailDirecto:r.email_directo||null,phone:r.phone,phoneDirecto:r.phone_directo||null,web:r.web,instagram:r.instagram,
                  nicho:r.nicho,ciudad:r.ciudad,fuente:r.fuente,notas:r.notas,status:r.status||"encontrado",

};

  prospectos:d=>({empresa:d.empresa,contacto:d.contacto||null,email:d.email||null,email_directo:d.emailDirecto||null,phone:d.phone||null,phone_directo:d.phoneDirecto||null,web:d.web||null,

};

/* ---------- carga de datos ---------- */
async function loadAll(){
  if(!sb) return;
  const pr = await sb.from("proposals").select("*").order("created_at",{ascending:false});
  proposals = (pr.data||[]).map(FROM.proposals);
  if(isAdmin){
    const [inv, cl, ld, st, tc, pz] = await Promise.all([
      sb.from("invoices").select("*").order("created_at",{ascending:false}),
      sb.from("clients").select("*").order("created_at",{ascending:false}),
      sb.from("leads").select("*").order("created_at",{ascending:false}),
      sb.from("settings").select("*").eq("key","goal").maybeSingle(),
      sb.from("touches").select("*").order("created_at",{ascending:false}),
      sb.from("prospectos").select("*").order("created_at",{ascending:false}),
    ]);
    invoices = (inv.data||[]).map(FROM.invoices);
    clients  = (cl.data||[]).map(FROM.clients);
    leads    = (ld.data||[]).map(FROM.leads);
    goal = st.data ? Number(st.data.monthly_goal)||0 : 0;
    touches = (tc && !tc.error && tc.data) ? tc.data.map(FROM.touches) : [];
    prospectos = (pz && !pz.error && pz.data) ? pz.data.map(FROM.prospectos) : [];
  }
  renderApp();
}

/* ---------- llamar a las Edge Functions (agente) ---------- */
async function callFn(name, body){
  const { data:{ session } } = await sb.auth.getSession();
  const token = session ? session.access_token : cfg.SUPABASE_ANON_KEY;
  const res = await fetch(cfg.SUPABASE_URL + "/functions/v1/" + name, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token, "apikey":cfg.SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let txt=""; try{ txt=await res.text(); }catch(e){}
    if(res.status===404) throw new Error("El agente todavía no está desplegado (faltan tus keys). El texto quedó en el borrador.");
    throw new Error("Error "+res.status+(txt?": "+txt.slice(0,160):""));
  }
  return res.json();
}

// Genera (o regenera) el borrador del lead. auto=true cuando se abre el lead sin borrador.
async function runDraft(id, isRehacer){
  const l = leads.find(x=>x.id===id); if(!l) return;
  const ta = document.getElementById("lreply"); if(!ta) return;
  const btn = document.querySelector('[data-rehacer="'+id+'"]');
  const prevLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled=true; btn.textContent="Pensando…"; }
  if(!isRehacer){ ta.placeholder = "El agente está redactando la respuesta…"; }
  const msg = (l.ultimaRespuesta && String(l.ultimaRespuesta).trim()) ? l.ultimaRespuesta : (l.message||"");
  try{
    const out = await callFn("sugerir", { lead_id:id, message:msg, name:l.name||"", email:l.email||"", service:l.service||"", previous: (isRehacer && ta.dataset.orig) ? ta.dataset.orig : "" });
    if(out && out.reply){
      ta.value = out.reply; ta.dataset.orig = out.reply; autoGrow(ta);
      try{ await sb.from("leads").update({ borrador: out.reply }).eq("id", id); }catch(e){}
      if(isRehacer) note("Nueva sugerencia lista.");
    } else if(isRehacer){ note("El agente no devolvió texto."); }
  }catch(err){ note(isRehacer ? err.message : ("No pude redactar: "+err.message)); }
  if(btn){ btn.disabled=false; btn.textContent=prevLabel||"↻ Rehacer"; }
}

function tabsHtml(){
  const t = isAdmin ? [["hoy","PARA HOY"],["resumen","RESUMEN"],["analisis","ANÁLISIS"],["llamadas","LLAMADAS"],["propuestas","PROPUESTAS"],["facturas","FACTURAS"],["clientes","CLIENTES"],["leads","LEADS"],["prospeccion","CAPTACIÓN CLIENTES"]]
                    : [["resumen","RESUMEN"],["propuestas","PROPUESTAS"]];
  const nuevos = leads.filter(x=>x.status==='nuevo').length;

  return `<nav id="tabs">${t.map(([k,l])=>{
    let b=''; if(k==='leads'&&nuevos) b=`<span class="nbadge">${nuevos}</span>`; if(k==='hoy'&&hoyN) b=`<span class="nbadge">${hoyN}</span>`;
    return `<button data-t="${k}" class="${tab===k?'on':''}">${l}${b}</button>`;
  }).join("")}</nav>`;
}

/* ---------- LLAMADAS (registro global: fecha, hora, lead, vendedor, resultado, duración) ---------- */
function renderLlamadas(){
  const calls = touches.filter(x=>x.tipo==="llamada");
  const leadDe = id => leads.find(l=>l.id===id);
  const durDe = t => { const m=String(t||"").match(/⏱ Duración:\s*(\d+:\d{2})/); return m?m[1]:"—"; };
  const vendDe = t => { const m=String(t||"").match(/^\s*([A-ZÁÉÍÓÚÑÜ][A-Za-zÁÉÍÓÚÑÜáéíóúñü .'-]{1,28})\s*\(LORENZO\)\s*:/m); return m?m[1].trim():"—"; };
  const hoy0=new Date(); hoy0.setHours(0,0,0,0);
  const d7=new Date(hoy0); d7.setDate(d7.getDate()-6);
  const nHoy=calls.filter(c=>new Date(c.createdAt)>=hoy0).length;
  const n7=calls.filter(c=>new Date(c.createdAt)>=d7).length;
  const tile=(lbl,val)=>`<div style="flex:1;min-width:120px;border:1px solid var(--hair2);border-radius:16px;padding:14px 16px">
    <div style="font-family:var(--disp);font-size:14.5px;font-weight:800;color:#fff">${lbl}</div>
    <div style="font-size:26px;margin-top:4px">${val}</div></div>`;
  const body = calls.length ? `<div class="tablewrap"><table>
    <tr><th>Fecha</th><th>Lead</th><th>Vendedor</th><th>Resultado</th><th>Duración</th><th class="r"></th></tr>
    ${calls.map(c=>{ const l=leadDe(c.leadId); const d=new Date(c.createdAt);
      const f=d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" · "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
      return `<tr>
        <td style="font-family:var(--mono);font-size:11px;white-space:nowrap">${esc(f)}</td>
        <td>${l?`<button class="linkbtn" data-openlead="${l.id}">${esc(l.name||l.email||"—")}</button>`:"—"}</td>
        <td style="font-size:12px">${esc(vendDe(c.texto))}</td>
        <td style="font-size:12px">${esc(CALL_RES[c.resultado]||c.resultado||"—")}</td>
        <td style="font-family:var(--mono);font-size:11px">${esc(durDe(c.texto))}</td>
        <td>${l?`<button class="btn sm ghost" data-openlead="${l.id}">Abrir</button>`:""}</td>
      </tr>`; }).join("")}
    </table></div>`
    : `<div class="empty"><b>Sin llamadas registradas todavía.</b><br>Cada llamada que registres (con su transcripción y análisis) aparece acá.</div>`;
  $app().innerHTML = `<div class="bar"><h2><span class="tick"></span>Llamadas</h2></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">
      ${tile("Hoy",nHoy)}${tile("Últimos 7 días",n7)}${tile("Total",calls.length)}
    </div>
    ${body}`;
}

const $app = () => document.getElementById("app");

function renderResumen(){
  const sum = a=>a.reduce((s,x)=>s+(Number(x.amount)||0),0);

  const paid = invoices.filter(i=>i.status==="pagada");
  const mkey = new Date().toISOString().slice(0,7);
  const cobradoMes = sum(paid.filter(i=>String(i.issued||"").slice(0,7)===mkey));

  const hechas=touches.filter(x=>new Date(x.createdAt)>=hoy0 && (x.tipo==="mail"||x.tipo==="llamada"||/^✓/.test(String(x.texto||""))));

    <text x="43" y="48" text-anchor="middle" fill="var(--fg)" font-size="15" font-weight="800">${goal?pct.toFixed(0)+"%":"—"}</text>
  </svg>`;

  // (la efectividad se calcula más abajo sobre la lista del día)

  $app().innerHTML = `

    <div class="hnums">
      <div><b>${leads.length}</b><span>Leads</span></div>
      <div><b>${clients.length}</b><span>Clientes</span></div>

      ${dia.length?`<div style="margin-top:6px">${pasos}</div>`:""}
      ${dia.length?`<div style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="bt">Efectividad del día</span>
          <span class="bn" style="font-size:14px;font-weight:700">${eff}%</span>
        </div>
        <div class="pbar" style="margin-top:8px"><span style="width:${eff}%;background:${eff>=70?'var(--ok)':'var(--accent)'}"></span></div>
        <div class="bs" style="margin-top:6px">${nH} completada(s) · ${dia.length-nH} pendiente(s)</div>
      </div>`:""}
      ${items.length?`<button class="linkbtn" style="margin-top:14px" data-gotab="hoy">${items.length>6?`Ver los ${items.length} →`:"Abrir la lista completa →"}</button>`:""}
    </div>
    <div class="bcard sp4">
      <div class="bhead"><span class="bt">Objetivo del mes</span><button class="iconbtn" data-goaledit="1" title="Cambiar el objetivo">✎</button></div>
      <div style="display:flex;gap:18px;align-items:center">
        ${anillo}
        <div style="min-width:0">
          <div class="big" style="margin:0">${money(cobradoMes)}</div>
          <div class="bs" style="margin-top:4px">cobrado este mes${goal?" · de "+money(goal):""}</div>
        </div>

/* ---------- ANÁLISIS (cerebro) ---------- */
function renderAnalisis(){
  const total = leads.length;
  if(!total){ $app().innerHTML = `<div class="empty"><b>Todavía no hay datos para analizar.</b><br>Cuando empieces a mover leads (enviar, responder, ganar, perder), acá vas a ver <b>dónde se te caen los deals y por qué</b>, con recomendaciones basadas en estudios de ventas.</div>`; return; }

  const inState = (...s)=>leads.filter(l=>s.includes(l.status));
  const gan = inState("ganado").length, perd = inState("perdido").length;
  const contactados = leads.filter(l=>Number(l.mailsEnviados)>0 || ["enviado","sin_respuesta","respondio","ganado","perdido"].includes(l.status)).length;
  const respondieron = leads.filter(l=>Number(l.respuestas)>0 || l.status==="respondio").length;
  const sinContactar = total - contactados;
  const cerrados = gan+perd;

  // ---- Embudo ----
  const paso = (label,n,base)=>{ const pct = base? Math.round(n/base*100):0; return {label,n,pct}; };
  const F = [
    paso("Leads totales", total, total),
    paso("Contactados", contactados, total),
    paso("Respondieron", respondieron, contactados||1),
    paso("Ganados", gan, respondieron||1),
  ];
  const funnelHtml = F.map((p,i)=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span>${p.label}</span><span style="font-family:var(--mono);color:var(--muted)">${p.n}${i>0?` · ${p.pct}%`:""}</span>
      </div>
      <div style="height:9px;background:var(--hair2);border-radius:99px;overflow:hidden">
        <div style="height:100%;width:${i===0?100:Math.max(3,p.pct)}%;background:var(--accent);opacity:${1-i*0.18}"></div>
      </div>
    </div>`).join("");

  // ---- Motivos de pérdida ----
  const perdidos = inState("perdido");
  const motivos = {};
  perdidos.forEach(l=>{ const m=(l.cierreMotivo&&l.cierreMotivo!=="ganado")?l.cierreMotivo:"(sin motivo)"; motivos[m]=(motivos[m]||0)+1; });
  const motivosArr = Object.entries(motivos).sort((a,b)=>b[1]-a[1]);
  const topMotivo = motivosArr[0];
  const motivosHtml = motivosArr.length
    ? motivosArr.map(([m,n])=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--hair2)"><span>${esc(m)}</span><span style="font-family:var(--mono);color:var(--accent)">${n}</span></div>`).join("")
    : `<div style="color:var(--muted);font-size:13px">Todavía no marcaste ningún lead como Perdido con motivo.</div>`;

  // ---- Win rate por servicio ----
  const porServ = {};
  leads.forEach(l=>{ if(l.status==="ganado"||l.status==="perdido"){ const k=l.service||"(sin rubro)"; porServ[k]=porServ[k]||{g:0,p:0}; if(l.status==="ganado")porServ[k].g++; else porServ[k].p++; } });
  const servArr = Object.entries(porServ).sort((a,b)=>(b[1].g+b[1].p)-(a[1].g+a[1].p));
  const servHtml = servArr.length
    ? servArr.map(([k,v])=>{ const tot=v.g+v.p; const wr=tot?Math.round(v.g/tot*100):0; return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--hair2)"><span>${esc(k)}</span><span style="font-family:var(--mono);color:var(--muted)">${v.g}/${tot} · <span style="color:${wr>=50?'var(--ok)':'var(--accent)'}">${wr}%</span></span></div>`; }).join("")
    : `<div style="color:var(--muted);font-size:13px">Cuando cierres deals (ganados/perdidos) por rubro, vas a ver acá qué nicho convierte mejor.</div>`;

  // ---- Velocidad de respuesta (de lead creado a primer mail) ----
  let horas=[];
  leads.forEach(l=>{ const t=touchesOf(l.id).filter(x=>x.tipo==="mail"); if(t.length){ const first=t.reduce((a,b)=>new Date(a.createdAt)<new Date(b.createdAt)?a:b); const h=(new Date(first.createdAt)-new Date(l.createdAt))/3600000; if(h>=0&&h<24*14) horas.push(h); } });
  const velProm = horas.length? (horas.reduce((a,b)=>a+b,0)/horas.length) : null;
  const velTxt = velProm===null? "sin datos aún" : (velProm<1? "menos de 1 h" : velProm<24? velProm.toFixed(1)+" h" : (velProm/24).toFixed(1)+" días");

  // ---- Diagnóstico (prioriza el agujero más grande) ----
  let diag;
  if(sinContactar >= Math.max(3, total*0.3)){
    diag = `Tenés <b>${sinContactar} leads sin contactar</b>. Según Harvard Business Review, contactar en la <b>primera hora</b> multiplica por 7 las chances de calificar al lead (vs. esperar 24 h). Prioridad #1: vaciar <b>PARA HOY</b> rápido.`;
  } else if(velProm!==null && velProm>1){
    diag = `Estás respondiendo en promedio en <b>${velTxt}</b>. Los estudios muestran que bajar a <b>menos de 5 minutos</b> puede multiplicar por 100 el contacto. Si podés, respondé los nuevos apenas entran.`;
  } else if(contactados && respondieron/contactados < 0.25){
    diag = `De los que contactaste, <b>responden pocos (${Math.round(respondieron/contactados*100)}%)</b>. El cuello está en el <b>primer mensaje</b>: probá otro asunto y un primer renglón más directo. Usá "Rehacer" para variar el enfoque.`;
  } else if(topMotivo){
    diag = `Donde más perdés es por <b>${esc(topMotivo[0])}</b> (${topMotivo[1]} caso/s). ${topMotivo[0]==="precio"?"Mostrá valor antes del número y proponé una llamada para cotizar en contexto.":topMotivo[0]==="timing"||topMotivo[0]==="no era el momento"?"No los pierdas: armá un seguimiento a 30-60 días para cuando sea el momento.":topMotivo[0]==="desapareció"?"Sumá un toque extra en la cadencia antes de darlos por perdidos.":"Revisá qué faltó en esos cierres (campo 'Qué faltó')."}`;
  } else if(cerrados){
    diag = `Vas <b>${gan} ganados / ${perd} perdidos</b>. Buen ritmo — seguí cargando el motivo de cada cierre para que el análisis sea más preciso.`;
  } else {
    diag = `Todavía no cerraste deals. Cuando marques Ganado/Perdido con su motivo, acá te voy a decir <b>dónde ajustar</b>.`;
  }

  $app().innerHTML = `
    <div class="panel" style="border-left:3px solid var(--accent)">
      <div class="bar"><h2><span class="tick"></span>Diagnóstico</h2></div>
      <div style="font-size:14px;line-height:1.6;color:#E6E7EB">${diag}</div>
    </div>
    <div class="grid" style="margin-top:4px">
      <div class="stat"><span class="l">Velocidad de respuesta</span><div class="v">${velTxt}</div><div class="s">de lead nuevo a primer mail</div></div>
      <div class="stat"><span class="l">Tasa de cierre</span><div class="v">${cerrados?Math.round(gan/cerrados*100):0}%</div><div class="s">${gan} ganados de ${cerrados} cerrados</div></div>
      <div class="stat"><span class="l">Sin contactar</span><div class="v">${sinContactar}</div><div class="s">esperando primer toque</div></div>
    </div>
    <div class="panel">
      <div class="bar"><h2><span class="tick"></span>Embudo</h2></div>
      ${funnelHtml}
    </div>
    <div class="grid2">
      <div class="panel"><div class="bar"><h2><span class="tick"></span>Por qué se pierden</h2></div>${motivosHtml}</div>
      <div class="panel"><div class="bar"><h2><span class="tick"></span>Cierre por rubro</h2></div>${servHtml}</div>
    </div>`;
}

function renderInvoices(){
  const d = editing && editing.col==="invoices" ? invoices.find(p=>p.id===editing.id) : null;
  const sum=a=>a.reduce((s,x)=>s+(Number(x.amount)||0),0);
  const hoyD=new Date(); hoyD.setHours(0,0,0,0);
  const esVencida=i=>i.status!=="pagada" && i.due && new Date(i.due+"T23:59:59")<hoyD;
  const pagadas=invoices.filter(i=>i.status==="pagada");
  const impagas=invoices.filter(i=>i.status!=="pagada");
  const vencidas=impagas.filter(esVencida);
  // Aging: impagas vencidas por antigüedad (días desde el vencimiento)
  const buckets=[["0–30",0],["31–60",0],["61–90",0],["90+",0]];
  for(const i of vencidas){
    const dias=Math.floor((hoyD-new Date(i.due))/(24*3600*1000));
    const k=dias<=30?0:dias<=60?1:dias<=90?2:3;
    buckets[k][1]+=Number(i.amount)||0;
  }
  const mxb=Math.max(1,...buckets.map(b=>b[1]));
  const agingHtml = vencidas.length?`<div class="bcard" style="grid-column:span 12;margin-bottom:0">
    <div class="bhead"><span class="bt">Vencidas por antigüedad</span><span class="bn" style="color:var(--bad)">${vencidas.length} vencida(s) · ${money(sum(vencidas))}</span></div>
    ${buckets.map(([lbl,v])=>`<div class="mrow"><span class="mk">${lbl} días</span><span class="mbar"><span style="width:${Math.round(v/mxb*100)}%;background:var(--bad)"></span></span><span class="mv" style="min-width:70px">${money(v)}</span></div>`).join("")}
  </div>`:"";
  const F={todas:"Todas",pendientes:"Pendientes",vencidas:"Vencidas",pagadas:"Pagadas"};
  const lista=invoices.filter(i=>
    invFilter==="pagadas"?i.status==="pagada":
    invFilter==="vencidas"?esVencida(i):
    invFilter==="pendientes"?i.status!=="pagada":true);
  $app().innerHTML = `
  <div class="bar"><h2><span class="tick"></span>Facturas</h2>
    ${canWrite?`<button class="btn" data-new="invoices">+ Nueva factura</button>`:''}</div>
  ${(formOpen==="invoices")? invoiceForm(d) : ""}
  <div class="grid" style="margin-bottom:16px">
    <div class="stat"><span class="l">Cobrado</span><div class="v">${money(sum(pagadas))}</div><div class="s">${pagadas.length} pagada(s)</div></div>
    <div class="stat"><span class="l">Pendiente</span><div class="v">${money(sum(impagas))}</div><div class="s">${impagas.length} por cobrar</div></div>
    <div class="stat"><span class="l" style="color:${vencidas.length?'var(--bad)':'var(--muted)'}">Vencido</span><div class="v" style="${vencidas.length?'color:var(--bad)':''}">${money(sum(vencidas))}</div><div class="s">${vencidas.length?vencidas.length+" vencida(s) — a perseguir":"nada vencido ✦"}</div></div>
  </div>
  ${agingHtml?agingHtml+'<div style="height:16px"></div>':""}
  <div class="fchips">${Object.entries(F).map(([k,v])=>`<button class="fchip ${invFilter===k?'on':''} ${k==='vencidas'&&vencidas.length?'hot':''}" data-invfilter="${k}">${v}<b>${k==="todas"?invoices.length:k==="pagadas"?pagadas.length:k==="vencidas"?vencidas.length:impagas.length}</b></button>`).join("")}</div>
  ${lista.length? `<div class="tablewrap"><table>
    <tr><th>Nº</th><th>Cliente</th><th class="r">Monto</th><th>Estado</th><th>Emitida</th><th>Vence</th><th class="r"></th></tr>
    ${lista.map(i=>{
      const del = confirmDel && confirmDel.col==="invoices" && confirmDel.id===i.id;
      const venc = esVencida(i);
      return `<tr class="${del?'confirmrow':''}">
      <td style="font-family:var(--mono);font-size:12px">${esc(i.number)}</td>
      <td>${esc(clientName(i.clientId)||"—")}</td>
      <td class="money">${money(i.amount)}</td>
      <td>${statusPill("invoices",i)}</td>
      <td style="font-family:var(--mono);font-size:11.5px;color:var(--muted)">${esc(i.issued||"")}</td>
      <td style="font-family:var(--mono);font-size:11.5px;color:${venc?'var(--bad)':'var(--muted)'}">${esc(i.due||"")}${venc?" ⚠":""}</td>
      <td><div class="rowactions">${i.status!=="pagada"?`<button class="btn sm ghost" data-invpaid="${i.id}" style="color:var(--ok);border-color:rgba(76,195,138,.4)">✓ Pagada</button>`:""}<button class="btn sm ghost" data-invpdf="${i.id}" title="Ver la factura con el diseño de LORENZO y guardarla en PDF">🧾 Factura</button><button class="btn sm ghost" data-edit="invoices:${i.id}">Editar</button><button class="btn sm ghost btn-del" data-del="invoices:${i.id}" title="Borrar">${ICON_TRASH}</button></div></td>
    </tr>`}).join("")}
    </table></div>` :
    `<div class="empty"><b>${invoices.length?"Nada en este filtro.":"Sin facturas todavía."}</b></div>`}`;
}

      <td style="font-size:12px">${esc(p.nicho||"—")}</td>
      <td style="font-size:12px;color:var(--muted)">${esc(p.fuente||"—")}</td>
      <td><select class="lsel" data-prstatus="${p.id}">${PR_STATES.map(st=>`<option value="${st}" ${p.status===st?"selected":""}>${esc(PR_LABELS[st])}</option>`).join("")}</select></td>
      <td class="r" style="white-space:nowrap">${url?`<a class="linkbtn" href="${esc(url)}" target="_blank" rel="noopener">↗ web</a> `:""}${p.leadId?`<button class="linkbtn" data-openlead="${p.leadId}">En Leads →</button>`:`<button class="btn sm ghost" data-prosplead="${p.id}" title="Crea el lead y lo sigue el Agente 1">→ Lead</button>`}
        <button class="btn sm ghost" data-edit="prospectos:${p.id}">Editar</button>
        <button class="btn sm ghost btn-del" data-del="prospectos:${p.id}" title="Borrar">${ICON_TRASH}</button></td>

  $app().innerHTML = `
  <div class="bar"><h2><span class="tick"></span>Captación de clientes — salir a buscarlos</h2>
    ${canWrite?`<div style="display:flex;gap:12px;align-items:center"><button class="linkbtn" data-new="prospectos" style="color:var(--faint)">+ cargar a mano</button><button class="btn" data-new="prospimport">📋 Importar lista</button></div>`:""}</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">${tile("Encontrados",prospectos.length)}${tile("Con email",conEmail)}${tile("Enviados",env)}${tile("Respondieron",resp)}${(function(){

    return `<div style="flex:1;min-width:120px;border:1px solid var(--hair2);border-radius:16px;padding:14px 16px">
      <div style="font-family:var(--disp);font-size:14.5px;font-weight:800;color:#fff">% respuesta</div>
      <div style="font-size:26px;margin-top:4px;color:${col}">${pr==null?"—":pr+"%"}</div>
      <div class="bs" style="margin-top:2px">bueno: 5-10%</div></div>`; })()}</div>
  ${(formOpen==="prospectos")? prospForm(d) : ""}
  ${(formOpen==="prospimport")? prospImportForm() : ""}
  ${prospectos.length? tablas :
    `<div class="empty"><b>Todavía no hay búsquedas de clientes.</b><br>Acá van los negocios del nicho que salimos a buscar (venues, restaurantes, gimnasios, lo que sea). Cargá uno a mano o importá una lista — cuando uno responde, pasa a Leads y lo sigue el Agente 1.</div>`}`;

/* ---------- barra de interés ---------- */
function interestBar(r){
  r = Number(r)||0;
  const pct = Math.min(4,r)*25;
  const cls = r>=3 ? "orange" : (r>=1 ? "amber" : "");
  return `<span class="imini"><span class="ibar"><span class="ifill ${cls}" style="width:${pct}%"></span></span><span class="n">${r}</span></span>`;
}

    ${l.cierreFreno?`<div class="cbar-row"><span class="k">Freno</span><span class="v">${esc(l.cierreFreno)}</span></div>`:""}
    ${l.cierreFalta?`<div class="cbar-row"><span class="k">Falta</span><span class="v">${esc(l.cierreFalta)}</span></div>`:""}`;
  if(sug&&sug.pct!=null&&Number(sug.pct)!==pct){
    h+=`<div class="cbar-sug">🤖 El agente lo ve en <b>${Number(sug.pct)}% — ${esc(sug.etapa||etiq(sug.pct))}</b>
      ${sug.freno?`<br>Freno: ${esc(sug.freno)}`:""}${sug.falta?`<br>Falta: ${esc(sug.falta)}`:""}

      </div>`:""}
    </div>`;
  } else {
    h+=`<div class="cbar-sug-a" style="margin-top:9px"><button class="btn ghost sm" data-avajuste="1">✎ Ajustar a mano</button></div>
      ${cierreAjuste?`<div class="cbar-set">

/* ---------- PARA HOY (cola de acción del día) ---------- */
function accionHoy(l){
  if(l.status==='nuevo')    return { label:'Responder', tipo:'mail',    hot:false };
  if(l.status==='respondio')return { label:'Responder', tipo:'mail',    hot:true  }; // caliente: te respondió — mismo verbo, distinto color
  if((l.status==='enviado'||l.status==='sin_respuesta') && l.segActivo && l.nextAt){
    const fin=new Date(); fin.setHours(23,59,59,999);
    if(new Date(l.nextAt)<=fin) return { label:(l.nextTipo==='llamada'?'Llamar':'Seguimiento'), tipo:(l.nextTipo||'mail'), hot:false };
  }
  return null;
}
function leadsHoy(){
  return leads.map(l=>({l,a:accionHoy(l)})).filter(x=>x.a)

    </div>

    <div class="ftabc" data-ftabc="analisis" style="display:${fichaTab==="analisis"?"block":"none"}">
      ${analisis.length?`<div class="tline" style="margin-top:0;border-top:none;padding-top:0">${analisis.map(x=>`<div class="tl"><div class="tl-dot"></div><div class="tl-b">
        <span class="w">${esc(fmtT(x))}</span>
        ${x.texto?`<div style="margin-top:3px;color:var(--muted);white-space:pre-wrap">${esc(String(x.texto).slice(0,250))}${String(x.texto).length>250?"…":""}</div>
        ${String(x.texto).length>250?`<div style="margin-top:8px"><button class="btn ghost sm" data-verllamada="${x.id}">⛶ Ver completo</button></div>`:""}`:""}
      </div></div>`).join("")}</div>`:`<div class="fempty">Todavía no hay análisis del agente. Se generan solos al guardar una llamada transcripta.</div>`}
    </div>

    <div class="ftabc" data-ftabc="hist" style="display:${fichaTab==="hist"?"block":"none"}">
      ${resto.length?`<div class="tline" style="margin-top:0;border-top:none;padding-top:0">${resto.map(x=>item(x," · "+esc(LT[x.tipo]||x.tipo))).join("")}</div>`:`<div class="fempty">Sin movimientos todavía.</div>`}
    </div>
  </div></div>`;
}

/* ---------- eventos ---------- */
function note(msg){
  const n=document.createElement("div");
  n.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d1e23;border:1px solid var(--hair);padding:10px 16px;border-radius:8px;font-size:13px;z-index:999;max-width:90vw;text-align:center";
  n.textContent=msg; document.body.appendChild(n); setTimeout(()=>n.remove(),5000);
}

document.addEventListener("click", async e=>{
  const t = e.target;
  if(!sb) return;
  const fr = t.closest && t.closest("[data-franja]");
  if(fr){ const s=fr.dataset.franja; leadCollapsed[s]=!leadCollapsed[s]; renderApp(); return; }
  if(t.dataset.leadfilter){ leadFilter=t.dataset.leadfilter; renderApp(); return; }
  if(t.dataset.togglelang){
    const id=t.dataset.togglelang; const l=leads.find(x=>x.id===id); if(!l) return;
    const next = langOf(l)==="es" ? "en" : "es";
    l.idioma=next; // optimista
    try{ await sb.from("leads").update({idioma:next}).eq("id",id); }catch(e){}
    renderApp(); return;
  }
  if(t.dataset.rehacer){ await runDraft(t.dataset.rehacer, true); return; }
  if(t.dataset.traducir){
    const ta=document.getElementById("lreply"); if(!ta) return;
    const hint=document.getElementById("tradhint");
    if(tradActivo){ // Ver original: paso lo que haya (editado o no) al idioma original
      t.disabled=true; t.innerHTML="…";
      try{
        let orig;
        if((ta.value||"").trim()===tradShown.trim()){ orig=tradOriginal; } // no editó -> original exacto
        else { const o=await callFn("sugerir",{translate:true,to:"match",reference:tradOriginal,message:ta.value}); orig=(o&&o.reply)||tradOriginal; }
        ta.value=orig; tradOriginal=orig; ta.readOnly=false; autoGrow(ta);
      }catch(err){ note("No pude volver al original: "+err.message); }
      tradActivo=false; tradShown="";
      if(hint) hint.style.display="none";
      t.disabled=false; t.innerHTML="⇄ Traducir"; t.title="Traducir al español (podés editar)"; return;
    }
    if(!(ta.value||"").trim()){ note("No hay texto para traducir."); return; }
    t.disabled=true; t.innerHTML="Traduciendo…";
    try{
      const out=await callFn("sugerir", { translate:true, message:ta.value });
      if(out && out.reply){
        tradOriginal=ta.value; tradShown=out.reply; tradActivo=true;
        ta.value=out.reply; ta.readOnly=false; autoGrow(ta); // editable: podés corregir en español
        if(hint) hint.style.display="block";
        t.innerHTML="↩ Ver envío"; t.title="Te muestra el texto en el idioma del lead, con tu edición ya traducida (eso es lo que se manda)";
      } else { note("No pude traducir."); t.innerHTML="⇄ Traducir"; }
    }catch(err){ note("No pude traducir: "+err.message); t.innerHTML="⇄ Traducir"; }
    t.disabled=false; return;
  }
  if(t.dataset.enviarmail){
    const id=t.dataset.enviarmail; const l=leads.find(x=>x.id===id); if(!l) return;
    const ta=document.getElementById("lreply");
    if(!(ta?ta.value:"").trim()){ note("Escribí o generá una respuesta antes de enviar."); return; }
    if(!l.email){ note("Este lead no tiene email."); return; }
    t.disabled=true; const prev=t.textContent;
    // Resolver el texto que SE ENVÍA (siempre en el idioma del lead)
    let bodyTxt;
    if(tradActivo){
      if((ta.value||"").trim()===tradShown.trim()){ bodyTxt=tradOriginal.trim(); } // no editó -> original exacto
      else {
        t.textContent="Traduciendo…";
        try{ const o=await callFn("sugerir",{translate:true,to:"match",reference:tradOriginal,message:ta.value}); bodyTxt=((o&&o.reply)||"").trim(); }
        catch(err){ note("No pude traducir tu edición para enviar: "+err.message); t.disabled=false; t.textContent=prev; return; }
      }
    } else { bodyTxt=ta.value.trim(); }
    if(!bodyTxt){ note("No pude preparar el texto a enviar."); t.disabled=false; t.textContent=prev; return; }
    t.textContent="Enviando…";
    try{
      await callFn("enviar", {
        lead_id:id, to:l.email,
        subject: l.service?("Re: "+l.service+" — LORENZO"):"Gracias por tu consulta — LORENZO",
        body: bodyTxt,
        suggestion: ta && ta.dataset.orig ? ta.dataset.orig : ""
      });
      try{ await sb.from("touches").insert({lead_id:id,tipo:"mail",texto:bodyTxt}); }catch(e){}
      try{ await sb.from("leads").update(avanzarCadencia(l.cadenciaPaso)).eq("id",id); }catch(e){}
      note("✅ Enviado a "+l.email);
      openLeadId=null; await loadAll();
    }catch(err){ note(err.message); t.disabled=false; t.textContent=prev; }
    return;
  }
  if(t.dataset.calllead){ callLeadId=t.dataset.calllead; const cl=leads.find(x=>x.id===callLeadId); callLang=cl?langOf(cl):"es"; renderApp(); return; }
  if(t.dataset.closecall){ stopTranscripcion(); callLeadId=null; callLang=null; renderApp(); return; }
  if(t.dataset.calllang){
    const estaba=transcribiendo; if(estaba) stopTranscripcion();
    const ta=document.getElementById("callnote"); const v=ta?ta.value:"";
    callLang=t.dataset.calllang; renderApp();
    const ta2=document.getElementById("callnote"); if(ta2) ta2.value=v;
    if(estaba) note("Idioma cambiado a "+callLang.toUpperCase()+" — tocá 🎙 de nuevo para seguir transcribiendo.");
    return;
  }
  if(t.dataset.trans){
    const l=leads.find(x=>x.id===callLeadId);
    const live=document.getElementById("translive");
    if(transcribiendo){
      stopTranscripcion();
      t.textContent="🎙 Transcribir en vivo";
      if(live) live.style.display="none";
    } else if(startTranscripcion(callLang || (l ? langOf(l) : "es"))){
      t.textContent="⏹ Detener";
      if(live){ live.style.display="inline"; live.textContent="● CAPTURANDO 0:00"; }
      startRelojTrans();
    }
    return;
  }
  if(t.dataset.callres){
    const id=callLeadId; const l=leads.find(x=>x.id===id); if(!l){ stopTranscripcion(); callLeadId=null; renderApp(); return; }
    let res=t.dataset.callres; const noteEl=document.getElementById("callnote"); let txt=noteEl?noteEl.value.trim():"";
    const esTranscripcion = txt.length>250; // texto largo = transcripción real, no una notita
    if(res==="auto" && !esTranscripcion){
      note("Para que el agente clasifique, transcribí la llamada (al menos ~30 segundos) — o elegí una opción a mano.");
      return; // el modal queda abierto, no se pierde nada
    }
    stopTranscripcion(); callLeadId=null; callLang=null; renderApp();
    // 1) Separar hablantes: el agente reescribe la transcripción como diálogo con nombres
    if(esTranscripcion){
      note("🗣 Separando hablantes…");
      try{
        const d=await callFn("sugerir",{ dialogar:true, transcript:txt, name:l.name||"", service:l.service||"" });
        if(d && d.reply) txt=d.reply;
      }catch(e){ /* si falla, se guarda la transcripción cruda igual */ }
    }
    // 2) Análisis (antes de guardar, así el agente puede clasificar cómo salió)
    let analisis=null;
    if(esTranscripcion){
      note("🧠 Analizando la llamada…");
      try{
        const out=await callFn("sugerir",{ analizar:true, transcript:txt, name:l.name||"", service:l.service||"" });
        if(out && out.reply) analisis=out.reply;
      }catch(err){ note("No pude analizar la llamada: "+err.message); }
    }
    // 3) Si eligió "auto", el AGENTE clasifica el resultado desde el análisis
    if(res==="auto"){
      const a=(analisis||"").toLowerCase();
      if(!analisis) res="atendio_interesado";
      else if(/agend/.test(a)) res="agendo";
      else if(/temperatura:\s*fr/.test(a)) res="atendio_frio";
      else res="atendio_interesado";
    }
    if(transDur>=5) txt = "⏱ Duración: "+fmtDur(transDur)+"\n"+txt; // queda arriba del diálogo, y el registro la lee de acá
    try{ await sb.from("touches").insert({lead_id:id,tipo:"llamada",resultado:res,texto:txt||null}); }catch(e){}
    transDur=0;
    try{ await sb.from("leads").update(avanzarCadencia(l.cadenciaPaso)).eq("id",id); }catch(e){}
    note("📞 Llamada registrada"+(t.dataset.callres==="auto"?(" — el agente la clasificó: "+(CALL_RES[res]||res)):"")+".");
    // 4) Guardar el análisis y la sugerencia de avance (la barra solo se mueve cuando un humano aprueba)
    if(analisis){
      try{ await sb.from("touches").insert({lead_id:id,tipo:"nota",texto:"🧠 Análisis de la llamada:\n"+analisis}); }catch(e){}
      const mAv=analisis.match(/AVANCE SUGERIDO:\s*(\d{1,3})\s*%\s*[—–-]*\s*([^\n(]*)/i);
      if(mAv){
        const mFr=analisis.match(/FRENO:\s*([^\n]+)/i), mFa=analisis.match(/FALTA:\s*([^\n]+)/i);
        const sug={ pct:Math.max(0,Math.min(100,Number(mAv[1]))), etapa:(mAv[2]||"").trim()||null,
                    freno:mFr?mFr[1].trim():null, falta:mFa?mFa[1].trim():null, fecha:new Date().toISOString() };
        try{ await sb.from("leads").update({cierre_sug:sug}).eq("id",id); }catch(e){}
      }
      note("🧠 Análisis guardado en la línea de tiempo del lead.");
    }
    await loadAll(); return;
  }
  if(t.dataset.invfilter){ invFilter=t.dataset.invfilter; renderApp(); return; }
  if(t.dataset.invpaid){
    const {error}=await sb.from("invoices").update({status:"pagada"}).eq("id",t.dataset.invpaid);
    if(error){ note("No se pudo marcar: "+error.message); return; }
    note("✓ Factura marcada como pagada.");
    await loadAll(); return;
  }
  if(t.dataset.stepdone){
    // El tilde es solo la marca del día: no toca el estado del lead ni la cadencia.
    const id=t.dataset.stepdone; const l=leads.find(x=>x.id===id); if(!l) return;
    const {error}=await sb.from("touches").insert({lead_id:id,tipo:"nota",texto:"✓ Hecho (Para hoy)"});
    if(error){ note("No se pudo tildar: "+error.message); return; }
    note("✓ Completada — "+(l.name||l.email||""));
    await loadAll(); return;
  }
  if(t.dataset.stepundo){
    const id=t.dataset.stepundo;
    const h0=new Date(); h0.setHours(0,0,0,0);
    const marcas=touches.filter(k=>k.leadId===id && new Date(k.createdAt)>=h0 && /^✓/.test(String(k.texto||"")));
    if(!marcas.length){ note("Ese se completó con un mail o llamada real — no se destilda."); return; }
    for(const x of marcas){
      const {error:de}=await sb.from("touches").delete().eq("id",x.id);
      if(de){ note("No pude sacar el tilde: "+de.message); return; }
    }
    note("Tilde sacado — sigue pendiente.");
    await loadAll(); return;
  }
  if(t.dataset.gotab){ tab=t.dataset.gotab; formOpen=null; editing=null; renderApp(); return; }
  if(t.dataset.invpdf){
    const i=invoices.find(k=>k.id===t.dataset.invpdf); if(!i) return;
    const c=clients.find(z=>z.id===i.clientId)||{};
    const fmt=n=>"$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    // Desglose: cada línea de las notas tipo "Descripción — 500" es un ítem; el resto queda como concepto
    const lines=String(i.notes||"").split(/\n/).map(s=>s.trim()).filter(Boolean);
    const items=[],otras=[];
    for(const ln of lines){ const m=ln.match(/^(.{2,100}?)\s*[|·—–-]+\s*\$?\s*([\d][\d.,]*)\s*$/); if(m) items.push([m[1],Number(m[2].replace(/,/g,""))]); else otras.push(ln); }
    if(!items.length) items.push([otras.join(" · ")||"Servicios profesionales", Number(i.amount)||0]);
    const pag=i.status==="pagada";
    // Total con tarjeta: el monto neto + la tarifa estándar de Stripe (2.9% + $0.30), para no absorber ese costo
    const tarjeta=(Number(i.amount)+0.30)/(1-0.029);

    if(error){ note("No se pudo cambiar el estado: "+error.message); return; }

    await loadAll();

// Propuesta aprobada -> la factura se crea sola (número siguiente, cliente y monto de la propuesta, pendiente)
async function autoFactura(p){
  if(!p) return;
  const marca = "Propuesta "+(p.number||"");
  if(p.number && invoices.some(i=>String(i.notes||"").includes(marca))) return; // ya tiene factura
  const hoy=new Date(); const vence=new Date(); vence.setDate(vence.getDate()+15);
  const iso=d=>d.toISOString().slice(0,10);
  const row={
    number: nextNumber(invoices,"INV"),
    client_id: p.clientId||null,
    amount: Number(p.amount)||0,
    status: "pendiente",
    issued: iso(hoy),
    due: iso(vence),
    notes: `${p.title||"Servicios profesionales"} — ${Number(p.amount)||0}\n${marca}`.trim(),
    created_at: new Date().toISOString(),
  };
  const {error}=await sb.from("invoices").insert(row);
  if(error){ note("La propuesta quedó aprobada, pero no pude crear la factura: "+error.message); return; }
  note("🧾 Factura "+row.number+" creada sola desde la propuesta aprobada — está en FACTURAS, lista para el PDF.");
}

document.addEventListener("submit", async e=>{
  const f=e.target; if(!f.id||!f.id.startsWith("f-")) return;
  e.preventDefault();
  const col=f.id.slice(2);
  const data=Object.fromEntries(new FormData(f).entries());
  const fileInput=f.querySelector('input[type="file"]');
  delete data.__file;
  try{
    if(fileInput && fileInput.files && fileInput.files[0]){
      const file=fileInput.files[0];
      const path=Date.now()+"-"+file.name.replace(/[^\w.\-]/g,"_");
      const up=await sb.storage.from("proposals").upload(path,file,{upsert:false});
      if(up.error){ note("No se pudo subir el PDF; el resto se guarda igual."); }
      else{ const {data:pub}=sb.storage.from("proposals").getPublicUrl(path); data.fileUrl=pub.publicUrl; data.fileName=file.name; }
    }
    if(editing && editing.col===col && !data.fileUrl){
      const prev=(col==="proposals"?proposals:col==="invoices"?invoices:clients).find(x=>x.id===editing.id);
      if(prev && prev.fileUrl){ data.fileUrl=prev.fileUrl; data.fileName=prev.fileName||""; }
    }
    const row=TO[col](data);
    let error;
    if(editing && editing.col===col){ ({error}=await sb.from(col).update(row).eq("id",editing.id)); }
    else { row.created_at=new Date().toISOString(); ({error}=await sb.from(col).insert(row)); }
    if(error){ note("No se pudo guardar: "+error.message); return; }
    if(col==="proposals" && data.status==="aprobada"){
      const prev = editing ? proposals.find(x=>x.id===editing.id) : null;
      if(!prev || prev.status!=="aprobada") await autoFactura({ number:data.number, clientId:data.clientId||null, title:data.title, amount:data.amount });
    }
    formOpen=null; editing=null; await loadAll();
  }catch(err){ note("No se pudo guardar: "+err.message); }
});

    const { error } = await sb.from("leads").update({ status: t.value }).eq("id", t.dataset.lstatus);
    if(error) note("No se pudo cambiar el estado: "+error.message); else await loadAll();
  }
});

/* ---------- login ---------- */
function renderLogin(err){
  document.getElementById("root").innerHTML = `
  <div class="login"><div class="box">
    <h1>LORENZO</h1><div class="sub">AGENCY · PANEL</div>
    <form id="loginf">
      <label><span class="fl">Email</span><input name="email" type="email" required autocomplete="username"></label>
      <label><span class="fl">Contraseña</span><input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit" style="width:100%">Entrar</button>
      <div class="err">${err?esc(err):""}</div>
    </form>
  </div></div>`;
  document.getElementById("loginf").addEventListener("submit", async e=>{
    e.preventDefault();
    const {email,password}=Object.fromEntries(new FormData(e.target).entries());
    const btn=e.target.querySelector("button"); btn.textContent="Entrando…"; btn.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){ renderLogin("Email o contraseña incorrectos."); }
  });
}

/* ---------- boot ---------- */
async function boot(){
  if(!configured){
    document.getElementById("root").innerHTML='<div class="offline">Panel sin configurar.<br>Falta pegar las credenciales de Supabase en config.js.</div>';
    return;
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  sessionEmail = session.user.email||"";
  const {data:adm}=await sb.rpc("is_admin");
  isAdmin=!!adm; canWrite=isAdmin;
  if(!isAdmin) tab="propuestas";
  await loadAll();
  // realtime: sincroniza entre dispositivos
  sb.channel("panel-rt").on("postgres_changes",{event:"*",schema:"public"},()=>loadAll()).subscribe();
}
sb && sb.auth.onAuthStateChange((_e,session)=>{
  if(session && document.getElementById("loginf")){ boot(); }
  else if(!session){ renderLogin(); }
});
boot();
